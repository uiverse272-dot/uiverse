<!doctype html>
<!-- Arabic restaurant menu — Uiverse Originals. Free to use and adapt (MIT). One file, no dependencies.
     A right-to-left ordering screen for a phone: category tabs follow you down the menu, each dish opens a sheet
     with sizes, extras, notes and a quantity, a dot flies to the basket bar, and the basket edits down to a confirmed order. -->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>بيت الزعتر — قائمة الطعام</title>
<style>
  :root {
    --cream: #f8f1e3; --paper: #fffbf2; --tile: #efe4cb; --line: #e4d9c1; --line-2: #cfc2a4;
    --ink: #2a2213; --soft: #665b45; --olive: #47521f; --olive-d: #333b15; --olive-soft: #e7e6c8; --on-olive: #d9dbb3;
    --terra: #a5411d; --terra-d: #8b3515; --terra-soft: #f6e0d2;
    --ar: "SF Arabic", "Geeza Pro", "Segoe UI", "Noto Sans Arabic", Tahoma, sans-serif;
    --ease: cubic-bezier(.2, .8, .2, 1);
    --top: 44px; --tabs: 49px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--cream); color: var(--ink); font: 400 15px/1.5 var(--ar); font-variant-numeric: tabular-nums; overflow: hidden; -webkit-font-smoothing: antialiased; }
  button, input, textarea { font: inherit; color: inherit; }
  button { border: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  ul { list-style: none; }
  svg { display: block; }
  svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  :focus-visible { outline: 2px solid var(--terra); outline-offset: 2px; border-radius: 6px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  [hidden] { display: none !important; }

  .phone { position: relative; height: 100%; max-width: 430px; margin: 0 auto; overflow: hidden; overflow: clip; background: var(--cream); }
  @media (min-width: 431px) { .phone { box-shadow: 0 0 0 1px var(--line); } }

  .status { position: absolute; inset: 0 0 auto; height: var(--top); z-index: 6; display: flex; align-items: center; justify-content: space-between; padding: 6px 24px 0; background: var(--olive-d); color: #fbf6e6; font-size: 15px; font-weight: 600; pointer-events: none; }
  .status .sig { display: flex; align-items: center; gap: 6px; direction: ltr; }
  .status svg { fill: currentColor; }
  .status time { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

  .menu { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scrollbar-width: none; }
  .menu::-webkit-scrollbar { display: none; }

  /* ---------- header ---------- */
  .hero { position: relative; background: var(--olive-d); color: #fbf6e6; padding: calc(var(--top) + 12px) 16px 56px; min-height: 244px; overflow: hidden; }
  .hero .tilework { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hero .arches { position: absolute; left: 12px; bottom: 44px; width: 168px; height: auto; }
  .hero-copy { position: relative; width: calc(100% - 172px); }
  h1 { font-size: 30px; line-height: 40px; font-weight: 800; letter-spacing: 0; white-space: nowrap; }
  .tagline { font-size: 13.5px; line-height: 20px; color: var(--on-olive); margin-top: 2px; }
  .hero-tools { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
  .seg { position: relative; display: grid; grid-template-columns: 1fr 1fr; flex: none; width: 134px; height: 36px; padding: 2px; background: rgba(255, 251, 242, .14); border-radius: 10px; }
  .seg::before { content: ""; position: absolute; inset: 2px auto 2px 2px; width: calc(50% - 2px); background: var(--paper); border-radius: 8px; transform: translateX(100%); transition: transform .22s var(--ease); }
  .seg[data-mode="pickup"]::before { transform: none; }
  .seg button { position: relative; font-size: 13.5px; font-weight: 600; color: #fbf6e6; border-radius: 8px; transition: color .18s ease-out; }
  .seg button[aria-pressed="true"] { color: var(--ink); }
  .hero :focus-visible { outline-color: #fbf6e6; }
  .gear { width: 36px; height: 36px; flex: none; border-radius: 10px; background: rgba(255, 251, 242, .14); display: grid; place-items: center; transition: background .15s ease-out; }
  .gear:hover { background: rgba(255, 251, 242, .24); }
  .gear svg.i { width: 20px; height: 20px; }

  .facts { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1.15fr 1fr; margin: -36px 16px 0; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; }
  .facts div { padding: 10px 8px 10px; text-align: center; min-width: 0; }
  .facts div + div { border-inline-start: 1px solid var(--line); }
  .facts b { display: flex; justify-content: center; align-items: center; gap: 4px; font-size: 16px; line-height: 22px; font-weight: 700; white-space: nowrap; }
  .facts small { display: block; font-size: 12px; line-height: 16px; color: var(--soft); white-space: nowrap; }
  .facts svg { width: 14px; height: 14px; fill: var(--terra); }

  /* ---------- category tabs ---------- */
  .tabs-wrap { position: sticky; top: var(--top); z-index: 4; background: var(--cream); margin-top: 8px; border-bottom: 1px solid var(--line); }
  .tabs { position: relative; display: flex; gap: 4px; height: calc(var(--tabs) - 1px); padding: 0 12px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; padding: 0 10px; font-size: 15px; font-weight: 600; color: var(--soft); transition: color .18s ease-out; white-space: nowrap; }
  .tab[aria-current="true"] { color: var(--ink); font-weight: 700; }
  .tab:focus-visible { outline-offset: -4px; }
  @media (hover: hover) {
    .tab:hover { color: var(--ink); }
    .dish:hover .mark:not(.on) { background: var(--olive); color: var(--paper); box-shadow: 0 0 0 1px var(--olive); }
    .edit:hover, .where button:hover { color: var(--terra-d); }
  }
  .ink { position: absolute; bottom: 0; left: 0; height: 3px; width: 40px; border-radius: 3px 3px 0 0; background: var(--terra); pointer-events: none; }
  .ready .ink { transition: transform .26s var(--ease), width .26s var(--ease); }

  /* ---------- dishes ---------- */
  .sec { padding: 20px 16px 4px; }
  .sec h2 { font-size: 20px; line-height: 28px; font-weight: 800; }
  .dish { display: grid; grid-template-columns: 1fr 92px; gap: 12px; width: 100%; padding: 12px 0 16px; text-align: start; align-items: start; transition: opacity .15s ease-out; }
  .sec li + li { border-top: 1px solid var(--line); }
  .sec li + li .dish { padding-top: 16px; }
  .dish:active { opacity: .72; }
  .dish:focus-visible { outline-offset: 2px; }
  .dish .t { min-width: 0; display: block; }
  .dish b { display: block; font-size: 16px; line-height: 24px; font-weight: 700; }
  .dish small { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 13px; line-height: 20px; color: var(--soft); margin-top: 2px; }
  .dish .p { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; margin-top: 6px; font-size: 15px; line-height: 20px; font-weight: 700; color: var(--terra); }
  .dish .p em { font-style: normal; font-size: 12.5px; font-weight: 600; color: var(--olive); }
  .art { position: relative; display: block; width: 92px; height: 92px; border-radius: 14px; background: var(--tile); }
  .art svg { width: 100%; height: 100%; }
  .mark { position: absolute; left: -4px; bottom: -4px; width: 28px; height: 28px; border-radius: 50%; background: var(--paper); box-shadow: 0 0 0 1px var(--line-2); display: grid; place-items: center; font-size: 13px; font-weight: 700; font-style: normal; color: var(--olive); transition: background .18s ease-out, color .18s ease-out; }
  .mark svg.i { width: 16px; height: 16px; stroke-width: 2.25; }
  .mark.on { background: var(--terra); color: #fff; box-shadow: 0 0 0 2px var(--cream); }

  .colophon { margin: 12px 0 0; padding: 16px 0 124px; border-top: 1px solid var(--line); font-size: 13px; line-height: 21px; color: var(--soft); }
  .colophon b { display: block; color: var(--ink); font-weight: 700; margin-top: 8px; }
  .colophon b:first-child { margin-top: 0; }
  .sec:last-of-type { min-height: calc(100vh - var(--top) - var(--tabs)); }

  /* ---------- basket bar ---------- */
  .bar { position: absolute; inset: auto 16px 20px; z-index: 5; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; height: 60px; padding: 0 12px 0 16px; background: var(--terra); color: #fff; border-radius: 16px; text-align: start; box-shadow: 0 8px 18px -10px rgba(70, 26, 8, .65); transition: transform .26s var(--ease), opacity .18s ease-out, background .15s ease-out; }
  .bar:hover { background: var(--terra-d); }
  .bar.off { transform: translateY(90px); opacity: 0; pointer-events: none; visibility: hidden; }
  .bar:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 16px; }
  .bar .n { min-width: 36px; height: 36px; padding: 0 8px; border-radius: 10px; background: rgba(255, 255, 255, .18); display: grid; place-items: center; font-size: 16px; font-weight: 700; }
  .bar .l { font-size: 16px; font-weight: 700; }
  .bar .tot { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; }
  .bar .tot svg.i { width: 20px; height: 20px; }

  .fly { position: absolute; left: 0; top: 0; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: var(--terra); box-shadow: 0 0 0 2px var(--paper); z-index: 20; pointer-events: none; }

  /* ---------- sheets ---------- */
  .scrim { position: absolute; inset: 0; z-index: 7; background: rgba(38, 30, 12, .5); opacity: 0; pointer-events: none; transition: opacity .22s ease-out; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .sheet { position: absolute; inset: auto 0 0; z-index: 8; display: flex; flex-direction: column; max-height: calc(100% - var(--top) - 8px); background: var(--paper); border-radius: 20px 20px 0 0; transform: translateY(102%); visibility: hidden; transition: transform .3s var(--ease), visibility 0s .3s; }
  .sheet.on { transform: none; visibility: visible; transition: transform .3s var(--ease), visibility 0s; }
  .sheet.drag { transition: none; }
  .grab { flex: none; height: 24px; display: grid; place-items: center; touch-action: none; cursor: grab; }
  .grab::after { content: ""; width: 40px; height: 4px; border-radius: 2px; background: var(--line-2); }
  .x { width: 40px; height: 40px; flex: none; border-radius: 12px; display: grid; place-items: center; transition: background .15s ease-out; }
  .x:hover { background: #f2e9d6; }
  .x svg.i { width: 20px; height: 20px; }

  /* dish sheet */
  .dsheet .x { position: absolute; left: 24px; top: 32px; background: var(--paper); box-shadow: 0 0 0 1px var(--line); z-index: 1; }
  .scrolly { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
  .scrolly::-webkit-scrollbar { display: none; }
  .banner { display: grid; place-items: center; height: 128px; margin: 0 16px; border-radius: 16px; background: var(--tile); }
  .banner svg { width: 112px; height: 112px; }
  .dhead { padding: 16px 16px 4px; }
  .dhead h3 { font-size: 22px; line-height: 30px; font-weight: 800; }
  .dhead p { font-size: 14px; line-height: 22px; color: var(--soft); }
  fieldset { border: 0; padding: 0 16px; margin-top: 16px; min-width: 0; }
  legend { display: flex; justify-content: space-between; align-items: baseline; width: 100%; padding: 0 0 4px; font-size: 15px; font-weight: 700; }
  legend small { font-size: 12.5px; font-weight: 400; color: var(--soft); }
  .opt { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 4px 0; cursor: pointer; }
  .opt + .opt { border-top: 1px solid var(--line); }
  .opt input { appearance: none; -webkit-appearance: none; flex: none; width: 22px; height: 22px; border: 1.5px solid var(--line-2); background: var(--paper); display: grid; place-items: center; cursor: pointer; transition: background .15s ease-out, border-color .15s ease-out; }
  .opt input[type="radio"] { border-radius: 50%; }
  .opt input[type="checkbox"] { border-radius: 6px; }
  .opt input:checked { background: var(--olive); border-color: var(--olive); }
  .opt input[type="radio"]:checked::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--paper); }
  .opt input[type="checkbox"]:checked::after { content: ""; width: 10px; height: 5px; margin-top: -3px; border: solid var(--paper); border-width: 0 0 2px 2px; transform: rotate(-45deg); }
  .opt span { flex: 1; font-size: 15px; }
  .opt em { font-style: normal; font-size: 14px; color: var(--soft); white-space: nowrap; }
  .notes { display: block; padding: 16px 16px 16px; }
  .notes > span { display: flex; justify-content: space-between; align-items: baseline; font-size: 15px; font-weight: 700; }
  .notes small { font-size: 12.5px; font-weight: 400; color: var(--soft); }
  .notes textarea { display: block; width: 100%; height: 72px; margin-top: 8px; padding: 10px 12px; resize: none; border: 1px solid var(--line-2); border-radius: 12px; background: #fffdf8; font-size: 14px; line-height: 22px; transition: border-color .15s ease-out; }
  .notes textarea::placeholder { color: #736850; }
  .notes textarea:focus { outline: none; border-color: var(--olive); box-shadow: 0 0 0 1px var(--olive); }
  .sfoot { flex: none; display: flex; gap: 12px; padding: 12px 16px 20px; border-top: 1px solid var(--line); background: var(--paper); }
  .stepper { display: flex; align-items: center; flex: none; }
  .stepper button { width: 44px; height: 48px; display: grid; place-items: center; border-radius: 12px; background: #f2e9d6; transition: background .15s ease-out, opacity .15s ease-out; }
  .stepper button:hover:not(:disabled) { background: #e9dec6; }
  .stepper button:disabled { opacity: .4; cursor: default; }
  .stepper svg.i { width: 18px; height: 18px; stroke-width: 2.25; }
  .stepper output { min-width: 36px; text-align: center; font-size: 17px; font-weight: 700; }
  .cta { flex: 1; min-width: 0; height: 48px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; border-radius: 12px; background: var(--terra); color: #fff; font-size: 15.5px; font-weight: 700; white-space: nowrap; transition: background .15s ease-out; }
  .cta:hover:not(:disabled) { background: var(--terra-d); }
  .cta:disabled { background: #d8cdb6; color: #5e5440; cursor: not-allowed; }
  .cta:focus-visible { outline-color: var(--ink); }

  /* basket */
  .bsheet { height: calc(100% - var(--top) - 8px); }
  .bhead { display: flex; align-items: center; justify-content: space-between; padding: 0 16px 8px 12px; }
  .bhead h3 { font-size: 22px; line-height: 30px; font-weight: 800; }
  .where { display: flex; align-items: flex-start; gap: 8px; margin: 0 16px; padding: 10px 12px; background: var(--olive-soft); border-radius: 12px; font-size: 13.5px; line-height: 20px; }
  .where svg.i { width: 20px; height: 20px; color: var(--olive); }
  .where div { flex: 1; min-width: 0; }
  .where b { display: block; font-weight: 700; }
  .where button { flex: none; align-self: center; min-height: 36px; padding: 0 8px; color: var(--olive-d); font-size: 13px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; border-radius: 8px; }
  .lines { padding: 8px 16px 0; }
  .line { display: grid; grid-template-columns: 56px 1fr; gap: 12px; padding: 12px 0; }
  .line + .line { border-top: 1px solid var(--line); }
  .line .thumb { width: 56px; height: 56px; border-radius: 10px; background: var(--tile); }
  .line .thumb svg { width: 100%; height: 100%; }
  .line .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .line b { font-size: 15px; line-height: 22px; font-weight: 700; min-width: 0; }
  .line .lp { flex: none; font-size: 15px; font-weight: 700; }
  .line p { font-size: 12.5px; line-height: 18px; color: var(--soft); margin-top: 2px; overflow-wrap: anywhere; }
  .line .ctl { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .mini { display: flex; align-items: center; border: 1px solid var(--line-2); border-radius: 10px; }
  .mini button { width: 36px; height: 34px; display: grid; place-items: center; border-radius: 9px; transition: background .15s ease-out; }
  .mini button:hover:not(:disabled) { background: #f2e9d6; }
  .mini button:disabled { opacity: .35; cursor: default; }
  .mini svg.i { width: 16px; height: 16px; stroke-width: 2.25; }
  .mini .del { color: var(--terra); }
  .mini output { min-width: 26px; text-align: center; font-weight: 700; font-size: 15px; }
  .edit { min-height: 34px; padding: 0 4px; font-size: 13px; font-weight: 700; color: var(--olive-d); text-decoration: underline; text-underline-offset: 3px; border-radius: 6px; }
  .more { display: flex; align-items: center; gap: 8px; margin: 0 16px; min-height: 44px; font-size: 14px; font-weight: 700; color: var(--terra); border-radius: 8px; }
  .more svg.i { width: 18px; height: 18px; stroke-width: 2; }
  .sums { margin: 8px 16px 0; padding: 12px 0 16px; border-top: 1px solid var(--line); font-size: 14px; }
  .sums div { display: flex; justify-content: space-between; line-height: 28px; }
  .sums dt { color: var(--soft); }
  .sums dd { font-weight: 600; }
  .sums .free { color: var(--olive); font-weight: 700; }
  .meter { margin-top: 8px; font-size: 12.5px; line-height: 18px; color: var(--soft); }
  .meter i { display: block; height: 4px; margin-bottom: 6px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .meter i b { display: block; height: 100%; width: 100%; background: var(--olive); border-radius: 2px; transform-origin: 100% 50%; transition: transform .3s var(--ease); }
  .bfoot { flex: none; padding: 12px 16px 20px; border-top: 1px solid var(--line); background: var(--paper); }
  .bfoot .tl { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; font-size: 16px; font-weight: 800; }
  .bfoot .tl small { font-size: 12px; font-weight: 400; color: var(--soft); margin-inline-start: 6px; }
  .bfoot .warn { font-size: 13px; line-height: 20px; color: var(--terra-d); margin-bottom: 8px; }
  .bfoot .cta { width: 100%; justify-content: center; }
  .blank, .done { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px 32px 56px; }
  .blank svg.art-b { width: 120px; height: 120px; margin-bottom: 12px; }
  .blank h4, .done h4 { font-size: 20px; line-height: 28px; font-weight: 800; }
  .blank p, .done p { color: var(--soft); font-size: 14px; line-height: 22px; margin-top: 4px; }
  .pill-btn { margin-top: 16px; height: 44px; padding: 0 20px; border-radius: 12px; background: #f2e9d6; font-size: 14.5px; font-weight: 700; transition: background .15s ease-out; }
  .pill-btn:hover { background: #e9dec6; }
  .seal { width: 72px; height: 72px; margin-bottom: 16px; border-radius: 50%; background: var(--olive); color: #fffbf2; display: grid; place-items: center; animation: seal .34s var(--ease); }
  .seal svg.i { width: 34px; height: 34px; stroke-width: 2.25; }
  @keyframes seal { from { transform: scale(.7); opacity: 0; } }
  .done dl { width: 100%; margin-top: 20px; padding: 4px 16px; background: var(--cream); border-radius: 14px; text-align: start; }
  .done dl div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; font-size: 14px; line-height: 20px; }
  .done dl div + div { border-top: 1px solid var(--line); }
  .done dt { color: var(--soft); }
  .done dd { font-weight: 700; }

  /* settings */
  .ssheet .bhead { padding-bottom: 4px; }
  .ssheet p.hint { padding: 0 16px; font-size: 14px; color: var(--soft); }
  .numbers { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 16px 28px; }
  .numbers label { display: block; padding: 12px; border: 1px solid var(--line-2); border-radius: 12px; cursor: pointer; transition: border-color .15s ease-out, background .15s ease-out; }
  .numbers label b { display: block; font-size: 20px; line-height: 28px; font-weight: 700; }
  .numbers label small { font-size: 12.5px; color: var(--soft); }
  .numbers label:has(input:checked) { border-color: var(--olive); box-shadow: inset 0 0 0 1px var(--olive); background: #f6f4e2; }
  .numbers label:has(input:focus-visible) { outline: 2px solid var(--terra); outline-offset: 2px; }

  .toast { position: absolute; inset: auto 16px 96px; z-index: 12; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; padding: 6px 16px 6px 8px; background: var(--ink); color: #fbf6e6; border-radius: 12px; font-size: 14px; opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .18s ease-out, transform .2s var(--ease); }
  .toast.on { opacity: 1; transform: none; pointer-events: auto; }
  .toast span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toast button { flex: none; height: 32px; padding: 0 8px; font-weight: 700; color: #f3c9a8; border-radius: 8px; }
  .toast button:focus-visible { outline-color: #f3c9a8; }

  @media (max-width: 374px) {
    h1 { font-size: 26px; }
    .hero .arches { width: 146px; }
    .hero-copy { width: calc(100% - 152px); }
    .seg { width: 118px; }
    .facts small { font-size: 11.5px; }
    .tagline { font-size: 13px; }
    .cta { padding: 0 12px; gap: 4px; font-size: 15px; }
    .stepper button { width: 40px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>

  $('qPlus').addEventListener('click', function () { if (qty < 20) qty++; paintDish(); if ($('qPlus').disabled) $('qMinus').focus(); });
  $('sections').addEventListener('click', function (e) { var b = e.target.closest('.dish'); if (b) openDish(b.dataset.dish, b); });

  function addLine(l) {
    var k = lineKey(l), same = cart.find(function (x) { return lineKey(x) === k; });
    if (same) same.qty = Math.min(20, same.qty + l.qty); else cart.push(l);
  }
  function fly(from) {
    if (calm.matches || !from.animate) { paintBar(true); return; }
    var box = $('phone').getBoundingClientRect(), a = from.getBoundingClientRect(), bar = $('bar'), n = $('barN');
    var x0 = a.left + a.width / 2 - box.left, y0 = a.top + a.height / 2 - box.top, x1 = bar.offsetLeft + n.offsetLeft + n.offsetWidth / 2, y1 = bar.offsetTop + n.offsetTop + n.offsetHeight / 2;
    var dot = document.createElement('i'); dot.className = 'fly'; $('phone').appendChild(dot);
    var an = dot.animate([
      { transform: 'translate(' + x0 + 'px,' + y0 + 'px) scale(1)', opacity: 1 },
      { transform: 'translate(' + (x0 + x1) / 2 + 'px,' + (Math.min(y0, y1) - 70) + 'px) scale(1.1)', opacity: 1, offset: .5 },
      { transform: 'translate(' + x1 + 'px,' + y1 + 'px) scale(.5)', opacity: .9 }
    ], { duration: 440, easing: 'cubic-bezier(.3,.1,.5,1)' });
    an.onfinish = function () { dot.remove(); paintBar(true); };
  }
  $('dAdd').addEventListener('click', function () {
    if (openEl !== $('dsheet')) return;
    var l = readDish(), name = DISH[l.dish].name;
    if (editing) {
      var i = cart.indexOf(editing.line); if (i >= 0) cart.splice(i, 1);
      addLine(l);
      var e = editing; editing = null;
      paintMarks(); paintBar();
      backToBasket(e);
      return;
    }
    var from = $('dAdd'), rect = { getBoundingClientRect: function () { return r; }, animate: true }, r = from.getBoundingClientRect();
    barQuietUntil = performance.now() + 450;
    addLine(l);
    paintMarks();
    $('barN').textContent = Math.max(0, count() - l.qty); /* the dot lands, then the count ticks */
    $('bar').classList.remove('off');
    hideSheet($('dsheet'));
    $('live').textContent = 'أضيف ' + name + ' إلى السلة';
    fly(rect);
  });

  /* ---------- the basket ---------- */
  var confirmed = false;
  function renderBasket() {
    var body = $('bBody'), foot = $('bFoot');
    $('bTitle').textContent = confirmed ? 'طلبك' : 'سلتك';
    if (confirmed) {
      foot.hidden = false;
      body.innerHTML = '<div class="done"><span class="seal">' + ic('check') + '</span><h4>وصل طلبك إلى المطبخ</h4><p>' + (mode === 'pickup' ? 'سيكون جاهزًا للاستلام خلال ' : 'سيصلك خلال ') + etaText() + '، وسنرسل لك رسالة عندما يخرج.</p>' +
        '<dl><div><dt>رقم الطلب</dt><dd><bdi dir="ltr" data-raw>#' + orderNo + '</bdi></dd></div><div><dt>المبلغ</dt><dd>' + SAR(lastTotal) + '، الدفع عند ' + (mode === 'pickup' ? 'الاستلام' : 'التوصيل') + '</dd></div></dl></div>';
      foot.innerHTML = '<button class="cta" id="again" type="button">بدء طلب جديد</button>';
      return;
    }
    if (!cart.length) {
      foot.hidden = true;
      body.innerHTML = '<div class="blank"><svg class="art-b" viewBox="0 0 96 96" aria-hidden="true">' + plate() + '<path d="M38 67C42 55 48 45 57 34" fill="none" stroke="#8c9455" stroke-width="1.4" stroke-linecap="round"/>' +
        [[41, 59, 9], [44.5, 51, 9], [49, 44, 8], [53, 38.500, 7]].map(function (q) { return leaf(q[0], q[1], -118, '#8c9455', q[2]) + leaf(q[0], q[1], -6, '#a3aa6c', q[2]); }).join('') + leaf(57, 34, -52, '#8c9455', 8) + '</svg><h4>سلتك فارغة</h4><p>ابدأ بمنقوشة زعتر طازجة، أو تصفّح القائمة على مهلك.</p><button class="pill-btn" id="browse" type="button">العودة إلى القائمة</button></div>';
      return;
    }
    foot.hidden = false;
    var sub = subtotal(), fe = fee(), left = FREE_AT - sub, p = mode === 'pickup';
    body.innerHTML =
      '<div class="where">' + ic(p ? 'store' : 'pin') + '<div><b>' + (p ? 'الاستلام من بيت الزعتر' : 'التوصيل إلى البيت') + '</b>' + (p ? 'شارع صاري، حي الروضة، جدة' : 'شارع الأمير سلطان، حي الروضة') + '</div><button type="button" id="swap">' + (p ? 'أفضّل التوصيل' : 'أفضّل الاستلام') + '</button></div>' +
      '<ul class="lines">' + cart.map(function (l, i) {
        var c = CAT_OF[l.dish], bits = [c.sizes[l.size][0]].concat(l.extras.map(function (e) { return c.extras[e][0]; })), k = esc(lineKey(l));
        return '<li class="line" data-i="' + i + '"><span class="thumb">' + art(l.dish) + '</span><div>' +
          '<div class="top"><b>' + DISH[l.dish].name + '</b><span class="lp">' + SAR(unit(l) * l.qty) + '</span></div>' +
          '<p>' + bits.join('، ') + '</p>' + (l.note ? '<p>«' + esc(l.note) + '»</p>' : '') +
          '<div class="ctl"><div class="mini" role="group" aria-label="كمية ' + DISH[l.dish].name + '">' +
            '<button type="button" data-act="dec" class="' + (l.qty === 1 ? 'del' : '') + '" aria-label="' + (l.qty === 1 ? 'احذف ' + DISH[l.dish].name : 'أنقص الكمية') + '">' + ic(l.qty === 1 ? 'trash' : 'minus') + '</button>' +
            '<output>' + l.qty + '</output>' +
            '<button type="button" data-act="inc" aria-label="زد الكمية"' + (l.qty >= 20 ? ' disabled' : '') + '>' + ic('plus') + '</button>' +
          '</div><button type="button" class="edit" data-act="edit" aria-label="عدّل ' + DISH[l.dish].name + '">تعديل</button></div></div></li>';
      }).join('') + '</ul>' +
      '<button type="button" class="more" id="more">' + ic('plus') + 'أضف طبقًا آخر</button>' +
      '<dl class="sums"><div><dt>المجموع الفرعي</dt><dd>' + SAR(sub) + '</dd></div><div><dt>' + (p ? 'الاستلام' : 'رسوم التوصيل') + '</dt><dd class="' + (fe ? '' : 'free') + '">' + (fe ? SAR(fe) : 'مجانًا') + '</dd></div>' +
      (p ? '' : '<p class="meter"><i><b style="transform:scaleX(' + Math.min(1, sub / FREE_AT).toFixed(3) + ')"></b></i>' + (left > 0 ? 'أضف ' + SAR(left) + ' ويصبح التوصيل مجانيًا' : 'وصلت إلى حد التوصيل المجاني') + '</p>') + '</dl>';
    var low = !p && sub < MIN_ORDER;
    foot.innerHTML = '<div class="tl"><span>الإجمالي<small>شامل الضريبة 15%</small></span><span>' + SAR(sub + fe) + '</span></div>' +
      (low ? '<p class="warn" id="lowNote">الحد الأدنى للتوصيل ' + SAR(MIN_ORDER) + '. أضف ' + SAR(MIN_ORDER - sub) + ' لإتمام الطلب، أو اختر الاستلام.</p>' : '') +
      '<button class="cta" id="place" type="button"' + (low ? ' disabled aria-describedby="lowNote"' : '') + '>تأكيد الطلب</button>';
  }
  function openBasket(from) { confirmed = false; renderBasket(); $('bBody').scrollTop = 0; showSheet($('bsheet'), from); }
  var barQuietUntil = 0; /* the bar sits right under the Add button: a double tap on Add must not open the basket */
  $('bar').addEventListener('click', function (e) { if (e.timeStamp < barQuietUntil) return; openBasket($('bar')); });
  function backToBasket(e) {
    hideSheet($('dsheet'), true);
    renderBasket();
    $('bBody').scrollTop = e.scroll;
    showSheet($('bsheet'), null, $('bBody').querySelectorAll('.edit')[e.idx] || $('bBody').querySelector('.edit'));
  }
  var undoFn = null, toastT = 0;
  function toast(msg, undo) {
    clearTimeout(toastT);
    $('toastM').textContent = msg; undoFn = undo;
    $('toastU').hidden = !undo;
    var foot = $('bFoot');
    $('toast').style.bottom = openEl === $('bsheet') && !foot.hidden ? foot.offsetHeight + 8 + 'px' : '';
    $('toast').classList.add('on');
    toastT = setTimeout(hideToast, undo ? 5000 : 2200);
  }
  function hideToast() { $('toast').classList.remove('on'); undoFn = null; }
  $('toastU').addEventListener('click', function () { var f = undoFn; hideToast(); if (f) f(); });

  function refocusLine(i, sel) {
    var li = $('bBody').querySelectorAll('.line')[i] || [].slice.call($('bBody').querySelectorAll('.line')).pop();
    var t = (li && li.querySelector(sel + ':not(:disabled)')) || (li && li.querySelector('[data-act="inc"]')) || $('bBody').querySelector('#browse') || $('bClose');
    t.focus({ preventScroll: true });
  }
  $('bBody').addEventListener('click', function (e) {
    var a = e.target.closest('[data-act]');
    if (a) {
      var i = +a.closest('.line').dataset.i, l = cart[i], sc = $('bBody').scrollTop;
      if (a.dataset.act === 'inc') { l.qty = Math.min(20, l.qty + 1); after(i, '[data-act="inc"]', sc); }
      else if (a.dataset.act === 'dec') {
        if (l.qty > 1) { l.qty--; after(i, '[data-act="dec"]', sc); }
        else {
          cart.splice(i, 1); after(i, '[data-act="dec"]', sc);
          toast('حذفنا ' + DISH[l.dish].name, function () {
            cart.splice(Math.min(i, cart.length), 0, l);
            after(i, '[data-act="dec"]', sc);
          });
        }
      } else if (a.dataset.act === 'edit') {
        editing = { line: l, scroll: sc, idx: i };
        hideSheet($('bsheet'), true);
        openDish(l.dish, null, l);
      }
      return;
    }
    if (e.target.closest('#swap')) { mode = mode === 'pickup' ? 'delivery' : 'pickup'; paintMode(); renderBasket(); $('swap').focus({ preventScroll: true }); return; }
    if (e.target.closest('#more') || e.target.closest('#browse')) closeOpen();
  });
  function after(i, sel, sc) { paintMarks(); paintBar(); renderBasket(); $('bBody').scrollTop = sc; refocusLine(i, sel); }
  var lastTotal = 0;
  $('bFoot').addEventListener('click', function (e) {
    if (e.target.closest('#place') && !e.target.closest('#place').disabled) {
      lastTotal = subtotal() + fee();
      confirmed = true;
      hideToast();
      renderBasket(); $('bBody').scrollTop = 0;
      $('again').focus({ preventScroll: true });
      $('live').textContent = 'وصل طلبك إلى المطبخ، رقم الطلب ' + orderNo;
    }
    if (e.target.closest('#again')) finishOrder();
  });
  /* however the confirmation is dismissed, the order is placed: the basket starts clean */
  function finishOrder() {
    cart = []; confirmed = false; orderNo++;
    paintMarks(); paintBar();
    hideSheet($('bsheet'));
    menu.scrollTo({ top: 0, behavior: calm.matches ? 'auto' : 'smooth' });
    $('seg').querySelector('[aria-pressed="true"]').focus({ preventScroll: true });
  }

  /* ---------- delivery or pickup ---------- */
  $('seg').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || b.dataset.mode === mode) return;
    mode = b.dataset.mode; paintMode();
  });

  /* ---------- settings: Western or Arabic-Indic digits, everywhere ---------- */
  var indic = false, W = '0123456789', A = '٠١٢٣٤٥٦٧٨٩';
  function flip(s) {
    return indic ? s.replace(/[0-9]/g, function (d) { return A[+d]; }).replace(/(\S),(\S)/g, function (m, a, b) { return /[٠-٩]/.test(a + b) ? a + '٬' + b : m; }).replace(/([٠-٩])\.([٠-٩])/g, '$1٫$2').replace(/([٠-٩])%/g, '$1٪')
      : s.replace(/[٠-٩]/g, function (d) { return W[A.indexOf(d)]; }).replace(/٬/g, ',').replace(/٫/g, '.').replace(/٪/g, '%');
  }
  function flipTree(root) {
    var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), n;
    while ((n = w.nextNode())) {
      var p = n.parentNode;
      if (p.closest('[data-raw]') || p.closest('svg') || p.tagName === 'TEXTAREA') continue;
      var t = flip(n.nodeValue);
      if (t !== n.nodeValue) n.nodeValue = t;
    }
  }
  new MutationObserver(function (list) {
    if (!indic) return;
    list.forEach(function (m) {
      if (m.type === 'characterData') { var p = m.target.parentNode; if (p && !p.closest('[data-raw]') && !p.closest('svg')) { var t = flip(m.target.nodeValue); if (t !== m.target.nodeValue) m.target.nodeValue = t; } }
      else [].forEach.call(m.addedNodes, function (a) { if (a.nodeType === 1) flipTree(a); else if (a.nodeType === 3 && a.parentNode) flipTree(a.parentNode); });
    });
  }).observe($('phone'), { subtree: true, childList: true, characterData: true });
  $('gear').addEventListener('click', function () { showSheet($('ssheet'), $('gear'), document.querySelector('[name=digits]:checked')); });
  $('ssheet').addEventListener('change', function (e) {
    if (e.target.name !== 'digits') return;
    indic = e.target.value === 'a';
    flipTree($('phone'));
    placeInk();
  });

  /* ---------- go ---------- */
  paintMarks(); paintBar(); paintMode();
  setActive(0, false);
  $('bar').style.transition = 'none'; void $('bar').offsetHeight; $('bar').style.transition = '';
  requestAnimationFrame(function () { requestAnimationFrame(function () { document.body.classList.add('ready'); }); });
  addEventListener('resize', function () { placeInk(); });
})();
</script>
</body>
</html>
