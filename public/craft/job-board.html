<!doctype html>
<!-- Job board — Uiverse Originals. Free to use and adapt (MIT). One file, no dependencies.
     A jobs board set like a newspaper's classifieds: search, a filter rail with live counts and a salary
     range, a full posting with a salary band, a short application with a simulated CV upload, saved roles,
     and j / k to read down the list. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roster — Design and engineering jobs</title>
<style>
:root {
  --paper: #f7f4ee; --paper-2: #efebe1; --white: #fffdf9; --ink: #111110; --soft: #55524a; --dim: #6a665c; --line: #d8d3c5; --red: #cf3413; --red-ink: #b02a0e;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: "Helvetica Neue", Arial, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font: 14px/1.45 var(--sans); font-variant-numeric: tabular-nums; overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { border: 0; background: none; cursor: pointer; }
a { color: inherit; }
ul { list-style: none; }
svg { display: block; }
.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: square; stroke-linejoin: miter; flex: none; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { display: grid; grid-template-rows: auto auto minmax(0, 1fr); height: 100svh; }

/* masthead */
.mast { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 24px; padding: 14px 24px 10px; border-bottom: 2px solid var(--ink); }
.mast .line { color: var(--soft); font-size: 13px; padding-bottom: 5px; }
h1 { font: 700 38px/1 var(--serif); letter-spacing: -.02em; text-align: center; }
h1 a { text-decoration: none; }
.tabs { display: flex; justify-content: flex-end; gap: 20px; }
.tab { height: 30px; font-size: 14px; font-weight: 500; border-bottom: 2px solid transparent; color: var(--soft); transition: color .15s, border-color .15s; }
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { color: var(--ink); border-color: var(--ink); }
.tab b { font-weight: 500; }

/* search */
.find { display: grid; grid-template-columns: 1fr 340px auto; border-bottom: 1px solid var(--ink); background: var(--white); }
.fld { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 24px; border-right: 1px solid var(--line); min-width: 0; }
.fld .i { color: var(--soft); }
.fld input { flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: none; font: 400 19px/1 var(--serif); }
.fld input::placeholder { color: var(--dim); }
.fld:focus-within { box-shadow: inset 0 -2px 0 var(--ink); }
.fld .x { display: none; width: 28px; height: 28px; place-items: center; color: var(--soft); }
.fld .x:hover { color: var(--ink); }
.fld.has .x { display: grid; }
.fld .x .i { width: 16px; height: 16px; }
.slash { min-width: 22px; height: 22px; padding: 0 6px; border: 1px solid var(--line); display: grid; place-items: center; font-size: 12px; color: var(--soft); }
.fld.has .slash, .fld:focus-within .slash { display: none; }
.sw { display: flex; align-items: center; gap: 12px; padding: 0 24px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.sw input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.sw i { position: relative; width: 34px; height: 18px; border: 1px solid var(--ink); background: var(--white); transition: background .15s; flex: none; }
.sw i::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; background: var(--ink); transition: transform .18s var(--ease), background .15s; }
.sw input:checked + i { background: var(--ink); }
.sw input:checked + i::after { transform: translateX(16px); background: var(--white); }
.sw input:focus-visible + i { outline: 2px solid var(--red); outline-offset: 2px; }

/* the three columns */
.cols { display: grid; grid-template-columns: 264px 472px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); min-height: 0; }
.rail, .list, .post { min-height: 0; min-width: 0; }
.rail, .rows, .scroll { position: relative; }
#cvFile { position: fixed; left: 0; top: 0; }

/* rail */
.rail { overflow-y: auto; border-right: 1px solid var(--ink); padding: 0 24px 32px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; transition: opacity .15s; }
.rail[inert] { opacity: .45; }
.railhead { display: flex; align-items: baseline; justify-content: space-between; padding: 16px 0 12px; }
.railhead h2 { font: 700 19px/1.2 var(--serif); }
.reset { color: var(--red-ink); font-size: 13px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.reset[hidden] { display: none; }
.railclose.sq { display: none; }
fieldset { border: 0; border-top: 1px solid var(--line); padding: 12px 0 14px; }
legend { float: left; width: 100%; font-weight: 700; font-size: 13px; margin-bottom: 8px; }
legend + * { clear: both; }
.ck { display: flex; align-items: center; gap: 10px; min-height: 28px; cursor: pointer; }
.ck input { appearance: none; -webkit-appearance: none; width: 16px; height: 16px; border: 1px solid var(--ink); background: var(--white); display: grid; place-items: center; flex: none; cursor: pointer; transition: background .12s; }
.ck input:checked { background: var(--ink); }
.ck input:checked::after { content: ""; width: 9px; height: 5px; border: 1.5px solid var(--white); border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg); }
.ck span { flex: 1; }
.ck small { font-size: 13px; color: var(--soft); }
.ck:hover span { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.ck.none span, .ck.none small { color: var(--dim); }
.range { display: flex; justify-content: space-between; font-weight: 500; }
.dual { position: relative; height: 24px; margin-top: 4px; }
.dual .tr { position: absolute; left: 0; right: 0; top: 11px; height: 1px; background: var(--ink); opacity: .3; }
.dual .fl { position: absolute; top: 10px; height: 3px; background: var(--ink); }
.dual input { position: absolute; inset: 0; width: 100%; height: 24px; background: none; pointer-events: none; -webkit-appearance: none; appearance: none; outline: none; }
.dual input::-webkit-slider-thumb { -webkit-appearance: none; pointer-events: auto; width: 14px; height: 20px; background: var(--ink); border: 2px solid var(--paper); cursor: ew-resize; }
.dual input::-moz-range-thumb { pointer-events: auto; width: 12px; height: 18px; border-radius: 0; background: var(--ink); border: 2px solid var(--paper); cursor: ew-resize; }
.dual input:focus-visible::-webkit-slider-thumb { outline: 2px solid var(--red); outline-offset: 1px; }
.note { color: var(--soft); font-size: 12.5px; margin-top: 2px; }
.pays { width: 100%; border-collapse: collapse; }
.pays button { display: flex; justify-content: space-between; gap: 12px; width: 100%; min-height: 28px; align-items: center; text-align: left; }
.pays button:hover span { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.pays button[aria-pressed="true"] span { font-weight: 700; }
.pays b { font-weight: 500; }

/* list */
.list { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; border-right: 1px solid var(--ink); }
.lhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 48px; padding: 0 24px; border-bottom: 1px solid var(--line); }
.lhead .n { font: 700 19px/1 var(--serif); white-space: nowrap; }
.lhead .r { display: flex; align-items: center; gap: 8px; }
.sort { display: flex; align-items: center; gap: 6px; color: var(--soft); font-size: 13px; white-space: nowrap; }
.sort select { -webkit-appearance: none; appearance: none; border: 0; background: none; padding: 4px 16px 4px 2px; color: var(--ink); font-weight: 500; font-size: 13px; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(-45deg, transparent 50%, var(--ink) 50%); background-size: 5px 5px; background-position: right 6px center, right 1px center; background-repeat: no-repeat; }
.filtersbtn { display: none; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 1px solid var(--ink); font-weight: 500; font-size: 13px; }
.filtersbtn .i { width: 16px; height: 16px; }
.rows { overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; overscroll-behavior: contain; }
.rowwrap { position: relative; border-bottom: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 2px 14px; width: 100%; padding: 14px 24px; text-align: left; transition: background .12s; --mbg: var(--paper); }
.row:hover { background: var(--paper-2); --mbg: var(--paper-2); }
.row:focus-visible { outline-offset: -3px; }
.row .mk { grid-row: span 3; width: 40px; height: 40px; margin-top: 2px; }
.row .t { font: 600 18px/1.25 var(--serif); letter-spacing: -.005em; padding-right: 8px; }
.row mark { background: none; color: inherit; box-shadow: inset 0 -2px 0 var(--red); }
.row .pay { font-weight: 600; white-space: nowrap; line-height: 22px; padding-right: 26px; }
.row .co { color: var(--soft); grid-column: 2; }
.row .when { color: var(--soft); font-size: 13px; text-align: right; padding-right: 26px; white-space: nowrap; }
.row .tags { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; font-size: 12.5px; color: var(--soft); }
.row .tags span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.row .tags span + span::before { content: ""; width: 3px; height: 3px; background: currentColor; margin: 0 7px 0 -7px; opacity: .6; }
.row .applied { color: var(--red-ink); font-weight: 600; }
.row[aria-current="true"] { background: var(--ink); color: var(--white); --mbg: var(--ink); }
.row[aria-current="true"] .co, .row[aria-current="true"] .when, .row[aria-current="true"] .tags { color: #cfcabd; }
.row[aria-current="true"] .applied { color: var(--white); }
.row[aria-current="true"]:focus-visible { outline-color: var(--paper); outline-offset: -4px; }
.rowsave { position: absolute; right: 16px; top: 12px; width: 32px; height: 32px; display: grid; place-items: center; opacity: 0; transition: opacity .12s, transform .15s var(--ease); }
.rowwrap:hover .rowsave, .rowsave:focus-visible, .rowsave[aria-pressed="true"] { opacity: 1; }
.rowsave:active { transform: scale(.9); }
.rowsave[aria-pressed="true"] .i { fill: var(--red); stroke: var(--red); }
.rowwrap:has([aria-current="true"]) .rowsave { color: var(--white); }
.rowwrap:has([aria-current="true"]) .rowsave[aria-pressed="true"] .i { fill: var(--white); stroke: var(--white); }
.blank { padding: 56px 32px; text-align: center; }
.blank h3 { font: 600 24px/1.2 var(--serif); margin-bottom: 8px; }
.blank p { color: var(--soft); max-width: 340px; margin: 0 auto 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border: 1px solid var(--ink); font-weight: 500; white-space: nowrap; transition: background .12s, color .12s, border-color .12s; }
.btn:hover { background: var(--ink); color: var(--white); }
.btn.apply { background: var(--red); border-color: var(--red); color: #fff; font-weight: 600; }
.btn.apply:hover { background: var(--red-ink); border-color: var(--red-ink); }
.btn.apply[disabled] { background: none; border-color: var(--line); color: var(--soft); cursor: default; }
.btn.ink { background: var(--ink); color: var(--white); }
.btn.ink:hover { background: #000; }
.btn .i { width: 16px; height: 16px; }
.btn[aria-pressed="true"] .i { fill: currentColor; }
.keys { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 8px 24px; border-top: 1px solid var(--ink); font-size: 12.5px; color: var(--soft); background: var(--paper); }
kbd { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 4px; margin-right: 4px; border: 1px solid #a9a496; font: 500 11.5px/1 var(--sans); color: var(--ink); background: var(--white); }

/* posting */
.post { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); background: var(--white); }
.bar { display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 32px; border-bottom: 1px solid var(--line); }
.bar .back { display: none; align-items: center; gap: 6px; font-weight: 500; height: 40px; margin-right: 8px; white-space: nowrap; }
.bar .pos { color: var(--soft); font-size: 13px; margin-right: 4px; white-space: nowrap; }
.sq { width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid var(--line); transition: border-color .12s; }
.sq:hover:not(:disabled) { border-color: var(--ink); }
.sq:disabled { color: var(--line); cursor: default; }
.sq .i { width: 16px; height: 16px; }
.bar .sp { flex: 1; }
.prevnext { display: contents; }
.bar .btn { height: 36px; }
.scroll { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
article { padding: 28px 32px 48px; max-width: 760px; }
article.enter { animation: rise .22s var(--ease); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
.byline { display: flex; align-items: center; gap: 12px; --mbg: var(--white); }
.byline .mk { width: 40px; height: 40px; }
.byline b { display: block; font-weight: 600; }
.byline small { font-size: 13px; color: var(--soft); }
h2.title { font: 600 40px/1.08 var(--serif); letter-spacing: -.02em; margin: 16px 0 16px; text-wrap: balance; }
.standfirst { font: 400 19px/1.4 var(--serif); color: #2c2b27; max-width: 60ch; text-wrap: pretty; }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 20px; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); }
.facts div { padding: 10px 12px 10px 0; }
.facts div + div { padding-left: 12px; border-left: 1px solid var(--line); }
.facts dt { font-size: 12.5px; color: var(--soft); }
.facts dd { font-weight: 600; }
.sec { display: grid; grid-template-columns: 136px minmax(0, 1fr); gap: 0 16px; padding: 20px 0; border-bottom: 1px solid var(--line); }
.sec h3 { font: 600 16px/1.35 var(--serif); }
.sec p { font-size: 15px; line-height: 1.55; max-width: 60ch; }
.sec p + p { margin-top: 10px; }
.sec li { position: relative; padding-left: 16px; font-size: 15px; line-height: 1.5; max-width: 60ch; }
.sec li + li { margin-top: 6px; }
.sec li::before { content: ""; position: absolute; left: 0; top: 10px; width: 6px; height: 1px; background: var(--ink); }
.sec a { font-weight: 500; }
.band { position: relative; height: 80px; margin-top: 2px; }
.band .ax { position: absolute; left: 0; right: 0; top: 37px; height: 5px; border-top: 1px solid var(--ink); background: repeating-linear-gradient(90deg, var(--ink) 0 1px, transparent 1px 16.666%); background-size: calc(100% - 1px) 100%; }
.band .mk2 { position: absolute; top: 38px; height: 16px; background: repeating-linear-gradient(135deg, #8f8a7c 0 1px, transparent 1px 5px); border: 1px solid #8f8a7c; border-width: 0 1px; }
.band .me { position: absolute; top: 22px; height: 15px; background: var(--red); }
.band span { position: absolute; font-size: 13px; white-space: nowrap; transform: translateX(-50%); }
.band .top { top: 0; font-weight: 600; }
.band .bot { bottom: 0; color: var(--soft); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--soft); margin-top: 8px; }
.legend i { display: inline-block; width: 16px; height: 10px; margin-right: 6px; background: var(--red); vertical-align: -1px; }
.legend i.h { background: repeating-linear-gradient(135deg, #b7b1a1 0 1px, transparent 1px 4px); box-shadow: inset 0 0 0 1px #b7b1a1; }
.sim li { padding: 0; }
.sim li::before { display: none; }
.sim button { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; width: 100%; padding: 8px 0; text-align: left; border-top: 1px solid var(--line); font-size: 14px; }
.sim li:first-child button { border-top: 0; padding-top: 0; }
.sim button b { font: 600 16px/1.3 var(--serif); }
.sim button small { display: block; font-size: 13px; color: var(--soft); }
.sim button:hover b { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.sim .p { font-weight: 500; white-space: nowrap; }
.endapply { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 0 0; }
.endapply p { font: 400 16px/1.35 var(--serif); color: var(--soft); max-width: 40ch; }

/* application */
dialog { margin: auto; width: min(560px, calc(100vw - 32px)); max-height: calc(100svh - 32px); border: 1px solid var(--ink); background: var(--white); color: var(--ink); overflow-y: auto; opacity: 0; transform: translateY(10px); transition: opacity .2s var(--ease), transform .22s var(--ease); }
dialog::backdrop { background: rgba(17, 17, 16, .5); opacity: 0; transition: opacity .2s; }
dialog.in { opacity: 1; transform: none; }
dialog.in::backdrop { opacity: 1; }
.dh { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 24px 24px 16px; border-bottom: 2px solid var(--ink); }
.dh h2 { font: 600 28px/1.12 var(--serif); letter-spacing: -.01em; }
.dh p { color: var(--soft); margin-top: 4px; }
.dx { width: 32px; height: 32px; display: grid; place-items: center; flex: none; margin: -4px -6px 0 0; }
.dx:hover { background: var(--paper-2); }
form.ap { padding: 8px 24px 24px; }
.f { padding-top: 16px; }
.f label, .f .lab { display: block; font-weight: 600; font-size: 13px; }
.f label small, .f .lab small { font-weight: 400; color: var(--soft); }
.f input[type=text], .f input[type=email] { display: block; width: 100%; height: 40px; border: 0; border-bottom: 1px solid var(--ink); background: none; outline: none; font: 400 18px/1 var(--serif); border-radius: 0; }
.f input:focus { box-shadow: 0 1px 0 var(--ink); }
.f input[aria-invalid="true"] { border-color: var(--red); box-shadow: 0 1px 0 var(--red); }
.err { display: none; align-items: flex-start; gap: 6px; margin-top: 6px; color: var(--red-ink); font-size: 13px; }
.err.on { display: flex; }
.err .i { width: 14px; height: 14px; margin-top: 2px; }
.drop { display: block; width: 100%; margin-top: 8px; padding: 20px 16px; border: 1px dashed #8f8a7c; background: var(--paper); text-align: center; transition: background .12s, border-color .12s; }
.drop:hover, .drop.over { background: var(--paper-2); border-color: var(--ink); }
.drop.over { border-style: solid; }
.drop.bad { border-color: var(--red); }
.drop b { display: block; font: 600 16px/1.3 var(--serif); }
.drop u { text-underline-offset: 3px; text-decoration-thickness: 1px; }
.drop small { color: var(--soft); font-size: 13px; }
.file { display: none; margin-top: 8px; padding: 12px; border: 1px solid var(--ink); background: var(--paper); }
.file.on { display: block; }
.file .h { display: flex; align-items: center; gap: 10px; }
.file .nm { flex: 1; min-width: 0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file .st { color: var(--soft); font-size: 13px; white-space: nowrap; }
.file .lk { font-size: 13px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; white-space: nowrap; }
.file .pg { height: 3px; margin-top: 10px; background: var(--line); }
.file .pg i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .12s linear; }
.file.done .pg { display: none; }
.file.done .st { color: var(--ink); }
.da { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 24px; }
.da p { color: var(--soft); font-size: 13px; max-width: 30ch; }
.da .btn { min-width: 148px; height: 44px; }
.sent { padding: 32px 24px 24px; }
.sent svg.tick { width: 48px; height: 48px; margin-bottom: 16px; }
.sent svg.tick path { stroke-dasharray: 60; animation: draw .35s var(--ease) both .05s; }
@keyframes draw { from { stroke-dashoffset: 60; } }
.sent h2 { font: 600 40px/1.05 var(--serif); letter-spacing: -.02em; margin-bottom: 8px; }
.sent p { font-size: 15px; line-height: 1.5; max-width: 46ch; }
.sent dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 16px; margin: 16px 0 24px; padding: 12px 0; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--line); }
.sent dt { color: var(--soft); }
.sent dd { font-weight: 500; overflow-wrap: anywhere; }

.toast { position: fixed; left: 50%; bottom: 24px; z-index: 40; display: flex; align-items: center; gap: 16px; padding: 12px 16px; background: var(--ink); color: var(--white); opacity: 0; transform: translate(-50%, 8px); pointer-events: none; transition: opacity .18s var(--ease), transform .18s var(--ease); white-space: nowrap; max-width: calc(100vw - 32px); }
.toast.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { font-weight: 600; text-decoration: underline; text-underline-offset: 3px; color: #ffb7a4; }
.toast button[hidden] { display: none; }
.scrim { display: none; }

@media (max-width: 1320px) {
  .cols { grid-template-columns: 232px 392px minmax(0, 1fr); }
  .rail { padding: 0 16px 32px; } .row { padding: 14px 16px; } .lhead, .keys { padding-left: 16px; padding-right: 16px; }
  .rowsave { right: 8px; }
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .facts div:nth-child(3) { padding-left: 0; border-left: 0; }
  .facts div:nth-child(n+3) { border-top: 1px solid var(--line); }
  .sec { grid-template-columns: 1fr; gap: 8px; }
  h2.title { font-size: 34px; }
}
@media (max-width: 1099px) {
  .cols { grid-template-columns: 348px minmax(0, 1fr); }
  .filtersbtn { display: flex; }
  .sort span { display: none; }

/* ---------- state ---------- */
const F = { q: "", loc: "", remote: false, roles: new Set(), sens: new Set(), sizes: new Set(), visa: false, lo: 60, hi: 320 };

function match(j, skip) {
  if (F.q) { const hay = `${j.t} ${j.co.n} ${j.tags.join(" ")} ${ROLES.find((r) => r[0] === j.r)[1]}`.toLowerCase(); if (!F.q.toLowerCase().split(/\s+/).every((w) => hay.includes(w))) return false; }
  if (F.loc && !j.loc.toLowerCase().includes(F.loc.toLowerCase())) return false;
  if (F.remote && !j.rem) return false;
  if (skip !== "roles" && F.roles.size && !F.roles.has(j.r)) return false;
  if (skip !== "sens" && F.sens.size && !F.sens.has(j.s)) return false;
  if (skip !== "sizes" && F.sizes.size && !F.sizes.has(j.co.size)) return false;
  if (skip !== "visa" && F.visa && !j.visa) return false;
  if (j.hi < F.lo || j.lo > F.hi) return false;
  return true;
}
const activeN = () => F.roles.size + F.sens.size + F.sizes.size + (F.visa ? 1 : 0) + (F.lo > 60 || F.hi < 320 ? 1 : 0);

  $("sMin").setAttribute("aria-valuetext", `$${a},000`); $("sMax").setAttribute("aria-valuetext", `$${b},000`);

function select(id, opts = {}) {

    if (!S.view.some((v) => v.id === id)) { setTab("all"); clearAll(); refresh(); }

  }
  const st = t.closest("[data-step]"); if (st) { step(+st.dataset.step); return; }
  if (t.closest("[data-back]")) { document.body.classList.remove("reading"); const r = document.querySelector(`[data-row="${S.sel}"]`); if (r) r.focus({ preventScroll: true }); return; }
  if (t.closest("[data-apply]")) { openApply(); return; }
  if (t.closest("#saveBtn")) { toggleSave(S.sel, S.tab === "saved"); return; }
  if (t.closest("#share")) { copyLink(); return; }
  if (t.closest("#toAll")) { setTab("all"); refresh(); return; }
  if (t.closest("#clearBlank")) { clearAll(); refresh(); return; }
});
async function copyLink() {
  const j = J[S.sel], url = `https://roster.example/jobs/${j.id + 4100}`;
  try { await navigator.clipboard.writeText(url); } catch (err) { /* the sandbox may refuse: the state still shows */ }
  const lab = document.querySelector(".shareL"), btn = $("share");
  if (lab) { lab.textContent = "Copied"; btn.querySelector("use").setAttribute("href", "#i-check"); clearTimeout(copyLink.t); copyLink.t = setTimeout(() => { const l = document.querySelector(".shareL"); if (l) { l.textContent = "Copy link"; $("share").querySelector("use").setAttribute("href", "#i-link"); } }, 1800); }
}
function setTab(t) {
  S.tab = t;
  $("tabAll").toggleAttribute("aria-current", false); $("tabSaved").toggleAttribute("aria-current", false);
  (t === "all" ? $("tabAll") : $("tabSaved")).setAttribute("aria-current", "page");
  document.body.classList.remove("reading");
}
$("tabAll").addEventListener("click", () => { setTab("all"); refresh(); });
$("tabSaved").addEventListener("click", () => { setTab("saved"); refresh(); });
$("sort").addEventListener("change", (e) => { S.sort = e.target.value; refresh(); });

/* ---------- search ---------- */
onEnter($("find"), () => { const r = document.querySelector(`[data-row="${S.sel}"]`); if (r) r.focus({ preventScroll: true }); });
const fieldUp = (inp, box, key) => inp.addEventListener("input", () => { F[key] = inp.value.trim(); box.classList.toggle("has", !!inp.value); if (S.tab !== "all") setTab("all"); refresh(); });
fieldUp($("q"), $("qBox"), "q"); fieldUp($("loc"), $("locBox"), "loc");
$("qx").addEventListener("click", (e) => { e.preventDefault(); $("q").value = ""; F.q = ""; $("qBox").classList.remove("has"); refresh(); $("q").focus(); });
$("locx").addEventListener("click", (e) => { e.preventDefault(); $("loc").value = ""; F.loc = ""; $("locBox").classList.remove("has"); refresh(); $("loc").focus(); });
$("remote").addEventListener("change", (e) => { F.remote = e.target.checked; if (S.tab !== "all") setTab("all"); refresh(); });
$("places").innerHTML = [...new Set(["Toronto", "Lyon", "Singapore", "Seoul", "Nairobi", "Berlin", "Dubai", "São Paulo", "Rotterdam", "Stoke-on-Trent", "New Orleans", "EU", "Canada", "UK", "Brazil", "Africa"])].map((p) => `<option value="${p}">`).join("");

/* ---------- filter drawer on small screens ---------- */
function showRail(on) { document.body.classList.toggle("showrail", on); document.querySelectorAll(".mast, .find, .list, .post").forEach((n) => n.toggleAttribute("inert", on)); if (on) $("railClose").focus(); else $("filtersBtn").focus({ preventScroll: true }); }
$("filtersBtn").addEventListener("click", () => showRail(true));
$("railClose").addEventListener("click", () => showRail(false));
$("showN").addEventListener("click", () => showRail(false));
$("scrim").addEventListener("click", () => showRail(false));

/* ---------- keyboard ---------- */
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if ($("dlg").open) return;
    if (document.body.classList.contains("showrail")) { showRail(false); return; }
    if (document.body.classList.contains("reading")) { document.body.classList.remove("reading"); const r = document.querySelector(`[data-row="${S.sel}"]`); if (r) r.focus({ preventScroll: true }); return; }
    if (document.activeElement && ["q", "loc"].includes(document.activeElement.id)) document.activeElement.blur();
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey || $("dlg").open) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "select" || tag === "textarea") return;
  const k = e.key.toLowerCase();
  if (k === "j" || (e.key === "ArrowDown" && e.target.classList && e.target.classList.contains("row"))) { e.preventDefault(); step(1); }
  else if (k === "k" || (e.key === "ArrowUp" && e.target.classList && e.target.classList.contains("row"))) { e.preventDefault(); step(-1); }
  else if (k === "s" && S.sel != null) { e.preventDefault(); toggleSave(S.sel, true); }
  else if (k === "a" && S.sel != null && !S.applied.has(S.sel)) { e.preventDefault(); openApply(); }
  else if (k === "/") { e.preventDefault(); $("q").focus(); $("q").select(); }
});

/* ---------- toast ---------- */
function toast(text, undo) {
  $("toastT").textContent = text; $("toast").classList.add("on");
  $("toastU").hidden = !undo; toast.undo = undo;
  clearTimeout(toast.t); toast.t = setTimeout(() => $("toast").classList.remove("on"), 3600);
}
$("toastU").addEventListener("click", () => { $("toast").classList.remove("on"); if (toast.undo) { const u = toast.undo; toast.undo = null; const was = toast; u(); $("toast").classList.remove("on"); } });

/* ---------- the application ---------- */
const dlg = $("dlg");
let cv = null, upT = null, curJob = null;
function openApply() {
  const j = J[S.sel]; if (!j || S.applied.has(j.id)) return;
  curJob = j; if (cv && cv.state !== "done") cancelUpload();
$("toast").classList.remove("on");
  dlg.innerHTML = `<div class="dh"><div><h2 id="dT">Apply to ${esc(j.co.n)}</h2><p>${esc(j.t)} · <span style="white-space:nowrap">${pay(j)}</span></p></div><button class="dx" id="dClose" aria-label="Close">${ic("x")}</button></div>
    <form class="ap" id="ap" novalidate>
      <div class="f"><label for="aName">Full name</label><input type="text" id="aName" autocomplete="off" value="${esc(S.draft.name)}" aria-describedby="eName"><p class="err" id="eName"></p></div>
      <div class="f"><label for="aEmail">Email</label><input type="email" id="aEmail" autocomplete="off" spellcheck="false" value="${esc(S.draft.email)}" aria-describedby="eEmail"><p class="err" id="eEmail"></p></div>
      <div class="f"><label for="aUrl">Portfolio or GitHub link</label><input type="text" inputmode="url" id="aUrl" autocomplete="off" spellcheck="false" placeholder="studio.com/work" value="${esc(S.draft.url)}" aria-describedby="eUrl"><p class="err" id="eUrl"></p></div>
      <div class="f"><span class="lab" id="cvL">CV <small>PDF or Word, up to 10 MB</small></span>
        <button type="button" class="drop" id="drop" aria-labelledby="cvL dropT"><b id="dropT">Drop your CV here</b><small>or <u>choose a file</u></small></button>
        <div class="file" id="file"><div class="h">${ic("doc")}<span class="nm" id="fName"></span><span class="st" id="fSt"></span><button type="button" class="lk" id="fAct"></button></div><div class="pg"><i id="fBar"></i></div></div>
        <p class="err" id="eCv"></p>
      </div>
      <div class="da"><p>${esc(j.co.lead)} will see this, and nobody else. No account needed.</p><button type="button" class="btn apply" id="aSend">Send application</button></div>
    </form>`;
  if (cv && cv.state === "done") showFile(); 
  dlg.showModal(); requestAnimationFrame(() => dlg.classList.add("in"));
  $("dClose").addEventListener("click", closeApply);
  wireForm();
  $("aName").focus();
}
function closeApply() {
  dlg.classList.remove("in");
  const end = () => { if (dlg.open) dlg.close(); };
  still ? end() : setTimeout(end, 180);
}
dlg.addEventListener("cancel", (e) => { e.preventDefault(); closeApply(); });
dlg.addEventListener("pointerdown", (e) => { if (e.target === dlg) { const r = dlg.getBoundingClientRect(); if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) closeApply(); } });
dlg.addEventListener("close", () => { const b = $("bar").querySelector("[data-apply]"); if (b && !b.disabled) b.focus({ preventScroll: true }); });

const setErr = (inp, errId, msg) => {
  const el = $(errId); if (inp) inp.setAttribute("aria-invalid", String(!!msg));
  el.innerHTML = msg ? ic("alert") + `<span>${esc(msg)}</span>` : ""; el.classList.toggle("on", !!msg);
  return !msg;
};
const CHECK = {
  aName: (v) => !v ? "Tell us your name." : v.length < 2 ? "That seems too short for a name." : "",
  aEmail: (v) => !v ? "We need an email to reply to." : !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v) ? "That doesn't look like an email address. Check for a missing @ or dot." : "",
  aUrl: (v) => {
    if (!v) return "Add a link to some of your work.";
    try { const u = new URL(/^[a-z]+:\/\//i.test(v) ? v : "https://" + v); if (!/^https?:$/.test(u.protocol) || !/\.[a-z]{2,}$/i.test(u.hostname)) throw 0; return ""; } catch (err) { return "That link doesn't look complete. Try something like studio.com/work."; }
  },
};
const ERR = { aName: "eName", aEmail: "eEmail", aUrl: "eUrl" };
function wireForm() {
  Object.keys(CHECK).forEach((id) => {
    const inp = $(id);
    inp.addEventListener("blur", () => { if (inp.value.trim() || inp.getAttribute("aria-invalid") === "true") setErr(inp, ERR[id], CHECK[id](inp.value.trim())); });
    inp.addEventListener("input", () => { if (inp.getAttribute("aria-invalid") === "true") setErr(inp, ERR[id], CHECK[id](inp.value.trim())); });
  });
  const drop = $("drop");
  drop.addEventListener("click", () => { $("cvFile").value = ""; $("cvFile").click(); });
  ["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "dragend"].forEach((ev) => drop.addEventListener(ev, () => drop.classList.remove("over")));
  drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); const f = e.dataTransfer && e.dataTransfer.files[0]; if (f) takeFile(f); });
  $("fAct").addEventListener("click", () => { if (cv && cv.state === "up") cancelUpload(); else removeFile(); });
  onEnter($("ap"), submit); $("aSend").addEventListener("click", submit);
}
// keep the page from opening a file dropped just outside the zone
["dragover", "drop"].forEach((ev) => document.addEventListener(ev, (e) => e.preventDefault()));
$("cvFile").addEventListener("change", (e) => { const f = e.target.files[0]; if (f) takeFile(f); });
function fmtSize(b) { return b >= 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB"; }
function takeFile(f) {
  const ok = /\.(pdf|docx?)$/i.test(f.name);
  if (!ok) { failDrop(`“${f.name}” isn't a PDF or Word file.`); return; }
  if (f.size > 10 * 1048576) { failDrop(`That file is ${fmtSize(f.size)}. The limit is 10 MB.`); return; }
  clearInterval(upT);
  cv = { name: f.name, size: f.size, state: "up", p: 0 };
  setErr(null, "eCv", ""); $("drop").classList.remove("bad"); showFile();
  const inc = [9, 14, 6, 17, 11, 8, 19, 13];
  let k = 0;
  upT = setInterval(() => {
    cv.p = Math.min(100, cv.p + inc[k++ % inc.length]);
    if (cv.p >= 100) { clearInterval(upT); cv.state = "done"; }
    showFile();
    if (cv.state === "done") { const fa = $("fAct"); if (fa && document.activeElement === document.body) fa.focus(); }
  }, still ? 40 : 110);
}
function failDrop(msg) { $("drop").classList.add("bad"); setErr(null, "eCv", msg); }
function showFile() {
  if (!$("file")) return;
  $("drop").style.display = "none"; const box = $("file"); box.classList.add("on");
  box.classList.toggle("done", cv.state === "done");
  $("fName").textContent = cv.name; $("fName").title = cv.name;
  $("fSt").textContent = cv.state === "done" ? fmtSize(cv.size) : cv.p + "%";
  $("fAct").textContent = cv.state === "done" ? "Remove" : "Cancel";
  $("fAct").setAttribute("aria-label", (cv.state === "done" ? "Remove " : "Cancel upload of ") + cv.name);
  $("fBar").style.width = cv.p + "%";
  if (cv.state === "done") setErr(null, "eCv", "");
}
function cancelUpload() { clearInterval(upT); cv = null; if ($("file")) resetDrop(); }
function removeFile() { cv = null; resetDrop(); }
function resetDrop() { $("file").classList.remove("on", "done"); $("drop").style.display = ""; $("drop").focus(); }
function submit() {
  if ($("aSend").disabled) return;
  let firstBad = null;
  Object.keys(CHECK).forEach((id) => { const inp = $(id), msg = CHECK[id](inp.value.trim()); setErr(inp, ERR[id], msg); if (msg && !firstBad) firstBad = inp; });
  if (!cv) { setErr(null, "eCv", "Attach your CV, as a PDF or Word file."); $("drop").classList.add("bad"); firstBad = firstBad || $("drop"); }
  else if (cv.state !== "done") { setErr(null, "eCv", "Your CV is still uploading. One moment."); firstBad = firstBad || $("fAct"); }
  if (firstBad) { firstBad.focus(); return; }
  S.draft = { name: $("aName").value.trim(), email: $("aEmail").value.trim(), url: $("aUrl").value.trim() };
  const btn = $("aSend"); btn.disabled = true; btn.textContent = "Sending…";
  setTimeout(() => {
    const j = curJob, cvName = cv.name; S.applied.set(j.id, "4 November");
    dlg.innerHTML = `<div class="sent"><svg class="tick" viewBox="0 0 48 48" fill="none" stroke="#cf3413" stroke-width="3" aria-hidden="true"><path d="M8 25l11 11L40 13"/></svg>
      <h2 id="dT" tabindex="-1">Sent.</h2><p>${esc(j.co.lead)} at ${esc(j.co.n)} usually replies within ${j.co.reply}. We've sent a copy to ${esc(S.draft.email)}.</p>
      <dl><dt>Role</dt><dd>${esc(j.t)}</dd><dt>CV</dt><dd>${esc(cvName)}</dd><dt>Work</dt><dd>${esc(S.draft.url)}</dd></dl>
      <button class="btn ink" id="dDone" style="width:100%;height:44px">Back to the roles</button></div>`;
    $("dDone").addEventListener("click", closeApply); $("dDone").focus();
    refresh(true);
  }, still ? 300 : 900);
}

/* ---------- start ---------- */
syncSalary();
refresh();
</script>
</body>
