<!doctype html>
<!-- File manager — Uiverse Originals. Free to use and adapt (MIT). One file, no dependencies.
     A team file storage screen: drawn thumbnails for every file type, click, shift and cmd selection,
     rubber-band and drag-to-folder moves, a right-click menu with inline rename and undo, a details
     panel, simulated uploads with progress rings, and full keyboard control. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cellar — Brand refresh 2026</title>
<style>
  :root {
    --bg: #f2f0eb; --side: #e9e6df; --surface: #fbfaf7; --raise: #ffffff; --line: #dcd8cf; --line2: #e7e4dd;
    --ink: #1c1a17; --soft: #5f5a52; --faint: #8f897f; --acc: #8b2c3c; --acc-2: #74222f; --sel: #f4e4e5; --sel-line: #b25360; --sel-2: #ead2d4;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --r: 8px; --ease: cubic-bezier(.2, .7, .2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 13px/1.4 var(--sans); font-variant-numeric: tabular-nums; overflow: hidden; -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }
  button { border: 0; background: none; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .app { display: grid; grid-template-columns: 248px minmax(0, 1fr) 0px; height: 100svh; min-height: 520px; transition: grid-template-columns .26s var(--ease); }
  .app.panel-on { grid-template-columns: 248px minmax(0, 1fr) 340px; }

  /* sidebar */
  .side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .ws { display: flex; align-items: center; gap: 10px; padding: 16px 16px 14px; }
  .ws .mark { width: 30px; height: 30px; border-radius: 7px; background: var(--ink); display: grid; place-items: center; flex: none; }
  .ws .mark svg { width: 18px; height: 18px; }
  .ws b { display: block; font-size: 14px; font-weight: 650; letter-spacing: -.01em; }
  .ws small { display: block; color: var(--soft); font-size: 12px; }
  .nav { flex: 1; overflow-y: auto; padding: 4px 8px 12px; }
  .nav h3 { font-size: 12px; font-weight: 600; color: var(--soft); padding: 16px 8px 6px; }
  .loc { display: flex; align-items: center; gap: 10px; width: 100%; height: 32px; padding: 0 8px; border-radius: 6px; color: #3a3631; text-align: left; font-size: 13.5px; transition: background .15s; }
  .loc:hover { background: rgba(28, 26, 23, .05); }
  .loc[aria-current="page"] { background: var(--raise); color: var(--ink); font-weight: 550; box-shadow: 0 0 0 1px var(--line); }
  .loc svg.i { color: var(--soft); width: 17px; height: 17px; }
  .loc span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .loc em { font-style: normal; color: var(--soft); font-size: 12px; }
  .loc .fd { width: 17px; height: 15px; flex: none; }
  .loc.sub { padding-left: 28px; }
  .people { display: none; }
  .pp { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 8px; font-size: 13px; color: #3a3631; }
  @media (min-height: 1200px) { .people { display: block; } .pv:not(.stack) { aspect-ratio: 1; } }
  .loc.drop-on { background: var(--sel); box-shadow: 0 0 0 1.5px var(--sel-line); }
  .store { margin: 0 12px 14px; padding: 14px; border-radius: var(--r); background: var(--raise); border: 1px solid var(--line); }
  .store .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .store .top b { font-size: 13px; font-weight: 600; }
  .store .top span { color: var(--soft); font-size: 12px; white-space: nowrap; }
  .meter { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--line2); gap: 2px; }
  .meter i { display: block; height: 100%; transition: width .4s var(--ease); }
  .legend { display: grid; grid-template-columns: 1fr; gap: 6px; margin-top: 12px; font-size: 12px; color: var(--soft); }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .legend b { margin-left: auto; color: var(--ink); font-weight: 500; white-space: nowrap; }
  .me { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .me div { flex: 1; min-width: 0; }
  .me b { display: block; font-size: 13px; font-weight: 600; }
  .me small { color: var(--soft); font-size: 12px; }
  .ib { width: 32px; height: 32px; border-radius: 6px; display: grid; place-items: center; color: var(--soft); transition: background .15s, color .15s; flex: none; }
  .ib:hover { background: rgba(28, 26, 23, .06); color: var(--ink); }
  .ib[aria-pressed="true"] { background: var(--raise); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
  .av { width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-size: 10px; font-weight: 650; flex: none; letter-spacing: .02em; }
  .av.l { width: 30px; height: 30px; font-size: 11px; }

  /* main */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--surface); }
  .bar { display: flex; align-items: center; gap: 12px; padding: 0 20px; height: 60px; flex: none; border-bottom: 1px solid var(--line2); }
  .menu-btn { display: none; }
  .crumbs { display: flex; align-items: center; gap: 2px; min-width: 0; flex: 1; }
  .crumbs ol { display: flex; align-items: center; list-style: none; min-width: 0; }
  .crumbs li { display: flex; align-items: center; min-width: 0; }
  .crumbs li + li::before { content: ""; width: 6px; height: 6px; border-top: 1.5px solid var(--faint); border-right: 1.5px solid var(--faint); transform: rotate(45deg); margin: 0 8px 0 4px; flex: none; }
  .crumbs button { padding: 5px 6px; border-radius: 5px; color: var(--soft); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
  .crumbs button:hover { background: rgba(28, 26, 23, .05); color: var(--ink); }
  .crumbs li:last-child button { color: var(--ink); font-weight: 650; font-size: 18px; letter-spacing: -.015em; max-width: 360px; }
  .crumbs button.drop-on { background: var(--sel); box-shadow: 0 0 0 1.5px var(--sel-line); }
  .tools { display: flex; align-items: center; gap: 8px; }
  .seg { display: flex; padding: 2px; border-radius: 7px; background: var(--bg); border: 1px solid var(--line); }
  .seg button { width: 30px; height: 26px; border-radius: 5px; display: grid; place-items: center; color: var(--soft); }
  .seg button svg { width: 16px; height: 16px; }
  .seg button[aria-pressed="true"] { background: var(--raise); color: var(--ink); box-shadow: 0 1px 2px rgba(28, 26, 23, .12), 0 0 0 1px var(--line); }
  .btn { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 6px; font-size: 13px; font-weight: 550; white-space: nowrap; transition: background .15s, border-color .15s; }
  .btn svg { width: 16px; height: 16px; }
  .btn.sec { background: var(--raise); border: 1px solid var(--line); }
  .btn.sec:hover { border-color: #c9c4ba; }
  .btn.pri { background: var(--acc); color: #fff; }
  .btn.pri:hover { background: var(--acc-2); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .sortb em { font-style: normal; color: var(--soft); font-weight: 500; }

  .canvas { position: relative; flex: 1; overflow-y: auto; overflow-x: hidden; min-height: 0; outline: none; user-select: none; -webkit-user-select: none; }
  .inner { position: relative; padding: 8px 20px 40px; min-height: 100%; }
  .inner.fade { animation: fade .22s var(--ease); }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } }
  .sec-h { display: flex; align-items: baseline; gap: 8px; padding: 16px 2px 10px; font-size: 13px; font-weight: 600; }
  .sec-h span { color: var(--soft); font-weight: 400; font-size: 12px; }
  .folders { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 12px 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 16px 14px; }

  .it { position: relative; border-radius: var(--r); outline-offset: 2px; }
  .it .more { position: absolute; width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; color: var(--soft); opacity: 0; transition: opacity .15s, background .15s; }
  .it .more svg { width: 16px; height: 16px; }
  .it:hover .more, .it[aria-selected="true"] .more, .it:focus-visible .more, .it .more:focus-visible { opacity: 1; }
  .it .more:hover { background: rgba(28, 26, 23, .07); color: var(--ink); }
  .fo { display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 10px 0 12px; background: var(--raise); border: 1px solid var(--line); transition: border-color .15s, background .15s, box-shadow .15s, transform .2s var(--ease); }
  .fo:hover { border-color: #cbc6bc; }
  .fo .fd { width: 30px; height: 26px; flex: none; }
  .fo .t { flex: 1; min-width: 0; }
  .fo .more { right: 6px; top: 16px; background: var(--raise); }
  .fo[aria-selected="true"] .more { background: var(--sel); }
  .name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 550; font-size: 13px; }
  .fo small, .card small { display: block; color: var(--soft); font-size: 12px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fo[aria-selected="true"] { background: var(--sel); border-color: var(--sel-line); }
  .fo.drop-on { background: var(--sel); border-color: var(--acc); box-shadow: 0 0 0 3px rgba(139, 44, 60, .16); transform: scale(1.02); }
  .fo.landed { animation: land .5s var(--ease); }
  @keyframes land { 40% { box-shadow: 0 0 0 5px rgba(139, 44, 60, .2); } }

  .card { padding: 6px 6px 8px; transition: background .15s; }
  .card:hover { background: rgba(28, 26, 23, .035); }
  .card .th { position: relative; aspect-ratio: 4 / 3; border-radius: 6px; overflow: hidden; background: var(--line2); box-shadow: 0 0 0 1px rgba(28, 26, 23, .07); }
  .th > svg { display: block; width: 100%; height: 100%; }
  .card .lab { display: flex; align-items: flex-start; gap: 6px; padding: 9px 2px 0; }
  .card .lab > svg { width: 15px; height: 15px; margin-top: 1px; color: var(--soft); }
  .card .lab .t { flex: 1; min-width: 0; }
  .card .more { right: 4px; bottom: 4px; }
  .card[aria-selected="true"] { background: var(--sel); }
  .card[aria-selected="true"] .th { box-shadow: 0 0 0 2px var(--sel-line); }
  .chip { position: absolute; right: 6px; bottom: 6px; display: flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 4px; background: rgba(20, 18, 16, .72); color: #fff; font-size: 11px; font-weight: 550; }
  .chip svg { width: 9px; height: 9px; fill: #fff; }
  .star { position: absolute; left: 6px; top: 6px; width: 22px; height: 22px; border-radius: 5px; background: rgba(255, 255, 255, .92); display: grid; place-items: center; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .star svg { width: 14px; height: 14px; fill: #c4862b; stroke: #c4862b; stroke-width: 1.5; stroke-linejoin: round; }
  .ring { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(251, 250, 247, .78); }
  .ring svg { width: 44px; height: 44px; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 3; }
  .ring .trk { stroke: rgba(28, 26, 23, .12); }
  .ring .pg { stroke: var(--acc); stroke-linecap: round; transition: stroke-dashoffset .2s linear; }
  .ring span { position: absolute; font-size: 11px; font-weight: 650; }
  .it.up .lab, .it.up .name { color: var(--soft); }

  /* list view */
  .list { border-top: 1px solid var(--line2); }
  .lh, .row { display: grid; grid-template-columns: minmax(0, 1fr) 160px 130px 84px 120px 34px; align-items: center; gap: 12px; padding: 0 8px; }
  .lh { position: sticky; top: 0; z-index: 2; height: 34px; background: var(--surface); border-bottom: 1px solid var(--line2); }
  .lh button { display: flex; align-items: center; gap: 4px; color: var(--soft); font-size: 12px; font-weight: 550; height: 26px; padding: 0 4px; margin-left: -4px; border-radius: 4px; justify-self: start; }
  .lh button:hover { color: var(--ink); }
  .lh button svg { width: 12px; height: 12px; }
  .lh .r, .row .r { justify-self: end; text-align: right; }
  .row { height: 46px; border-bottom: 1px solid var(--line2); border-radius: 0; color: var(--soft); }
  .row:hover { background: rgba(28, 26, 23, .03); }
  .row .nm { display: flex; align-items: center; gap: 12px; min-width: 0; color: var(--ink); }
  .row .mini { width: 40px; height: 30px; border-radius: 4px; overflow: hidden; flex: none; box-shadow: 0 0 0 1px rgba(28, 26, 23, .08); position: relative; }
  .row .mini .ring { background: rgba(251, 250, 247, .7); }
  .row .mini .ring svg { width: 24px; height: 24px; } .row .mini .ring span { display: none; }
  .row .mini .fd { width: 26px; height: 22px; margin: 4px 7px; }
  .row .own { display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .more { position: static; }
  .row[aria-selected="true"] { background: var(--sel); box-shadow: inset 2px 0 0 var(--acc); }
  .row.drop-on { background: var(--sel); box-shadow: inset 0 0 0 1.5px var(--acc); }

  .band { position: absolute; border: 1px solid var(--acc); background: rgba(139, 44, 60, .08); border-radius: 2px; pointer-events: none; z-index: 5; }
  .empty { display: grid; place-items: center; text-align: center; padding: 72px 20px; color: var(--soft); }
  .empty svg.art { width: 160px; height: 112px; margin-bottom: 18px; }
  .empty h2 { color: var(--ink); font-size: 16px; font-weight: 650; margin-bottom: 6px; }
  .empty p { max-width: 340px; font-size: 13px; line-height: 1.5; }
  .empty .acts { display: flex; gap: 8px; justify-content: center; margin-top: 18px; }

  .status { display: flex; align-items: center; gap: 16px; height: 34px; padding: 0 20px; border-top: 1px solid var(--line2); color: var(--soft); font-size: 12px; flex: none; }
  .status .grow { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status .upl { display: flex; align-items: center; gap: 8px; color: var(--ink); }
  .status .upl i { display: block; width: 90px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .status .upl i b { display: block; height: 100%; background: var(--acc); transition: width .2s linear; }

  /* details panel */
  .panel { position: relative; background: var(--raise); border-left: 1px solid var(--line); overflow: hidden; min-height: 0; }
  .pin { position: absolute; top: 0; bottom: 0; left: 0; width: 340px; display: flex; flex-direction: column; transition: transform .26s var(--ease), opacity .2s; }
  .app:not(.panel-on) .pin { transform: translateX(24px); opacity: 0; visibility: hidden; transition: transform .26s var(--ease), opacity .2s, visibility 0s .26s; }
  .ph { display: flex; align-items: center; justify-content: space-between; height: 60px; padding: 0 12px 0 20px; border-bottom: 1px solid var(--line2); flex: none; }
  .ph h2 { font-size: 14px; font-weight: 650; }
  .pb { flex: 1; overflow-y: auto; padding: 20px; }
  .pv { position: relative; aspect-ratio: 4 / 3; border-radius: var(--r); overflow: hidden; box-shadow: 0 0 0 1px rgba(28, 26, 23, .08); background: var(--line2); }
  .pv > svg { display: block; width: 100%; height: 100%; }
  .pv.stack { background: none; box-shadow: none; overflow: visible; }
  .pv.stack .th { position: absolute; inset: 8% 10%; border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 1px rgba(28,26,23,.08), 0 6px 14px -6px rgba(28,26,23,.3); }
  .pv.folderpv { display: grid; place-items: center; background: var(--bg); }
  .pv.folderpv .fd { width: 96px; height: 82px; }
  .pt { margin: 16px 0 2px; font-size: 16px; font-weight: 650; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .ps { color: var(--soft); font-size: 13px; }
  .pa { display: flex; gap: 8px; margin: 16px 0 4px; }
  .pa .btn { flex: 1; justify-content: center; padding: 0 8px; }
  .pa .ib { border: 1px solid var(--line); width: 32px; }
  .pa .ib[aria-pressed="true"] { color: #b07623; }
  .pa .ib[aria-pressed="true"] svg { fill: #c4862b; stroke: #c4862b; }
  .psec { border-top: 1px solid var(--line2); margin-top: 18px; padding-top: 16px; }
  .psec h3 { font-size: 12px; font-weight: 600; color: var(--soft); margin-bottom: 10px; }
  dl.meta { display: grid; grid-template-columns: 96px 1fr; gap: 8px 12px; font-size: 13px; }
  dl.meta dt { color: var(--soft); }
  dl.meta dd { min-width: 0; overflow-wrap: anywhere; display: flex; align-items: center; gap: 6px; }
  dl.meta dd button { color: var(--acc); text-decoration: underline; text-decoration-color: rgba(139, 44, 60, .35); text-underline-offset: 2px; text-align: left; }
  .acc-row { display: flex; align-items: center; gap: 12px; }
  .avs { display: flex; }
  .avs .av { box-shadow: 0 0 0 2px var(--raise); }
  .avs .av + .av { margin-left: -2px; }
  .avs .av.more2 { background: var(--line2); color: var(--soft); }
  .acc-row p { flex: 1; font-size: 12.5px; color: var(--soft); line-height: 1.35; }
  .acc-row p b { color: var(--ink); font-weight: 550; }
  .btn.wide { width: 100%; justify-content: center; margin-top: 12px; }
  .act { list-style: none; display: grid; gap: 14px; }
  .act li { display: grid; grid-template-columns: 24px 1fr; gap: 10px; font-size: 12.5px; line-height: 1.4; color: var(--soft); }
  .act li b { color: var(--ink); font-weight: 550; }
  .act li q { color: var(--ink); quotes: "\201C" "\201D"; }
  .act li small { display: block; color: var(--soft); font-size: 12px; margin-top: 2px; }
  .near { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .near button { aspect-ratio: 4 / 3; border-radius: 5px; overflow: hidden; box-shadow: 0 0 0 1px rgba(28,26,23,.08); }
  .near svg { display: block; width: 100%; height: 100%; }
  .say[hidden] { display: none; }
  .say { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line2); flex: none; }
  .say input { flex: 1; min-width: 0; height: 32px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; outline: none; }
  .say input::placeholder { color: #736d63; }
  .say input:focus { border-color: var(--sel-line); box-shadow: 0 0 0 3px rgba(139, 44, 60, .12); }
  .kinds { list-style: none; display: grid; gap: 8px; font-size: 13px; }
  .kinds li { display: flex; align-items: center; gap: 8px; }
  .kinds li b { margin-left: auto; font-weight: 500; }
  .kinds svg { color: var(--soft); width: 16px; height: 16px; }

  /* menus */
  .menu { position: fixed; z-index: 40; min-width: 224px; max-width: 280px; padding: 5px; border-radius: 9px; background: var(--raise); box-shadow: 0 0 0 1px rgba(28, 26, 23, .1), 0 12px 32px -8px rgba(28, 26, 23, .28); transform-origin: top left; animation: pop .14s var(--ease); max-height: calc(100svh - 16px); overflow-y: auto; }
  @keyframes pop { from { opacity: 0; transform: scale(.97); } }
  .menu [role="menuitem"], .menu [role="menuitemradio"] { display: flex; align-items: center; gap: 10px; width: 100%; height: 32px; padding: 0 10px; border-radius: 5px; font-size: 13px; text-align: left; outline: none; }
  .menu [role^="menuitem"] svg.i { width: 16px; height: 16px; color: var(--soft); }
  .menu [role^="menuitem"] span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu [role^="menuitem"] kbd { font: 12px var(--sans); color: var(--faint); }
  .menu [role^="menuitem"]:hover, .menu [role^="menuitem"]:focus { background: var(--bg); }
  .menu [role^="menuitem"]:focus-visible { box-shadow: inset 0 0 0 1.5px var(--acc); }
  .menu [role^="menuitem"][aria-disabled="true"] { opacity: .45; cursor: default; }
  .menu .danger, .menu .danger svg.i { color: #a3263a; }
  .menu .danger:hover, .menu .danger:focus { background: #f8e8ea; }
  .menu hr { border: 0; border-top: 1px solid var(--line2); margin: 5px 4px; }
  .menu .mh { display: flex; align-items: center; gap: 6px; padding: 6px 10px 6px; font-size: 12px; color: var(--soft); font-weight: 550; }
  .menu .mh button { margin-left: -6px; width: 24px; height: 24px; border-radius: 5px; display: grid; place-items: center; }
  .menu .mh button:hover { background: var(--bg); }
  .menu [role="menuitemradio"] .tick { width: 16px; height: 16px; color: var(--acc); visibility: hidden; }
  .menu [role="menuitemradio"][aria-checked="true"] .tick { visibility: visible; }
  .menu .sub { padding-left: calc(10px + var(--d, 0) * 14px); }

  /* rename */
  .ren { width: 100%; height: 24px; margin: -3px 0 -1px -4px; padding: 0 4px; border: 1.5px solid var(--acc); border-radius: 4px; background: #fff; font-size: 13px; font-weight: 550; outline: none; user-select: text; -webkit-user-select: text; }

  const QUEUE = [
    ["Location scout — Porto 01.jpg", "image", "hills", 5.4 * MB, "5000 × 3333"], ["Edit notes — cut 5.pdf", "pdf", "#47647e", 380 * KB, "3 pages"], ["Mix — final master.wav", "audio", "h", 64 * MB, "03:58 · 48 kHz"],
    ["Storefront — dusk.jpg", "image", "facade", 4.1 * MB, "6000 × 4000"], ["Launch film — cut 5.mp4", "video", "dusk", 1.38 * GB, "02:44 · 3840 × 2160"], ["campaign-flags.ts", "code", "ts", 3.1 * KB, "84 lines"]
  ];
  let qi = 0, upTimer = 0;
  function upload() {
    if (isVirtual()) return;
    if (S.sort.k !== "m" || S.sort.d !== 1) S.sort = { k: "m", d: 1 };
    const made = [];
    for (let i = 0; i < 3; i++) { const q = QUEUE[qi++ % QUEUE.length]; const n = file(S.loc, q[0], q[1], q[2], q[3], 0, "me", q[4], { up: 0.02, rate: [0.07, 0.045, 0.03][i] }); n.name = uniqueName(n.name, S.loc, n.id); made.push(n); }
    canvas.scrollTop = 0; render();
    if (!upTimer) upTimer = setInterval(tick, 140);
  }
  function tick() {
    if (S.renaming) return;
    const ups = Object.values(N).filter((n) => n.up && !n.gone);
    if (!ups.length) { clearInterval(upTimer); upTimer = 0; return; }
    let done = [];
    ups.forEach((n) => {
      n.up = Math.min(1, n.up + n.rate * (0.6 + Math.random() * 0.8));
      const el = document.getElementById("it-" + n.id);
      if (el) { el.querySelector(".pg").style.strokeDashoffset = 119.4 * (1 - n.up); const t = el.querySelector(".ring span"); if (t) t.textContent = Math.round(n.up * 100) + "%"; }
      if (n.up >= 1) done.push(n);
    });
    if (done.length) {
      done.forEach((n) => { n.up = 0; extra += n.size; });
      const left = Object.values(N).filter((n) => n.up && !n.gone).length;
      render(); renderStore();
      if (!left) toast("All uploads finished");
    } else renderStatus();
    if (S.sel.size === 1 && ups.some((n) => S.sel.has(n.id))) { const n = N[[...S.sel][0]]; const ps = $("#pBody .ps"); if (ps && n.up) ps.textContent = kindLabel(n) + " · Uploading " + Math.round(n.up * 100) + "%"; }
  }

  /* ---------- inline rename ---------- */
  function startRename(id, fresh) {
    const el = document.getElementById("it-" + id); if (!el || N[id].trash) return;
    const nm = el.querySelector(".name"); const n = N[id];
    S.renaming = id;
    const inp = document.createElement("input"); inp.className = "ren"; inp.value = n.name; inp.setAttribute("aria-label", "New name for " + n.name); inp.spellcheck = false;
    nm.replaceWith(inp); inp.focus();
    const dot = n.kind === "folder" ? -1 : n.name.lastIndexOf(".");
    inp.setSelectionRange(0, dot > 0 ? dot : n.name.length);
    let err = null, done = false;
    const showErr = (t) => { if (!err) { err = document.createElement("div"); err.className = "rerr"; err.setAttribute("role", "alert"); el.appendChild(err); } err.textContent = t; };
    const finish = (commit) => {
      if (done) return;
      const v = inp.value.trim().replace(/\s+/g, " ");
      if (commit) {
        if (!v) { if (fresh) { done = true; } else return showErr("A name can’t be empty."), inp.focus(); }
        else if (/[\/\\:]/.test(v)) return showErr("Names can’t contain / \\ or :"), inp.focus();
        else if (v !== n.name && uniqueName(v, n.parent, id) !== v) return showErr(`“${v}” already exists in ${N[n.parent].name}.`), inp.focus();
      }
      done = true; S.renaming = null;
      const old = n.name;
      if (commit && v && v !== old) { n.name = v; n.m = 0; logIt(n, `renamed this from <b>${esc(old)}</b>`); }
      render(); focusItem(id, false);
      if (commit && v && v !== old && !fresh) toast(`Renamed to “${v}”`, () => { n.name = old; n.log.shift(); render(); });
    };
    inp.addEventListener("keydown", (e) => { e.stopPropagation(); if (e.key === "Enter") { e.preventDefault(); finish(true); } else if (e.key === "Escape") { e.preventDefault(); finish(fresh ? true : false); } });
    inp.addEventListener("input", () => { if (err) { err.remove(); err = null; } });
    inp.addEventListener("blur", () => setTimeout(() => { if (!done) { const v = inp.value.trim(); if (!v || uniqueName(v, n.parent, id) !== v || /[\/\\:]/.test(v)) { inp.value = n.name; } finish(true); } }, 0));
    inp.addEventListener("pointerdown", (e) => e.stopPropagation());
  }

  /* ---------- context menu ---------- */
  const menu = document.createElement("div"); menu.className = "menu"; menu.setAttribute("role", "menu"); menu.hidden = true; document.body.appendChild(menu);
  let menuFrom = null;
  const mi = (act, icon, text, key = "", cls = "", dis = false) => `<button role="menuitem" data-m="${act}" class="${cls}" tabindex="-1" ${dis ? 'aria-disabled="true"' : ""}>${ic(icon)}<span>${text}</span>${key ? `<kbd>${key}</kbd>` : ""}</button>`;
  function itemMenu() {
    const ids = order.filter((id) => S.sel.has(id)); const one = ids.length === 1 ? N[ids[0]] : null;
    if (S.loc === "trash") return mi("restore", "restore", ids.length > 1 ? `Restore ${ids.length} items` : "Restore") + "<hr>" + mi("delete", "trash", "Delete forever", "Del", "danger");
    const starred = ids.every((id) => N[id].star);
    return (ids.length > 1 ? `<div class="mh">${ids.length} items selected</div>` : "") +
      (one ? mi("open", "open", one.kind === "folder" ? "Open" : "Preview", "↵") + mi("rename", "pen", "Rename", "F2") : "") +
      mi("dup", "dup", "Duplicate", "⌘D") + mi("movemenu", "move", "Move to…") + mi("star", "star", starred ? "Remove from Starred" : "Add to Starred") +
      (one ? mi("link", "link", "Copy link") : "") + mi("download", "down", "Download") + "<hr>" + mi("delete", "trash", "Move to Trash", "Del", "danger");
  }
  function bgMenu() {
    const v = isVirtual();
    const r = (k, t) => `<button role="menuitemradio" data-m="sort:${k}" aria-checked="${S.sort.k === k}" tabindex="-1">${ic("check", "i tick")}<span>${t}</span></button>`;
    return mi("newfolder", "newf", "New folder", "", "", v) + mi("upload", "upload", "Upload files", "", "", v) + "<hr><div class=\"mh\">Sort by</div>" + r("name", "Name") + r("m", "Date modified") + r("size", "Size") + r("kind", "Kind") + "<hr>" + mi("view", S.view === "grid" ? "list" : "grid", S.view === "grid" ? "Show as list" : "Show as grid") + mi("selall", "selall", "Select all", "⌘A", "", !order.length);
  }
  function moveMenu() {
    const ids = order.filter((id) => S.sel.has(id));
    const rows = [];
    const walk = (id, d) => kids(id).filter((n) => n.kind === "folder").sort((a, b) => a.name.localeCompare(b.name)).forEach((n) => { if (ids.includes(n.id)) return; rows.push([n, d]); walk(n.id, d + 1); });
    rows.push([N.root, 0]); walk("root", 1);
    return `<div class="mh"><button data-m="back" aria-label="Back">${ic("back")}</button>Move ${ids.length === 1 ? "“" + esc(N[ids[0]].name) + "”" : ids.length + " items"} to</div>` +
      rows.map(([n, d]) => { const dis = !validDrop(n.id, ids); return `<button role="menuitem" data-m="to:${n.id}" class="sub" style="--d:${d}" tabindex="-1" ${dis ? 'aria-disabled="true"' : ""}>${n.id === "root" ? ic("all") : fdSvg(n.tint).replace('class="fd"', 'class="fd" style="width:16px;height:14px;flex:none"')}<span>${esc(n.name)}</span>${N[ids[0]] && N[ids[0]].parent === n.id ? "<kbd>Current</kbd>" : ""}</button>`; }).join("");
  }
  function openMenu(html, x, y, from) {
    menuFrom = from || document.activeElement;
    menu.innerHTML = html; menu.hidden = false; menu.style.left = "0px"; menu.style.top = "0px";
    const w = menu.offsetWidth, h = menu.offsetHeight;
    menu.style.left = Math.max(8, Math.min(x, innerWidth - w - 8)) + "px";
    menu.style.top = Math.max(8, Math.min(y, innerHeight - h - 8)) + "px";
    const f = menu.querySelector('[role^="menuitem"]:not([aria-disabled])'); f && f.focus();
  }
  function closeMenu(restore) {
    if (menu.hidden) return; menu.hidden = true;
    $("#sortBtn").setAttribute("aria-expanded", "false");
    if (restore && menuFrom && menuFrom.isConnected) menuFrom.focus({ preventScroll: true });
    else if (restore && S.focus) focusItem(S.focus, false);
  }
  menu.addEventListener("click", (e) => {
    const b = e.target.closest("[data-m]"); if (!b || b.getAttribute("aria-disabled")) return;
    const m = b.dataset.m, ids = order.filter((id) => S.sel.has(id));
    if (m === "movemenu") { const r = menu.getBoundingClientRect(); openMenu(moveMenu(), r.left, r.top, menuFrom); return; }
    if (m === "back") { const r = menu.getBoundingClientRect(); openMenu(itemMenu(), r.left, r.top, menuFrom); return; }
    closeMenu(true);
    if (m.startsWith("to:")) return moveTo(ids, m.slice(3));
    if (m.startsWith("sort:")) { const k = m.slice(5); S.sort = { k, d: 1 }; return render(); }
    run(m, ids);
  });
  menu.addEventListener("keydown", (e) => {
    const all = [...menu.querySelectorAll('[role^="menuitem"]:not([aria-disabled]), .mh button')];
    const i = all.indexOf(document.activeElement);
    if (e.key === "ArrowDown") { e.preventDefault(); all[(i + 1) % all.length].focus(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); all[(i - 1 + all.length) % all.length].focus(); }
    else if (e.key === "Home") { e.preventDefault(); all[0].focus(); }
    else if (e.key === "End") { e.preventDefault(); all[all.length - 1].focus(); }
    else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closeMenu(true); }
    else if (e.key === "ArrowLeft" && menu.querySelector('[data-m="back"]')) { e.preventDefault(); menu.querySelector('[data-m="back"]').click(); }
    else if (e.key === "ArrowRight" && document.activeElement.dataset.m === "movemenu") { e.preventDefault(); document.activeElement.click(); }
    else if (e.key === "Tab") { e.preventDefault(); closeMenu(true); }
  });
  addEventListener("pointerdown", (e) => { if (!menu.hidden && !menu.contains(e.target) && !e.target.closest("#sortBtn")) closeMenu(false); }, true);
  addEventListener("resize", () => closeMenu(false));
  canvas.addEventListener("scroll", () => closeMenu(false));

  canvas.addEventListener("contextmenu", (e) => {
    e.preventDefault(); if (S.renaming) return;
    const it = e.target.closest(".it");
    if (it) { const id = it.dataset.id; if (!S.sel.has(id)) select([id], { focus: id, anchor: id }); else { S.focus = id; paintSel(); } openMenu(itemMenu(), e.clientX, e.clientY, it); }
    else openMenu(bgMenu(), e.clientX, e.clientY, canvas);
  });
  function menuAt(el) { const r = el.getBoundingClientRect(); openMenu(itemMenu(), r.left + 12, r.top + Math.min(r.height, 40), el); }

  function run(m, ids) {
    const one = ids.length === 1 ? ids[0] : null;
    if (m === "open" && one) open(one);
    else if (m === "openit") open(ids[0] || S.loc);
    else if (m === "preview" && one) quickLook(one);
    else if (m === "rename" && one) startRename(one);
    else if (m === "dup") duplicate(ids);
    else if (m === "star") star(ids.length ? ids : []);
    else if (m === "link" && one) copyLink(N[one]);
    else if (m === "copylink") copyLink(N[one || S.loc]);
    else if (m === "download") toast(ids.length > 1 ? `Zipping ${ids.length} items for download…` : `Downloading “${N[one || S.loc].name}”`);
    else if (m === "delete") del(ids);
    else if (m === "restore") restore(ids);
    else if (m === "newfolder") newFolder();
    else if (m === "upload") upload();
    else if (m === "view") { S.view = S.view === "grid" ? "list" : "grid"; render(); }
    else if (m === "selall") select(order, { focus: order[order.length - 1], anchor: order[0] });
    else if (m === "move") { const b = $("#pBody [data-act=move]"); const r = b.getBoundingClientRect(); openMenu(moveMenu(), r.left, r.bottom + 6, b); }
  }

  /* ---------- clicks around the screen ---------- */
  inner.addEventListener("click", (e) => {
    const more = e.target.closest(".more");
    if (more) { const it = more.closest(".it"); const id = it.dataset.id; if (!S.sel.has(id)) select([id], { focus: id, anchor: id }); const r = more.getBoundingClientRect(); openMenu(itemMenu(), r.left, r.bottom + 4, more); return; }
    const s = e.target.closest("[data-sort]");
    if (s) { const k = s.dataset.sort; S.sort = S.sort.k === k ? { k, d: -S.sort.d } : { k, d: 1 }; render(); return; }
    const a = e.target.closest("[data-act]");
    if (a) run(a.dataset.act, []);
  });
  inner.addEventListener("dblclick", (e) => { const it = e.target.closest(".it"); if (it && !S.renaming && !e.target.closest(".more")) open(it.dataset.id); });
  $("#pBody").addEventListener("click", (e) => {
    const g = e.target.closest("[data-go]"); if (g) return go(g.dataset.go);
    const pick = e.target.closest("[data-pick]"); if (pick) { const id = pick.dataset.pick; select([id], { focus: id, anchor: id }); return focusItem(id); }
    const a = e.target.closest("[data-act]"); if (!a) return;
    const ids = order.filter((id) => S.sel.has(id));
    if (a.dataset.act === "star") { const t = ids.length ? ids : [S.loc]; star(t); return; }
    run(a.dataset.act, ids);
  });
  const say = () => {
    const t = $("#sayIn").value.trim(), n = N[[...S.sel][0]] || N[S.loc];
    if (!t || !n || S.sel.size > 1) return;
    logIt(n, `left a comment: <q>${esc(t)}</q>`); $("#sayIn").value = ""; renderPanel();
    const list = $("#pBody .act"); if (list) list.scrollIntoView({ block: "nearest" });
  };
  $("#sayBtn").addEventListener("click", say);
  $("#sayIn").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); say(); } });
  document.querySelector(".side").addEventListener("click", (e) => { const g = e.target.closest("[data-go]"); if (g) go(g.dataset.go); if (e.target.closest("#settings")) toast("Workspace settings open in the admin console"); });
  $("#crumbs").addEventListener("click", (e) => { const g = e.target.closest("[data-go]"); if (g && g.dataset.go !== S.loc) go(g.dataset.go); });
  $("#vGrid").addEventListener("click", () => { S.view = "grid"; render(); });
  $("#vList").addEventListener("click", () => { S.view = "list"; render(); });
  $("#newBtn").addEventListener("click", newFolder);
  $("#upBtn").addEventListener("click", upload);
  $("#infoBtn").addEventListener("click", () => { S.panel = !S.panel; renderTools(); });
  $("#pClose").addEventListener("click", () => { S.panel = false; renderTools(); $("#infoBtn").focus(); });
  $("#scrimP").addEventListener("click", () => { S.panel = false; renderTools(); });
  const setSide = (on) => { S.side = on; app.classList.toggle("side-on", on); $("#menuBtn").setAttribute("aria-expanded", on); };
  $("#menuBtn").addEventListener("click", () => { setSide(!S.side); if (S.side) document.querySelector(".side .loc").focus(); });
  $("#scrim").addEventListener("click", () => setSide(false));
  $("#sortBtn").addEventListener("click", (e) => {
    if (!menu.hidden) return closeMenu(true);
    const r = e.currentTarget.getBoundingClientRect();
    const opt = (k, t) => `<button role="menuitemradio" data-m="sort:${k}" aria-checked="${S.sort.k === k}" tabindex="-1">${ic("check", "i tick")}<span>${t}</span></button>`;
    openMenu(`<div class="mh">Sort by</div>${opt("name", "Name")}${opt("m", "Date modified")}${opt("size", "Size")}${opt("kind", "Kind")}<hr>${mi("dir", S.sort.d === 1 ? "chevdown" : "chevup", { name: ["A to Z", "Z to A"], m: ["Newest first", "Oldest first"], size: ["Largest first", "Smallest first"], kind: ["A to Z", "Z to A"] }[S.sort.k][S.sort.d === 1 ? 1 : 0].replace(/^/, "Switch to: "))}`, r.right - 230, r.bottom + 6, e.currentTarget);
    e.currentTarget.setAttribute("aria-expanded", "true");
  });
  menu.addEventListener("click", (e) => { const b = e.target.closest('[data-m="dir"]'); if (b) { S.sort.d = -S.sort.d; render(); } }, true);

  /* ---------- keyboard ---------- */
  function neighbour(id, dir) {
    const el = document.getElementById("it-" + id); if (!el) return order[0];
    const a = el.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2;
    let best = null, bd = Infinity;
    order.forEach((oid) => {
      if (oid === id) return; const b = document.getElementById("it-" + oid).getBoundingClientRect(); const bx = b.left + b.width / 2, by = b.top + b.height / 2;
      const dy = by - ay; if (dir > 0 ? dy < 4 : dy > -4) return;
      const d = Math.abs(dy) * 4 + Math.abs(bx - ax); if (d < bd) { bd = d; best = oid; }
    });
    return best;
  }
  inner.addEventListener("keydown", (e) => {
    if (S.renaming || e.target.closest("input")) return;
    const id = S.focus || order[0]; if (!id) return;
    const mod = e.metaKey || e.ctrlKey; let next = null;
    const i = order.indexOf(id);
    switch (e.key) {
      case "ArrowRight": next = order[Math.min(order.length - 1, i + 1)]; break;
      case "ArrowLeft": next = order[Math.max(0, i - 1)]; break;
      case "ArrowDown": next = S.view === "list" ? order[Math.min(order.length - 1, i + 1)] : neighbour(id, 1) || id; break;
      case "ArrowUp": if (mod && !isVirtual() && S.loc !== "root") { e.preventDefault(); return go(N[S.loc].parent); } next = S.view === "list" ? order[Math.max(0, i - 1)] : neighbour(id, -1) || id; break;
      case "Home": next = order[0]; break;
      case "End": next = order[order.length - 1]; break;
      case "Enter": e.preventDefault(); return S.loc === "trash" ? restore([id]) : open(id);
      case "F2": e.preventDefault(); if (S.loc !== "trash") startRename(id); return;
      case "Delete": case "Backspace": e.preventDefault(); return del(S.sel.size ? order.filter((x) => S.sel.has(x)) : [id]);
      case " ": e.preventDefault(); if (mod) { const s = new Set(S.sel); s.has(id) ? s.delete(id) : s.add(id); select(s, { anchor: id }); } else if (!S.sel.has(id)) select([id], { anchor: id }); else quickLook(id); return;
      case "Escape": if (S.sel.size) { e.preventDefault(); select([]); } return;
      case "ContextMenu": e.preventDefault(); if (!S.sel.has(id)) select([id], { anchor: id }); return menuAt(document.getElementById("it-" + id));
      case "F10": if (e.shiftKey) { e.preventDefault(); if (!S.sel.has(id)) select([id], { anchor: id }); return menuAt(document.getElementById("it-" + id)); } return;
      case "a": case "A": if (mod) { e.preventDefault(); select(order, { focus: id, anchor: order[0] }); } return;
      case "d": case "D": if (mod) { e.preventDefault(); const ids = S.sel.size ? order.filter((x) => S.sel.has(x)) : [id]; if (S.loc !== "trash") duplicate(ids); } return;
      default: return;
    }
    e.preventDefault();
    if (!next) return;
    if (e.shiftKey) { S.anchor = S.anchor || id; select(range(S.anchor, next), { focus: next }); }
    else if (mod) S.focus = next;
    else select([next], { focus: next, anchor: next });
    focusItem(next);
  });
  inner.addEventListener("focusin", (e) => { const it = e.target.closest(".it"); if (it && it.dataset.id !== S.focus) { S.focus = it.dataset.id; paintSel(); } });
  canvas.addEventListener("keydown", (e) => { if (e.target === canvas && /^Arrow|Home|End/.test(e.key) && order[0]) { e.preventDefault(); const id = S.focus || order[0]; select([id], { focus: id, anchor: id }); focusItem(id); } });
  addEventListener("keydown", (e) => {
    const typing = e.target.closest && e.target.closest("input, textarea");
    if ((e.metaKey || e.ctrlKey) && (e.key === "z" || e.key === "Z") && !e.shiftKey && !typing && undoFn) { e.preventDefault(); doUndo(); }
    if (e.key === "Escape" && !typing && menu.hidden && ql.hidden) { if (S.side) setSide(false); else if (S.panel && innerWidth <= 1100) { S.panel = false; renderTools(); } }
  });

  /* ---------- quick look ---------- */
  const ql = $("#ql"); let qlId = null, qlFrom = null;
  function quickLook(id) {
    const n = N[id]; if (!n || n.kind === "folder") return open(id);
    qlId = id; qlFrom = qlFrom || document.activeElement;
    $("#qlName").textContent = n.name; $("#qlSub").textContent = kindLabel(n) + " · " + fmtSize(n.size) + " · " + n.meta.split(" · ").slice(-1)[0];
    $("#qlView").innerHTML = thumb(n).replace('preserveAspectRatio="xMidYMid slice"', 'preserveAspectRatio="xMidYMid meet"') + chip(n);
    ql.hidden = false; select([id], { focus: id, anchor: id });
    if (!ql.contains(document.activeElement)) $("#qlClose").focus();
  }
  function qlClose() { ql.hidden = true; const id = qlId; qlId = null; qlFrom = null; focusItem(id); }
  $("#qlClose").addEventListener("click", qlClose);
  ql.addEventListener("click", (e) => { if (e.target === ql) qlClose(); });
  ql.addEventListener("keydown", (e) => {
    if (e.key === "Escape" || e.key === " ") { e.preventDefault(); e.stopPropagation(); qlClose(); }
    else if (e.key === "Tab") { e.preventDefault(); $("#qlClose").focus(); }
  });

  /* ---------- static icons, first paint ---------- */
  $("#vGrid").innerHTML = ic("grid"); $("#vList").innerHTML = ic("list");
  $("#newBtn").innerHTML = ic("newf") + '<span class="lbl">New folder</span>'; $("#upBtn").innerHTML = ic("upload") + '<span class="lbl">Upload</span>';
  $("#infoBtn").innerHTML = ic("info"); $("#pClose").innerHTML = ic("x"); $("#menuBtn").innerHTML = ic("menu"); $("#settings").innerHTML = ic("gear");
  $("#qlClose").innerHTML = ic("x");
  renderStore(); render();
})();
</script>
</body>
