<!doctype html>
<!-- Credit card — Uiverse Originals. Free to use and adapt (MIT). One file, no dependencies.
     Tilts toward the pointer with a moving sheen; click or press Enter to flip to the back. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Credit card</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    display: grid; place-items: center; perspective: 1100px;
    font: 500 14px/1.2 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(80% 70% at 50% 40%, #1d1f2b, #0a0b10);
    color: #fff;
  }
  .scene { width: 340px; aspect-ratio: 1.586; }
  .card {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d; cursor: pointer; outline: none;
    transform: rotateX(var(--rx, 0deg)) rotateY(calc(var(--ry, 0deg) + var(--flip, 0deg)));
    transition: transform .7s cubic-bezier(.2,.8,.2,1);
  }
  .card.tracking { transition: transform .12s linear; }
  .card.flipped { --flip: 180deg; }
  .face {
    position: absolute; inset: 0; border-radius: 18px; overflow: hidden; backface-visibility: hidden;
    background:
      radial-gradient(120% 140% at 0% 0%, #6d5dfc 0%, transparent 55%),
      radial-gradient(120% 140% at 100% 100%, #ff5c8a 0%, transparent 55%),
      linear-gradient(135deg, #20163f, #3a1846);
    box-shadow: 0 30px 60px -18px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.14);
  }
  /* the sheen follows the pointer */
  .face::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; mix-blend-mode: overlay;
    background: radial-gradient(circle at var(--mx, 30%) var(--my, 20%), rgba(255,255,255,.55), transparent 45%);
  }
  .front { padding: 22px 24px; display: flex; flex-direction: column; justify-content: space-between; }
  .row { display: flex; justify-content: space-between; align-items: center; }
  .brand { font-weight: 750; letter-spacing: .02em; font-size: 15px; }
  .chip {
    width: 42px; height: 32px; border-radius: 7px;
    background: linear-gradient(135deg, #f6e3a1, #c9a24a 60%, #f3d98b);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.2);
    position: relative;
  }
  .chip::before { content: ""; position: absolute; inset: 7px 12px; border: 1px solid rgba(90,60,10,.4); border-radius: 4px; }
  .num { font: 500 20px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .12em; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
  .meta { display: flex; gap: 28px; }
  .meta small { display: block; font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; opacity: .6; margin-bottom: 4px; }
  .meta span { font-size: 13px; letter-spacing: .04em; }
  .mark { display: flex; }
  .mark i { width: 30px; height: 30px; border-radius: 50%; background: #ff5f3a; opacity: .95; }
  .mark i + i { background: #ffb23a; margin-left: -12px; mix-blend-mode: screen; }
  .back { transform: rotateY(180deg); }
  .stripe { height: 44px; margin-top: 26px; background: #0b0b10; }
  .sig { display: flex; align-items: center; gap: 12px; margin: 22px 24px 0; }
  .sig div { flex: 1; height: 36px; border-radius: 4px; background: repeating-linear-gradient(-45deg, #fff, #fff 6px, #ece8ff 6px, #ece8ff 12px); }
  .cvv { font: 600 15px ui-monospace, Menlo, monospace; color: #20163f; background: #fff; padding: 9px 12px; border-radius: 4px; }
  .back p { margin: 18px 24px 0; font-size: 10.5px; opacity: .6; line-height: 1.5; }
  .tip { position: fixed; bottom: 22px; left: 0; right: 0; text-align: center; font-size: 12px; color: rgba(255,255,255,.45); }
  @media (prefers-reduced-motion: reduce) { .card, .card.tracking { transition: none; } }
</style>
</head>
<body>
  <div class="scene">
    <div class="card" tabindex="0" role="button" aria-pressed="false" aria-label="Payment card. Press to flip.">
      <div class="face front">
        <div class="row"><span class="brand">Nova</span><span class="chip" aria-hidden="true"></span></div>
        <div class="num">4921 •••• •••• 7730</div>
        <div class="row">
          <div class="meta">
            <div><small>Card holder</small><span>Layla Haddad</span></div>
            <div><small>Expires</small><span>09/29</span></div>
          </div>
          <span class="mark" aria-hidden="true"><i></i><i></i></span>
        </div>
      </div>
      <div class="face back" aria-hidden="true">
        <div class="stripe"></div>
        <div class="sig"><div></div><span class="cvv">382</span></div>
        <p>This card is a design sample. Numbers are invented and will not work anywhere.</p>
      </div>
    </div>
  </div>
  <div class="tip">Move the pointer over the card · click to flip</div>
<script>
  const card = document.querySelector(".card");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  card.addEventListener("pointermove", (e) => {
    if (still) return;
    const r = card.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    card.classList.add("tracking");
    card.style.setProperty("--ry", `${(x - 0.5) * 22}deg`);
    card.style.setProperty("--rx", `${(0.5 - y) * 18}deg`);
    card.style.setProperty("--mx", `${x * 100}%`);
    card.style.setProperty("--my", `${y * 100}%`);
  });
  card.addEventListener("pointerleave", () => {
    card.classList.remove("tracking");
    card.style.setProperty("--rx", "0deg");
    card.style.setProperty("--ry", "0deg");
  });
  const flip = () => {
    card.classList.remove("tracking");
    card.setAttribute("aria-pressed", card.classList.toggle("flipped"));
  };
  card.addEventListener("click", flip);
  card.addEventListener("keydown", (e) => (e.key === "Enter" || e.key === " ") && (e.preventDefault(), flip()));
</script>
</body>
</html>
