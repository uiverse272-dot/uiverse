<!doctype html>
<!-- Data table — Uiverse Originals. Free to use and adapt (MIT). One file, no dependencies.
     A customers table for a billing product: search, a status filter with live counts, column and density
     controls, sortable headers, shift-click range select, inline status changes, row menus, pagination, and a
     bulk bar whose Delete animates rows out with an Undo that brings them back. Opens with three rows selected. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tollgate — Customers</title>
<style>
  :root {
    --bg: #ffffff; --tint: #f7f6f3; --line: #e8e7e2; --line-2: #d6d5ce; --ink: #141413; --soft: #63625c; --dim: #8d8c85;
    --accent: #cf3a17; --accent-tint: #fdf4f0; --accent-line: #f5d9cf;
    --row: 53px; --av: 32px; --gut: 24px; --c0: 52px;
    --sans: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 13px/18px var(--sans); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; overflow: hidden; }
  button, input, select { font: inherit; color: inherit; }
  button { border: 0; background: none; cursor: pointer; }
  svg { display: block; width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  [hidden] { display: none !important; }
  #live { position: fixed; top: 0; left: 0; }

  .app { display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; height: 100dvh; min-height: 440px; }
  .app[data-density="compact"] { --row: 40px; --av: 22px; }

  /* title row */
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px 24px; flex-wrap: wrap; padding: 20px var(--gut) 14px; }
  h1 { display: flex; align-items: center; gap: 10px; font-size: 24px; line-height: 32px; font-weight: 500; letter-spacing: -.022em; }
  h1 .mark { width: 24px; height: 24px; }
  h1 .mark rect { fill: var(--ink); stroke: none; }
  h1 .mark path { stroke: #fff; stroke-width: 2; }
  h1 .mark .arm { stroke: #ff6a3d; }
  h1 .mark circle { fill: #fff; stroke: none; }
  h1 .brand { color: var(--dim); }
  .sum { color: var(--soft); line-height: 20px; padding-bottom: 3px; }
  .sum b { color: var(--ink); font-weight: 500; }

  /* toolbar */
  .tools { display: flex; align-items: center; gap: 8px; padding: 0 var(--gut) 12px; flex-wrap: wrap; }
  .search { position: relative; display: flex; align-items: center; flex: 0 1 280px; min-width: 200px; height: 34px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--bg); transition: border-color .15s; }
  .search:hover { border-color: #bcbbb3; }
  .search:focus-within { border-color: var(--ink); }
  .search > svg { position: absolute; left: 10px; color: var(--soft); pointer-events: none; }
  .search input { width: 100%; height: 100%; padding: 0 56px 0 33px; border: 0; outline: 0; background: none; border-radius: 6px; }
  .search input::placeholder { color: #75746d; }
  .search input::-webkit-search-cancel-button { appearance: none; }
  .search kbd { position: absolute; right: 8px; min-width: 18px; height: 18px; display: grid; place-items: center; border: 1px solid var(--line-2); border-radius: 4px; font: 500 11px/1 var(--sans); color: var(--soft); pointer-events: none; }
  .search .x { position: absolute; right: 5px; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 4px; color: var(--soft); }
  .search .x:hover { background: var(--tint); color: var(--ink); }
  .search .x svg { width: 14px; height: 14px; }
  .ctl { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--bg); font-weight: 500; white-space: nowrap; transition: background-color .15s, border-color .15s; }
  .ctl:hover, .ctl[aria-expanded="true"] { background: var(--tint); border-color: #bcbbb3; }
  .ctl svg { color: var(--soft); }
  .ctl .chev { width: 12px; height: 12px; margin-right: -2px; transition: transform .15s var(--ease); }
  .ctl[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .ctl .n { min-width: 18px; height: 18px; padding: 0 5px; display: grid; place-items: center; border-radius: 4px; background: var(--ink); color: #fff; font-size: 11px; line-height: 1; }
  .ctl.done svg { color: #17723f; }
  .ctl:disabled { color: #a3a29a; background: var(--bg); border-color: var(--line); cursor: default; }
  .ctl:disabled svg { color: #b5b4ad; }
  .link { height: 34px; padding: 0 6px; color: var(--soft); border-radius: 6px; }
  .link:hover { color: var(--ink); }
  .grow { flex: 1 1 0; }
  .seg { display: inline-flex; padding: 2px; height: 34px; border: 1px solid var(--line-2); border-radius: 6px; }
  .seg button { width: 30px; display: grid; place-items: center; border-radius: 4px; color: var(--soft); transition: background-color .15s, color .15s; }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-checked="true"] { background: var(--tint); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }

  /* table */
  .scroll { position: relative; overflow: auto; border-top: 1px solid var(--line); overscroll-behavior: contain; outline-offset: -2px; }
  table { border-collapse: separate; border-spacing: 0; table-layout: fixed; width: max(100%, calc(var(--min, 900) * 1px)); }
  thead th { position: sticky; top: 0; z-index: 2; height: 36px; padding: 0 12px; background: var(--bg); border-bottom: 1px solid var(--line); text-align: left; font-weight: 500; color: var(--soft); font-size: 12px; }
  td, tbody th { height: var(--row); padding: 0 12px; background: var(--rowbg, var(--bg)); border-bottom: 1px solid var(--line); text-align: left; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background-color .12s; }
  tbody tr:hover { --rowbg: var(--tint); }
  tbody tr.sel { --rowbg: var(--accent-tint); }
  tbody tr.sel:hover { --rowbg: #fbece6; }
  .c0 { position: sticky; left: 0; z-index: 1; width: var(--c0); padding: 0; }
  .c1 { position: sticky; left: var(--c0); z-index: 1; padding: 0 12px 0 0; }
  thead .c0, thead .c1 { z-index: 3; }
  .ca { position: sticky; right: 0; z-index: 1; width: 56px; padding: 0; overflow: visible; }
  thead .ca { z-index: 3; }
  .scroll.sx .c1 { box-shadow: 1px 0 0 var(--line), 10px 0 12px -10px rgba(20, 20, 19, .22); }
  .scroll.sr-e .ca { box-shadow: -1px 0 0 var(--line), -10px 0 12px -10px rgba(20, 20, 19, .22); }

  .sh { display: inline-flex; align-items: center; gap: 4px; height: 36px; padding: 0 12px; margin: 0 -12px; font-weight: 500; color: inherit; border-radius: 4px; white-space: nowrap; }
  .c1 .sh { padding-left: 0; margin-left: 0; }
  .sh:hover { color: var(--ink); }
  .sh:focus-visible { outline-offset: -4px; }
  .sh svg { width: 12px; height: 12px; opacity: 0; transition: opacity .12s, transform .2s var(--ease); }
  .sh:hover svg { opacity: .55; }
  th[aria-sort="ascending"] .sh, th[aria-sort="descending"] .sh { color: var(--ink); }
  th[aria-sort="ascending"] .sh svg, th[aria-sort="descending"] .sh svg { opacity: 1; }
  th[aria-sort="descending"] .sh svg { transform: rotate(180deg); }
  th.num { text-align: right; }
  th.num .sh { flex-direction: row-reverse; }
  td.num { text-align: right; }
  td.zero { color: var(--dim); }
  td.quiet, .nil { color: var(--soft); }

  /* checkboxes */
  .ck { display: flex; align-items: center; height: 100%; padding-left: var(--gut); cursor: pointer; user-select: none; -webkit-user-select: none; }
  thead .ck { height: 36px; }
  input[type="checkbox"] { appearance: none; -webkit-appearance: none; display: grid; place-items: center; width: 16px; height: 16px; border: 1px solid #a9a8a0; border-radius: 4px; background: var(--bg); cursor: pointer; transition: background-color .12s, border-color .12s; }
  input[type="checkbox"]:hover { border-color: var(--ink); }
  input[type="checkbox"]::before { content: ""; width: 9px; height: 5px; margin-top: -2px; border-left: 1.75px solid #fff; border-bottom: 1.75px solid #fff; transform: rotate(-45deg) scale(0); transition: transform .14s var(--ease); }
  input[type="checkbox"]:checked, input[type="checkbox"]:indeterminate { background: var(--accent); border-color: var(--accent); }
  input[type="checkbox"]:checked::before { transform: rotate(-45deg) scale(1); }
  input[type="checkbox"]:indeterminate::before { width: 8px; height: 0; margin: 0; border-left: 0; border-bottom: 1.75px solid #fff; transform: none; }
  input[type="checkbox"]:disabled { opacity: .4; cursor: default; }

  /* customer cell */
  .who { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .av { display: inline-grid; place-items: center; flex: none; width: var(--av); height: var(--av); border-radius: 50%; background: var(--a, #eee); color: var(--b, #333); font-size: 12px; font-weight: 500; letter-spacing: .01em; }
  [data-density="compact"] .av { font-size: 10px; }
  .wt { display: block; min-width: 0; }
  .nm, .em { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nm { font-size: 14px; line-height: 18px; font-weight: 500; letter-spacing: -.003em; }
  .em { color: var(--soft); font-size: 12px; line-height: 16px; }
  [data-density="compact"] .wt { display: flex; align-items: baseline; gap: 8px; }
  [data-density="compact"] .nm { flex: none; max-width: 60%; font-size: 13px; }
  mark { background: #fbe9b7; color: inherit; border-radius: 2px; box-shadow: 0 0 0 1px #fbe9b7; }

  /* status pill */
  .pill { display: inline-flex; align-items: center; height: 24px; padding: 0 10px 0 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); font-size: 12px; white-space: nowrap; transition: border-color .12s, background-color .12s; }
  .pill i, .mdot { display: block; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--dot); margin-right: 6px; }
  .pill svg { width: 0; height: 12px; opacity: 0; transition: width .15s var(--ease), opacity .15s, margin .15s var(--ease); color: var(--soft); }
  tr:hover .pill svg, .pill:focus-visible svg, .pill[aria-expanded="true"] svg { width: 12px; margin: 0 -4px 0 3px; opacity: 1; }
  .pill:hover, .pill[aria-expanded="true"] { border-color: var(--dim); }
  [data-s="active"] { --dot: #1c9a55; }
  [data-s="trial"] { --dot: #2b6cd4; }
  [data-s="due"] { --dot: #d88a06; }
  [data-s="paused"] { --dot: transparent; }
  [data-s="churned"] { --dot: #c5352b; }
  .pill[data-s="due"] { background: #fdf5e4; border-color: #f0dcb0; color: #6e4700; }
  .pill[data-s="due"]:hover, .pill[data-s="due"][aria-expanded="true"] { border-color: #c79a3a; }
  [data-s="paused"] > i, .mdot[data-s="paused"] { box-shadow: inset 0 0 0 1.5px #8d8c85; }
  .pill[data-s="churned"] { color: var(--soft); }

  .own { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .own .av { --av: 20px; font-size: 9px; }
  [data-density="compact"] .own .av { font-size: 9px; }
  .own span:last-child { overflow: hidden; text-overflow: ellipsis; }
  .own .ghost { width: 20px; height: 20px; border-radius: 50%; border: 1px dashed var(--line-2); flex: none; }

  .act { display: grid; place-items: center; width: 28px; height: 28px; margin-left: 4px; border-radius: 6px; color: var(--soft); opacity: 0; transition: opacity .12s, background-color .12s; }
  tr:hover .act, .act:focus-visible, .act[aria-expanded="true"], tr:focus-within .act { opacity: 1; }
  .act:hover, .act[aria-expanded="true"] { background: rgba(20, 20, 19, .07); color: var(--ink); }

  tr.fresh td, tr.fresh th { animation: fresh 1.4s ease-out; }
  @keyframes fresh { 0%, 30% { background: #fdf0c8; } 100% { background: var(--rowbg, var(--bg)); } }

  /* empty state */
  .empty { position: sticky; left: 0; display: grid; justify-items: center; align-content: center; gap: 4px; width: min(100%, 100vw); min-height: calc(100% - 37px); padding: 40px 24px; text-align: center; }
  .empty svg { width: 32px; height: 32px; stroke-width: 1.25; color: var(--dim); margin-bottom: 12px; }
  .empty h2 { font-size: 16px; line-height: 24px; font-weight: 500; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .empty p { color: var(--soft); max-width: 360px; }
  .empty .ctl { margin-top: 16px; }

  /* footer */
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px 16px; height: 56px; padding: 0 var(--gut); border-top: 1px solid var(--line); background: var(--bg); }
  .fl { display: flex; align-items: center; gap: 12px; color: var(--soft); white-space: nowrap; }
  .sel-size { position: relative; display: inline-flex; align-items: center; }
  .sel-size select { appearance: none; -webkit-appearance: none; height: 30px; padding: 0 26px 0 10px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--bg); cursor: pointer; font-weight: 500; }
  .sel-size select:hover { border-color: #bcbbb3; background: var(--tint); }
  .sel-size svg { position: absolute; right: 8px; width: 12px; height: 12px; pointer-events: none; color: var(--soft); }
  .pages { display: flex; align-items: center; gap: 2px; }
  .pages button { min-width: 30px; height: 30px; padding: 0 6px; border-radius: 6px; display: grid; place-items: center; color: var(--soft); transition: background-color .12s, color .12s; }
  .pages button:hover:not(:disabled) { background: var(--tint); color: var(--ink); }
  .pages button:disabled { color: #c2c1ba; cursor: default; }
  .pages button[aria-current] { background: var(--ink); color: #fff; font-weight: 500; }
  .pages button[aria-current]:hover { background: var(--ink); color: #fff; }
  .pages .gap { min-width: 22px; text-align: center; color: var(--dim); }
  .pages .of { display: none; padding: 0 8px; color: var(--soft); white-space: nowrap; }

  /* bulk bar */
  .bulk { position: fixed; left: 50%; bottom: 6px; z-index: 20; display: flex; align-items: center; height: 44px; padding: 0 4px 0 14px; border-radius: 8px; background: var(--ink); color: #fff; box-shadow: 0 8px 20px -8px rgba(20, 20, 19, .4); transform: translate(-50%, 0); transition: transform .26s var(--ease), opacity .18s, visibility 0s; white-space: nowrap; }
  .bulk.off { transform: translate(-50%, calc(100% + 16px)); opacity: 0; visibility: hidden; transition: transform .2s ease-in, opacity .18s, visibility 0s .2s; }
  .bulk .cnt { font-weight: 500; }
  .bulk .all { margin-left: 10px; padding: 4px 2px; color: #cfcec7; text-decoration: underline; text-decoration-color: #6a6962; text-underline-offset: 3px; border-radius: 3px; }
  .bulk .all:hover { color: #fff; text-decoration-color: currentColor; }
  .bulk .sep { width: 1px; height: 20px; margin: 0 8px 0 12px; background: #3b3a36; }
  .bulk .b { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px; border-radius: 5px; color: #f2f1ec; transition: background-color .12s; }
  .bulk .b:hover, .bulk .b[aria-expanded="true"] { background: #2c2b28; }
  .bulk .b svg { color: #b7b6ae; }
  .bulk .del, .bulk .del svg { color: #ff9c82; }
  .bulk .del:hover { background: #3a211a; }
  .bulk .cl { width: 36px; padding: 0; justify-content: center; }
  .bulk :focus-visible, .toast :focus-visible { outline-color: #fff; }

  /* toast */
  .toast { position: fixed; left: 50%; bottom: 6px; z-index: 21; display: flex; align-items: center; gap: 12px; max-width: calc(100vw - 24px); min-height: 44px; padding: 0 14px; border-radius: 8px; background: var(--ink); color: #fff; box-shadow: 0 8px 20px -8px rgba(20, 20, 19, .4); overflow: hidden; transform: translate(-50%, 0); transition: transform .24s var(--ease), opacity .18s, bottom .24s var(--ease), visibility 0s; }
  .toast.off { transform: translate(-50%, 12px); opacity: 0; visibility: hidden; pointer-events: none; transition: transform .16s ease-in, opacity .16s, visibility 0s .16s; }
  body.bulk-on .toast { bottom: 58px; }
  .toast span { padding: 12px 0; overflow-wrap: anywhere; }
  .toast .undo { flex: none; height: 32px; margin-right: -6px; padding: 0 10px; border-radius: 5px; font-weight: 500; color: #ffb7a3; }
  .toast .undo:hover { background: #2c2b28; color: #fff; }
  .toast i { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: #ff9c82; transform-origin: left; }

  /* menus */
  .pop { position: fixed; z-index: 30; min-width: 200px; max-width: calc(100vw - 16px); max-height: min(420px, calc(100dvh - 16px)); overflow-y: auto; padding: 4px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--bg); box-shadow: 0 10px 24px -10px rgba(20, 20, 19, .24), 0 2px 4px -2px rgba(20, 20, 19, .08); opacity: 0; visibility: hidden; transform: translateY(-4px); transition: opacity .13s, transform .15s var(--ease), visibility 0s .13s; }
  .pop.up { transform: translateY(4px); }
  .pop.on { opacity: 1; visibility: visible; transform: none; transition: opacity .13s, transform .15s var(--ease), visibility 0s; }
  .pop .mi { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 32px; padding: 4px 8px; border-radius: 5px; text-align: left; white-space: nowrap; outline: 0; }
  .pop .mi:focus { background: var(--tint); }
  .pop .mi:focus-visible { box-shadow: inset 0 0 0 1.5px var(--ink); }
  .pop .mi svg { color: var(--soft); }
  .pop .mi:disabled { color: #a3a29a; cursor: default; background: none; }
  .pop .mi .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .pop .mi .c { color: var(--soft); padding-left: 12px; }
  .pop .mi.danger, .pop .mi.danger svg { color: #b52f10; }
  .pop .mi.danger:focus { background: var(--accent-tint); }
  .pop .mi .av { --av: 22px; font-size: 9px; }
  .pop .ghost { width: 22px; height: 22px; border-radius: 50%; border: 1px dashed var(--line-2); flex: none; }
  .pop .box { position: relative; flex: none; width: 16px; height: 16px; border: 1px solid #a9a8a0; border-radius: 4px; display: grid; place-items: center; transition: background-color .12s, border-color .12s; }
  .pop .box::before { content: ""; width: 9px; height: 5px; margin-top: -2px; border-left: 1.75px solid #fff; border-bottom: 1.75px solid #fff; transform: rotate(-45deg) scale(0); transition: transform .14s var(--ease); }
  .pop [aria-checked="true"] .box { background: var(--accent); border-color: var(--accent); }
  .pop [aria-checked="true"] .box::before { transform: rotate(-45deg) scale(1); }
  .pop .tick { width: 16px; height: 16px; color: var(--accent); stroke-width: 2; }
  .pop .ph { width: 16px; flex: none; }
  .pop hr { height: 1px; margin: 4px -4px; border: 0; background: var(--line); }
  .pop .lab { padding: 6px 8px 4px; color: var(--soft); font-size: 12px; }
  .pop .mdot { margin: 0; }

  /* below 1100px the pager needs the footer, so the bar floats just above it */
  @media (max-width: 1100px) {
    .bulk { bottom: 64px; }
    .bulk.off { transform: translate(-50%, 16px); }
    .toast { bottom: 64px; }
    body.bulk-on .toast { bottom: 116px; }
    body.bulk-on .scroll { padding-bottom: 60px; }
  }
  @media (max-width: 900px) {
    :root { --gut: 16px; --c0: 44px; }
  }
  @media (max-width: 640px) {
    :root { --c0: 40px; }
    .bulk { left: 8px; right: 8px; transform: none; justify-content: flex-start; }
    .bulk.off { transform: translateY(16px); }
    .bulk .cl { margin-left: auto; }
    .toast { left: 12px; right: 12px; transform: none; justify-content: space-between; }
    .toast.off { transform: translateY(12px); }
    .head { padding-top: 16px; padding-bottom: 12px; align-items: baseline; }
    h1 { font-size: 20px; line-height: 28px; }
    h1 .brand { display: none; }
    .search { flex: 1 1 100%; }
    .search kbd { display: none; }
    .search input { padding-right: 32px; font-size: 16px; }
    .grow { display: none; }
    .tools { gap: 6px; }
    .ctl { padding: 0 8px; }
    #cols span { display: none; }
    #exp { margin-left: auto; }
    .ca { position: static; width: 44px; }
    .scroll.sr-e .ca { box-shadow: none; }
    .fl .rng { min-width: 0; }
    .pages .num, .pages .gap { display: none; }
    .pages .of { display: block; }
    .bulk .b svg { display: none; }
    .bulk .cl svg { display: block; }
    .bulk .all { display: none; }
    .bulk .sep { margin: 0 4px 0 10px; }
    .bulk .b { padding: 0 8px; }
  }
  @media (hover: none) {
    .act { opacity: 1; }
    .pill svg { width: 12px; margin: 0 -4px 0 3px; opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="app" id="app" data-density="comfortable">
  <header class="head">
    <h1>
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="6"/><path class="arm" d="M8 11.5 18 8"/><path d="M8 18V7"/><circle cx="8" cy="11.5" r="1.75"/></svg>
      <span class="brand">Tollgate</span> <span>Customers</span>
    </h1>
    <p class="sum" id="sum"></p>
  </header>

  <div class="tools" role="toolbar" aria-label="Table controls">
    <div class="search">

(() => {
  const $ = (id) => document.getElementById(id);
  const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const money = (n) => "$" + n.toLocaleString("en-US");
  const icon = (d, cls = "") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
  const ICONS = {
    up: '<path d="M12 19V5M6.5 10.5 12 5l5.5 5.5"/>', down: '<path d="m6 9 6 6 6-6"/>', more: '<circle cx="5.5" cy="12" r=".75" fill="currentColor"/><circle cx="12" cy="12" r=".75" fill="currentColor"/><circle cx="18.5" cy="12" r=".75" fill="currentColor"/>',

  };

  /* name | domain | status | plan | list price | seats | owner | minutes since seen | country | joined | next invoice */

Ravi Patel|sabarmati.in|active|Starter|99|2|0|14900|India|Jul 2025|Nov 23
Ana Sousa|tagusmaps.pt|trial|Growth|610|6|1|16300|Portugal|Oct 2026|Nov 27

Mariam Touré|bamakosend.ml|active|Starter|79|1|3|18600|Mali|Mar 2025|Nov 19
Kai Nakamura|alohatide.us|churned|Starter|149|3|4|64800|United States|Dec 2023|Nov 30
Selin Aydın|ankaradesk.com.tr|active|Growth|1010|11|0|20100|Türkiye|May 2024|Nov 10
Diego Paredes|titicacatours.bo|due|Starter|129|2|1|22400|Bolivia|Aug 2024|Oct 27
Wanjiru Kamau|kilifischool.ke|active|Scale|2150|18|2|25900|Kenya|Jan 2023|Nov 22
Andrei Popescu|deltagrain.ro|active|Growth|1190|14|3|30200|Romania|Oct 2022|Nov 16`;

  const OWNERS = ["Ines Duarte", "Tunde Bakare", "Mina Sato", "Elias Berg", "Rania Aziz"];
  const STATUS = { active: "Active", trial: "Trialing", due: "Past due", paused: "Paused", churned: "Churned" };
  const ORDER = Object.keys(STATUS);
  const TONES = [["#ebe7dd", "#4e4834"], ["#e2ebe3", "#2f4e39"], ["#e3e8ef", "#2f4360"], ["#f0e4dc", "#6a3f27"], ["#ece4ea", "#553a50"], ["#e7e8d9", "#4a4d27"], ["#dfeae9", "#25504e"]];

  let DATA = RAW.split("\n").map((l, i) => {
    const [name, domain, status, plan, price, seats, owner, seen, country, joined, next] = l.split("|");
    return { id: "c" + i, name, email: name.split(/[\s-]/)[0].toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ı/g, "i") + "@" + domain, status, plan, price: +price, seats: +seats, owner: OWNERS[+owner], seen: +seen, country, joined, next };
  });

  const earns = (r) => r.status === "active" || r.status === "due";
  const mrrOf = (r) => (earns(r) ? r.price : 0);
  const billed = (r) => r.status !== "churned" && r.status !== "paused";
  const nextDays = (r) => { const [m, d] = r.next.split(" "); return ["Oct", "Nov", "Dec"].indexOf(m) * 31 + +d; };
  const JOINED = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const joinKey = (r) => { const [m, y] = r.joined.split(" "); return +y * 12 + JOINED.indexOf(m); };
  const ago = (m) => m < 3 ? "Just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} hr ago` : m < 2880 ? "Yesterday" : m < 43200 ? `${Math.round(m / 1440)} days ago` : m < 86400 ? "A month ago" : `${Math.round(m / 43200)} months ago`;

  const COLS = [
    { k: "status", label: "Status", w: 128, sort: (r) => ORDER.indexOf(r.status) },
    { k: "plan", label: "Plan", w: 104, sort: (r) => ["Starter", "Growth", "Scale", "Enterprise"].indexOf(r.plan) },
    { k: "mrr", label: "MRR", w: 92, num: true, first: "desc", sort: mrrOf },
    { k: "seats", label: "Seats", w: 80, num: true, first: "desc", sort: (r) => r.seats },
    { k: "owner", label: "Owner", w: 132, sort: (r) => r.owner || "￿" },
    { k: "next", label: "Next invoice", w: 112, sort: (r) => (billed(r) ? nextDays(r) : 1e6) },
    { k: "seen", label: "Last seen", w: 112, first: "desc", sort: (r) => -r.seen },
    { k: "country", label: "Country", w: 136, sort: (r) => r.country },
    { k: "joined", label: "Joined", w: 96, first: "desc", sort: joinKey },
  ];
  const HIDDEN_AT_START = ["country", "joined"];

  const S = {
    q: "", st: new Set(), sort: { k: "seen", dir: "desc" }, page: 1, size: 10, density: "comfortable",
    hide: new Set(HIDDEN_AT_START), sel: new Set(["c4", "c5", "c6"]), anchor: null,
  };

  const fold = (s) => [...s].map((c) => (c.normalize("NFD")[0] || c).toLowerCase()).join("");
  function hl(text) {
    const q = fold(S.q.trim());
    if (!q) return esc(text);
    const t = fold(text), at = t.indexOf(q);
    if (at < 0) return esc(text);
    const chars = [...text];
    return esc(chars.slice(0, at).join("")) + "<mark>" + esc(chars.slice(at, at + q.length).join("")) + "</mark>" + esc(chars.slice(at + q.length).join(""));
  }
  const initials = (n) => n.split(/[\s-]+/).filter(Boolean).slice(0, 2).map((w) => [...w][0]).join("").toUpperCase();
  const tone = (n) => { let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) >>> 0; return TONES[h % TONES.length]; };
  const av = (n) => { const [a, b] = tone(n); return `<span class="av" style="--a:${a};--b:${b}" aria-hidden="true">${esc(initials(n))}</span>`; };

  /* ---------- the view ---------- */
  function query() {
    const q = fold(S.q.trim());
    const searched = q ? DATA.filter((r) => [r.name, r.email, r.plan, r.owner || "", r.country].some((v) => fold(v).includes(q))) : DATA;
    const rows = S.st.size ? searched.filter((r) => S.st.has(r.status)) : searched;
    const col = COLS.find((c) => c.k === S.sort.k);
    const key = col ? col.sort : (r) => r.name;
    const sgn = S.sort.dir === "asc" ? 1 : -1;
    const sorted = [...rows].sort((a, b) => {
      const x = key(a), y = key(b);
      const d = typeof x === "number" ? x - y : String(x).localeCompare(String(y), "en");
      return d ? d * sgn : a.name.localeCompare(b.name, "en");
    });
    return { searched, rows: sorted };
  }
  const visCols = () => COLS.filter((c) => !S.hide.has(c.k));
  const pageCount = (n) => Math.max(1, Math.ceil(n / S.size));

  function cell(c, r) {
    switch (c.k) {
      case "status": return `<td><button class="pill" type="button" data-s="${r.status}" aria-haspopup="menu" aria-expanded="false" aria-label="Status: ${STATUS[r.status]}. Change status for ${esc(r.name)}"><i></i>${STATUS[r.status]}${icon(ICONS.down)}</button></td>`;
      case "plan": return `<td>${hl(r.plan)}</td>`;
      case "mrr": { const m = mrrOf(r); return `<td class="num${m ? "" : " zero"}">${money(m)}</td>`; }
      case "seats": return `<td class="num">${r.seats}</td>`;
      case "owner": return `<td>${r.owner ? `<span class="own" title="${esc(r.owner)}">${av(r.owner)}<span>${hl(r.owner.split(" ")[0])}</span></span>` : `<span class="own nil"><span class="ghost" aria-hidden="true"></span><span>Unassigned</span></span>`}</td>`;
      case "next": return billed(r) ? `<td>${r.next}</td>` : `<td class="zero"><span aria-hidden="true">&mdash;</span><span class="sr">None</span></td>`;
      case "seen": return `<td class="quiet"><time>${ago(r.seen)}</time></td>`;
      case "country": return `<td>${hl(r.country)}</td>`;
      case "joined": return `<td class="quiet">${r.joined}</td>`;
    }
  }
  const rowHTML = (r, cols) => `<tr data-id="${r.id}"${S.sel.has(r.id) ? ' class="sel"' : ""}>
    <td class="c0"><label class="ck"><input type="checkbox" class="rowck" aria-label="Select ${esc(r.name)}"${S.sel.has(r.id) ? " checked" : ""}></label></td>
    <th class="c1" scope="row"><div class="who">${av(r.name)}<div class="wt"><span class="nm">${hl(r.name)}</span><span class="em" title="${esc(r.email)}">${hl(r.email)}</span></div></div></th>
    ${cols.map((c) => cell(c, r)).join("")}
    <td class="ca"><button class="act" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Actions for ${esc(r.name)}">${icon(ICONS.more)}</button></td>
  </tr>`;

  function renderHead() {
    const cols = visCols();
    const narrow = innerWidth <= 640;
    const c0 = innerWidth <= 640 ? 40 : innerWidth <= 900 ? 44 : 52;
    const custMin = narrow ? 168 : 248;
    const ca = narrow ? 44 : 56;
    $("cg").innerHTML = `<col style="width:${c0}px"><col>` + cols.map((c) => `<col style="width:${c.w}px">`).join("") + `<col style="width:${ca}px">`;
    $("t").style.setProperty("--min", c0 + custMin + cols.reduce((n, c) => n + c.w, 0) + ca);
    $("hr").innerHTML = `<th class="c0" scope="col"><label class="ck"><input type="checkbox" id="all" aria-label="Select all on this page"></label></th>
      <th class="c1" scope="col" data-k="name" aria-sort="none"><button class="sh" type="button">Customer${icon(ICONS.up)}</button></th>
      ${cols.map((c) => `<th scope="col" data-k="${c.k}" class="${c.num ? "num" : ""}" aria-sort="none"><button class="sh" type="button">${c.label}${icon(ICONS.up)}</button></th>`).join("")}
      <th class="ca" scope="col"><span class="sr">Actions</span></th>`;
    paintSort();
  }
  function paintSort() {
    $("hr").querySelectorAll("th[data-k]").forEach((th) => th.setAttribute("aria-sort", th.dataset.k === S.sort.k ? (S.sort.dir === "asc" ? "ascending" : "descending") : "none"));
  }

  function snapshot() { const m = new Map(); $("tb").querySelectorAll("tr").forEach((r) => m.set(r.dataset.id, r.getBoundingClientRect().top)); return m; }
  function flip(prev) {
    if (calm() || !prev) return;
    $("tb").querySelectorAll("tr").forEach((r) => {
      const was = prev.get(r.dataset.id);
      if (was === undefined) { r.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 180, easing: "ease-out" }); return; }
      const dy = was - r.getBoundingClientRect().top;
      if (Math.abs(dy) > .5) r.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }], { duration: 240, easing: "cubic-bezier(.2,.8,.2,1)" });
    });
  }

  function render(prev, opts = {}) {
    const { rows, searched } = query();

  $("seg").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setDensity(b.dataset.d); });
  $("seg").addEventListener("keydown", (e) => {
    if (!["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.key)) return;
    e.preventDefault(); setDensity(S.density === "compact" ? "comfortable" : "compact", true);
  });

  let expT = 0;
  $("exp").addEventListener("click", async () => {
    const { rows } = query();
    await copyCSV(rows);
    const b = $("exp");
    b.classList.add("done");
    b.querySelector("path").setAttribute("d", "m5 12.5 4.5 4.5L19 7.5");
    $("expT").textContent = "Exported";
    toast(`customers.csv copied: ${plural(rows.length, "row")}`);
    clearTimeout(expT);
    expT = setTimeout(() => { b.classList.remove("done"); b.querySelector("path").setAttribute("d", "M12 4v11M7.5 10.5 12 15l4.5-4.5M5 20h14"); $("expT").textContent = "Export"; }, 1800);
  });

  /* pagination */
  $("pages").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b || b.disabled) return;
    const p = b.dataset.p;
    const total = pageCount(query().rows.length);
    const dest = p === "prev" ? Math.max(1, S.page - 1) : p === "next" ? Math.min(total, S.page + 1) : +p;
    if (dest === S.page) return;
    const dir = dest > S.page ? 1 : -1;
    S.page = dest; S.anchor = null;
    render();
    $("scroll").scrollTop = 0;
    if (!calm()) $("tb").animate([{ opacity: 0, transform: `translateX(${dir * 8}px)` }, { opacity: 1, transform: "none" }], { duration: 170, easing: "ease-out" });
    say(`Page ${dest} of ${total}`);
  });
  $("size").addEventListener("change", (e) => {
    const firstRow = (S.page - 1) * S.size;
    S.size = +e.target.value;
    S.page = Math.floor(firstRow / S.size) + 1;
    S.anchor = null;
    render();
    $("scroll").scrollTop = 0;
  });

  /* bulk bar */
  $("bClose").addEventListener("click", () => { S.sel.clear(); S.anchor = null; paintSel(); ($("all") && !$("all").disabled ? $("all") : $("q")).focus({ preventScroll: true }); say("Selection cleared"); });
  $("bAll").addEventListener("click", () => { const { rows } = query(); rows.forEach((r) => S.sel.add(r.id)); paintSel(); $("bAssign").focus({ preventScroll: true }); say(`All ${rows.length} selected`); });
  $("bAssign").addEventListener("click", (e) => toggleMenu(e.currentTarget, () => openMenu($("bAssign"), () => ownerItems(new Set(S.sel)), { label: "Assign selected customers" })));
  $("bExport").addEventListener("click", async () => { const rows = DATA.filter((r) => S.sel.has(r.id)); await copyCSV(rows); toast(`customers.csv copied: ${plural(rows.length, "row")}`); });
  $("bDelete").addEventListener("click", () => removeRows(new Set(S.sel)));

  addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !menu && S.sel.size && e.target !== $("q") && !$("toast").contains(e.target)) { S.sel.clear(); S.anchor = null; paintSel(); $("all")?.focus({ preventScroll: true }); }
  });

  renderHead();
  render();
})();
</script>
</body>
</html>
