<!doctype html>
<!-- Trip planner — Uiverse Originals. Free to use and adapt (MIT). One file, no dependencies.
     A phone itinerary for five days in a port city: swipe between days, drag stops to reorder and
     watch every time and walk recompute, open a stop for notes and bookings, pull the map up from
     peek to half to full with numbered pins, and add a stop from a quick search. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atlas Day — Valparaíso</title>
<style>
  :root {
    --paper: #f5f8f3; --surface: #ffffff; --ink: #0d2c35; --soft: #4b666d; --line: #dde6e2; --line-2: #c9d6d2;
    --sun: #ffc629; --sun-2: #f5b400; --sea: #0a6f7c; --aqua: #a4ecea; --coral: #c9391a; --coral-soft: #fdece6;
    --sans: "Avenir Next", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --ease: cubic-bezier(.2, .8, .2, 1);
    --sheet-h: 96px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--paper); color: var(--ink); font: 500 14px/1.4 var(--sans); font-variant-numeric: tabular-nums; overflow: hidden; -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }
  button { border: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; display: block; }
  :focus-visible { outline: 2px solid var(--sea); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  .phone { position: relative; height: 100%; max-width: 430px; margin: 0 auto; overflow: hidden; background: var(--paper); }
  @media (min-width: 431px) { .phone { box-shadow: 0 0 0 1px var(--line); } }

  /* status bar */
  .status { position: absolute; inset: 0 0 auto; height: 44px; z-index: 6; display: flex; align-items: center; justify-content: space-between; padding: 6px 24px 0; font-size: 15px; font-weight: 650; pointer-events: none; transition: background .18s ease-out; }
  .status.solid { background: var(--paper); }
  .status .sig { display: flex; align-items: center; gap: 6px; }
  .status svg { display: block; fill: currentColor; }

  /* the scrolling plan */
  .scroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scrollbar-width: none; padding-bottom: calc(var(--sheet-h) + 16px); }
  .scroll::-webkit-scrollbar { display: none; }

  /* hero */
  .hero { position: relative; height: 216px; background: var(--aqua); overflow: hidden; }
  .hero > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; will-change: transform; }
  .hero-copy { position: absolute; left: 20px; top: 50px; right: 72px; }
  .hero h1 { font-size: 34px; line-height: 38px; font-weight: 800; letter-spacing: -.02em; }
  .hero .dates { margin-top: 2px; font-size: 14px; font-weight: 600; }
  .crew { position: absolute; left: 20px; top: 112px; display: flex; align-items: center; }
  .crew span { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 11.5px; font-weight: 700; box-shadow: 0 0 0 2px var(--aqua); margin-inline-end: -6px; }
  .crew small { margin-inline-start: 14px; font-size: 13px; font-weight: 600; }
  .share { position: absolute; right: 16px; top: 50px; width: 40px; height: 40px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; transition: transform .15s var(--ease); }
  .share:active { transform: scale(.94); }
  .share svg { width: 20px; height: 20px; }

  /* day tabs */
  .tabs-wrap { position: sticky; top: 44px; z-index: 4; background: var(--paper); padding: 12px 16px 8px; }
  .tabs { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
  .tabs .ind { position: absolute; left: 3px; top: 3px; bottom: 3px; width: calc((100% - 6px) / 5); background: var(--ink); border-radius: 9px; transition: transform .28s var(--ease); }
  .tab { position: relative; height: 44px; border-radius: 9px; display: grid; align-content: center; justify-items: center; line-height: 1.2; transition: color .18s ease-out; color: var(--soft); }
  .tab b { font-size: 14px; font-weight: 700; color: var(--ink); transition: color .18s ease-out; }
  .tab small { font-size: 12px; font-weight: 500; }
  .tab.near { color: #d7e6e6; }
  .tab.near b { color: #fff; }

  /* days track */
  .viewport { overflow: hidden; touch-action: pan-y; }
  .track { display: flex; align-items: flex-start; transition: transform .28s var(--ease); }
  .track.drag { transition: none; user-select: none; -webkit-user-select: none; }
  .panel { flex: 0 0 100%; min-width: 0; height: 0; overflow: hidden; padding: 0 16px; }
  .panel.on, .track.moving .panel, .track.drag .panel { height: auto; overflow: visible; }
  .day-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 8px 0 8px; }
  .day-head h2 { font-size: 18px; line-height: 24px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .day-head span { font-size: 13px; color: var(--soft); white-space: nowrap; }

  /* timeline */
  .plan { list-style: none; position: relative; }
  .stop { position: relative; background: var(--paper); border-radius: 14px; }
  .stop.lifted { z-index: 3; background: var(--surface); box-shadow: 0 10px 24px -8px rgba(13, 44, 53, .28), 0 0 0 1px var(--line); }
  .stop.selected .dot { background: var(--sun); color: var(--ink); box-shadow: 0 0 0 2px var(--ink); }
  .row { display: flex; align-items: stretch; }
  .main { flex: 1; min-width: 0; display: grid; grid-template-columns: 44px 28px 1fr; column-gap: 8px; align-items: center; min-height: 60px; padding: 8px 0 8px 4px; text-align: left; border-radius: 12px; }
  .when { font-size: 14px; font-weight: 700; line-height: 18px; letter-spacing: -.01em; transition: color .3s ease-out; }
  .when.bump { color: var(--sea); }
  .dot { width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: var(--sun); font-size: 13px; font-weight: 700; display: grid; place-items: center; transition: background .18s ease-out, color .18s ease-out; }
  .txt { min-width: 0; padding-left: 4px; }
  .txt b { display: block; font-size: 16px; line-height: 21px; font-weight: 700; letter-spacing: -.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { display: flex; align-items: center; gap: 4px; font-size: 13px; line-height: 18px; color: var(--soft); white-space: nowrap; overflow: hidden; }
  .sub svg.i { width: 15px; height: 15px; stroke-width: 2; }
  .sub .tick { color: var(--sea); font-weight: 650; }
  .sub .late { color: var(--coral); font-weight: 650; }
  .grip { flex: none; width: 40px; display: grid; place-items: center; color: #6f8a90; cursor: grab; touch-action: none; border-radius: 10px; }
  .grip:hover { color: var(--ink); }
  .grip:active { cursor: grabbing; }
  .grip svg { width: 20px; height: 20px; fill: currentColor; display: block; }

  .leg { position: relative; display: flex; align-items: center; gap: 4px; height: 28px; margin-left: 4px; padding-left: 80px; font-size: 13px; color: var(--soft); white-space: nowrap; overflow: hidden; transition: opacity .15s ease-out; }
  .leg::before { content: ""; position: absolute; left: 65px; top: -2px; bottom: -2px; border-left: 2px dotted var(--line-2); }
  .leg.transit::before { border-left-style: solid; border-left-color: var(--sea); }
  .leg svg.i { width: 16px; height: 16px; color: var(--ink); }
  .leg em { font-style: normal; color: var(--sea); font-weight: 650; }
  .plan.sorting .leg { opacity: .4; }

  /* stop detail */
  .detail { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .24s var(--ease); }
  .stop.open .detail { grid-template-rows: 1fr; }
  .detail > div { overflow: hidden; min-height: 0; }
  .inner { margin: 0 8px 8px 84px; padding: 4px 0 8px; display: grid; gap: 12px; }
  .note { font-size: 14px; line-height: 20px; }
  .fact { display: flex; gap: 8px; font-size: 13px; line-height: 18px; color: var(--soft); }
  .fact svg.i { width: 18px; height: 18px; }
  .booking { display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 8px 8px 12px; background: var(--surface); }
  .booking small { display: block; font-size: 12px; color: var(--soft); line-height: 16px; }
  .booking code { font: 600 14px/20px var(--mono); }
  .ghost { min-height: 36px; padding: 0 12px; border-radius: 9px; font-size: 13px; font-weight: 650; border: 1px solid var(--line-2); background: var(--surface); display: inline-flex; align-items: center; gap: 4px; transition: background .15s ease-out; white-space: nowrap; }
  .ghost:hover { background: #eef3f0; }
  .ghost svg.i { width: 16px; height: 16px; stroke-width: 2; }
  .ghost.danger { color: var(--coral); }
  .stay { display: flex; align-items: center; justify-content: space-between; font-size: 14px; }
  .stepper { display: flex; align-items: center; gap: 4px; }
  .stepper button { width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--surface); display: grid; place-items: center; }
  .stepper button:disabled { opacity: .4; cursor: default; }
  .stepper svg.i { width: 16px; height: 16px; stroke-width: 2; }
  .stepper output { min-width: 64px; text-align: center; font-weight: 700; }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; }

  .add-row { width: 100%; display: grid; grid-template-columns: 44px 28px 1fr; column-gap: 8px; align-items: center; min-height: 52px; padding: 8px 0 8px 4px; text-align: left; font-weight: 700; color: var(--sea); font-size: 15px; border-radius: 12px; }
  .add-row i { grid-column: 2; width: 28px; height: 28px; border-radius: 50%; border: 2px dashed var(--line-2); display: grid; place-items: center; }
  .add-row i svg.i { width: 14px; height: 14px; stroke-width: 2.25; }
  .add-row span { padding-left: 4px; }
  .empty { padding: 16px 0 4px; }
  .empty p { font-size: 14px; color: var(--soft); margin-bottom: 4px; padding-left: 4px; }

  /* map sheet */
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; flex-direction: column; background: var(--surface); border-radius: 20px 20px 0 0; box-shadow: 0 -1px 0 var(--line), 0 -8px 24px -12px rgba(13, 44, 53, .22); transform: translateY(calc(var(--full) - var(--h))); height: var(--full); transition: transform .32s var(--ease); will-change: transform; }
  .sheet.drag { transition: none; }
  .sheet-head { flex: none; touch-action: none; padding: 0 16px 12px; cursor: grab; user-select: none; -webkit-user-select: none; }
  .sheet.drag .sheet-head { cursor: grabbing; }
  .handle { display: block; width: 100%; height: 24px; position: relative; border-radius: 8px; }
  .handle::after { content: ""; position: absolute; left: 50%; top: 8px; width: 40px; height: 4px; margin-left: -20px; border-radius: 2px; background: var(--line-2); transition: background .15s ease-out; }
  .handle:hover::after { background: #95aaa8; }
  .head-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
  .head-row b { display: block; font-size: 16px; line-height: 22px; font-weight: 700; }
  .head-row small { display: block; font-size: 13px; line-height: 18px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .head-row > div { min-width: 0; }
  .btn-add { flex: none; height: 44px; padding: 0 16px 0 12px; border-radius: 12px; background: var(--sun); font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; transition: background .15s ease-out, transform .15s var(--ease); }
  .btn-add:hover { background: var(--sun-2); }
  .btn-add:active { transform: scale(.97); }
  .btn-add svg.i { width: 20px; height: 20px; stroke-width: 2; }
  .map { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #8ddfe2; }
  .map > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .pin { cursor: pointer; outline: none; }
  .pin circle.b { fill: var(--ink); stroke: #fff; stroke-width: 2; }
  .pin text { fill: var(--sun); font: 700 13px var(--sans); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .pin.sel circle.b { fill: var(--sun); stroke: var(--ink); }
  .pin.sel text { fill: var(--ink); }
  .pin:focus-visible circle.b { stroke: var(--sun); stroke-width: 3; }
  .pin:focus-visible.sel circle.b { stroke: var(--sea); }
  .maplabel { font: 600 11px var(--sans); fill: #47636a; text-anchor: middle; letter-spacing: .01em; paint-order: stroke; stroke: rgba(255,255,255,.7); stroke-width: 2.5px; }
  .maplabel.sea { fill: #0a5763; stroke: none; font-style: italic; font-size: 12px; }
  .callout { position: absolute; left: 12px; right: 12px; top: 12px; background: var(--surface); border-radius: 12px; box-shadow: 0 0 0 1px var(--line), 0 6px 16px -8px rgba(13, 44, 53, .3); padding: 8px 8px 8px 12px; display: flex; align-items: center; gap: 8px; opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity .18s ease-out, transform .18s var(--ease); }
  .callout.on { opacity: 1; transform: none; pointer-events: auto; }
  .sheet[data-state="peek"]:not(.drag) .callout { visibility: hidden; }
  .callout .dot { flex: none; }
  .callout div { flex: 1; min-width: 0; }
  .callout b { display: block; font-size: 14px; line-height: 19px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .callout small { display: block; font-size: 12px; line-height: 16px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .legend { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 12px; background: var(--surface); border-radius: 8px; padding: 4px 8px; font-size: 12px; box-shadow: 0 0 0 1px var(--line); }
  .legend span { display: flex; align-items: center; gap: 4px; }
  .legend i { width: 18px; height: 0; border-top: 3px dotted var(--coral); }
  .legend i.t { border-top: 3px solid var(--sea); }

  /* add stop */
  .scrim { position: absolute; inset: 0; z-index: 7; background: rgba(13, 44, 53, .45); opacity: 0; pointer-events: none; transition: opacity .22s ease-out; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .finder { position: absolute; left: 0; right: 0; bottom: 0; height: min(84%, 700px); z-index: 8; background: var(--surface); border-radius: 20px 20px 0 0; display: flex; flex-direction: column; transform: translateY(102%); visibility: hidden; transition: transform .3s var(--ease), visibility 0s .3s; }
  .finder.on { transform: none; visibility: visible; transition: transform .3s var(--ease), visibility 0s; }
  .finder header { display: flex; align-items: center; justify-content: space-between; padding: 12px 8px 8px 16px; }
  .finder h3 { font-size: 18px; line-height: 24px; font-weight: 700; }
  .x { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; }
  .x:hover { background: #eef3f0; }
  .field { margin: 0 16px; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 12px; border: 1.5px solid var(--line-2); border-radius: 12px; background: var(--paper); }
  .field:focus-within { border-color: var(--ink); }
  .field svg.i { width: 20px; height: 20px; color: var(--soft); }
  .field input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 16px; }
  .field input::placeholder { color: #5d767c; }
  .clear { width: 28px; height: 28px; display: none; place-items: center; border-radius: 50%; color: var(--soft); }
  .clear.on { display: grid; }
  .clear svg.i { width: 16px; height: 16px; stroke-width: 2; }
  .filters { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; scrollbar-width: none; flex: none; }
  .filters::-webkit-scrollbar { display: none; }
  .filters button { flex: none; height: 36px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line-2); font-size: 14px; font-weight: 600; transition: background .15s ease-out, color .15s ease-out; }
  .filters button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .results { flex: 1; overflow-y: auto; list-style: none; padding: 0 16px 24px; overscroll-behavior: contain; }
  .results li + li { border-top: 1px solid var(--line); }
  .result { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 0; text-align: left; }
  .result > svg.i { color: var(--sea); }
  .result div { flex: 1; min-width: 0; }
  .result b { display: block; font-size: 15px; line-height: 20px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result small { display: block; font-size: 13px; line-height: 18px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result .plus { width: 36px; height: 36px; flex: none; border-radius: 10px; background: var(--sun); display: grid; place-items: center; color: var(--ink); transition: background .15s ease-out; }
  .result:hover .plus { background: var(--sun-2); }
  .result .plus svg.i { width: 18px; height: 18px; stroke-width: 2; }
  .none { padding: 24px 0 8px; }
  .none b { display: block; font-size: 15px; font-weight: 700; margin-bottom: 4px; overflow-wrap: anywhere; }
  .none p { color: var(--soft); margin-bottom: 12px; }
  .none .ghost { height: 44px; font-size: 14px; }

  /* toast */
  .toast { position: absolute; left: 16px; right: 16px; bottom: calc(var(--sheet-h) + 12px); z-index: 9; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; padding: 8px 8px 8px 16px; background: var(--ink); color: #fff; border-radius: 12px; font-size: 14px; opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .18s ease-out, transform .18s var(--ease), bottom .3s var(--ease); }
  .toast.on { opacity: 1; transform: none; pointer-events: auto; }
  .toast button { height: 32px; padding: 0 8px; color: var(--sun); font-weight: 700; border-radius: 8px; display: none; }
  .toast button.on { display: block; }
  .toast button:focus-visible { outline-color: var(--sun); }

  /* scene motion */
  .cab { animation: cab 14s ease-in-out infinite alternate; }
  @keyframes cab { from { transform: translate(0, 0); } to { transform: translate(44px, -56px); } }
  .ship { animation: ship 40s linear infinite alternate; }
  @keyframes ship { from { transform: translateX(0); } to { transform: translateX(34px); } }
  .cloud { animation: cloud 30s ease-in-out infinite alternate; }
  @keyframes cloud { from { transform: translateX(0); } to { transform: translateX(-24px); } }

  @media (max-width: 370px) {
    .hero h1 { font-size: 32px; }
    .txt b { font-size: 15px; }
    .inner { margin-left: 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>

    drag.raf = requestAnimationFrame(dragLoop);
  }
  document.addEventListener('pointermove', function (e) { if (drag && e.pointerId === drag.id) { drag.y = e.clientY; if (Math.abs(drag.y - drag.y0) > 4) drag.travel = true; } });
  function endDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    cancelAnimationFrame(drag.raf);
    var el = drag.el, moved = drag.moved, off = new DOMMatrix(getComputedStyle(el).transform).m42;
    el.classList.remove('lifted');
    el.parentNode.classList.remove('sorting');
    if (!reduced.matches && off) {
      el.style.transition = 'transform .2s cubic-bezier(.2,.8,.2,1)'; el.style.transform = '';
      setTimeout(function () { el.style.transition = ''; }, 220);
    } else el.style.transform = '';
    var d = days[active], s = d.stops.find(function (x) { return x.id === el.dataset.id; });
    drag = null;
    renderDay(active, { quiet: true });
    moveCam(true);
    if (moved) announceMove(s);
  }
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);
  function announceMove(s) {
    var d = days[active], sc = schedule(d), i = d.stops.indexOf(s);
    $('live').textContent = s.name + ' is now stop ' + (i + 1) + ' of ' + d.stops.length + ', at ' + hhmm(sc.rows[i].start) + '. Day ends ' + hhmm(sc.end) + '.';
  }
  $('track').addEventListener('keydown', function (e) {
    var g = e.target.closest('.grip'); if (!g || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
    e.preventDefault();
    var d = days[active], li = g.closest('.stop'), idx = d.stops.findIndex(function (s) { return s.id === li.dataset.id; }), to = idx + (e.key === 'ArrowUp' ? -1 : 1);
    if (to < 0 || to >= d.stops.length) return;
    setOpen(null, true);
    flipOthers(function () { moveItem(idx, to); renderDay(active); }, null);
    moveCam(true);
    g.focus({ preventScroll: true });
    scrollToStop(li.dataset.id);
    announceMove(d.stops[to]);
  });

  /* ---------- the map sheet ---------- */
  var sheet = $('sheet'), sheetState = 'peek', sheetH = 96, PEEK = 96;
  function snaps() { var H = $('phone').clientHeight; return { peek: PEEK, half: Math.round(H * .54), full: H - 44 }; }
  function setSheetPx(h) { sheetH = h; sheet.style.setProperty('--h', h + 'px'); }
  function layoutSheet() { var H = $('phone').clientHeight; sheet.style.setProperty('--full', (H - 44) + 'px'); }
  function setSheet(state) {
    sheetState = state;
    sheet.dataset.state = state;
    var h = snaps()[state];
    setSheetPx(h);
    $('phone').style.setProperty('--sheet-h', h + 'px');
    $('map').inert = state === 'peek';
    $('grip').setAttribute('aria-label', 'Map sheet, ' + ({ peek: 'peeking', half: 'half open', full: 'fully open' })[state] + '. Press to ' + (state === 'full' ? 'close' : 'open further') + ', or use the arrow keys.');
    $('grip').setAttribute('aria-expanded', state === 'peek' ? 'false' : 'true');
    if (state === 'peek') select(null, true);
    moveCam(true);
  }
  var sd = null, swallowGrip = false;
  $('sheetHead').addEventListener('pointerdown', function (e) {
    if (e.button || e.target.closest('.btn-add')) return;
    sd = { id: e.pointerId, y0: e.clientY, h0: sheetH, lastY: e.clientY, lastT: e.timeStamp, v: 0, on: false };
  });
  document.addEventListener('pointermove', function (e) {
    if (!sd || e.pointerId !== sd.id) return;
    var dy = e.clientY - sd.y0;
    if (!sd.on) {
      if (Math.abs(dy) < 4) return;
      sd.on = true; sheet.classList.add('drag');
      try { $('sheetHead').setPointerCapture(e.pointerId); } catch (_) {}
    }
    var s = snaps(), h = sd.h0 - dy;
    if (h < s.peek) h = s.peek - (s.peek - h) * .2;
    if (h > s.full) h = s.full + (h - s.full) * .2;
    setSheetPx(h);
    var dt = e.timeStamp - sd.lastT;
    if (dt > 0) { sd.v = (e.clientY - sd.lastY) / dt; sd.lastY = e.clientY; sd.lastT = e.timeStamp; }
    cancelAnimationFrame(camAnim); cam = targetCam(); applyCam();
  });
  function endSheet(e) {
    if (!sd || e.pointerId !== sd.id) return;
    var was = sd; sd = null;
    if (!was.on) return;
    sheet.classList.remove('drag');
    swallowGrip = true; setTimeout(function () { swallowGrip = false; }, 60);
    var s = snaps(), order = ['peek', 'half', 'full'], here = sheetH, best = 'peek', bd = 1e9;
    order.forEach(function (k) { var d = Math.abs(s[k] - here); if (d < bd) { bd = d; best = k; } });
    if (Math.abs(was.v) > .5) {
      var up = was.v < 0, list = order.filter(function (k) { return up ? s[k] > here : s[k] < here; });
      if (list.length) best = up ? list[0] : list[list.length - 1];
    }
    setSheet(best);
  }
  document.addEventListener('pointerup', endSheet);
  document.addEventListener('pointercancel', endSheet);
  $('grip').addEventListener('click', function () {
    if (swallowGrip) return;
    setSheet({ peek: 'half', half: 'full', full: 'peek' }[sheetState]);
  });
  $('grip').addEventListener('keydown', function (e) {
    var order = ['peek', 'half', 'full'], i = order.indexOf(sheetState);
    if (e.key === 'ArrowUp' && i < 2) { e.preventDefault(); setSheet(order[i + 1]); }
    else if (e.key === 'ArrowDown' && i > 0) { e.preventDefault(); setSheet(order[i - 1]); }
    else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') e.preventDefault();
  });

  /* ---------- add a stop ---------- */
  var filter = 'all', finderFrom = null;
  function allUsed() { var u = {}; days.forEach(function (d) { d.stops.forEach(function (s) { u[s.id] = true; }); }); return u; }
  function bestFit(place) {
    var st = days[active].stops, best = { i: st.length, cost: Infinity };
    if (!st.length) return { i: 0, cost: 0 };
    for (var i = 0; i <= st.length; i++) {
      var a = st[i - 1], b = st[i], c = 0;
      if (a) c += leg(a, place).min;
      if (b) c += leg(place, b).min;
      if (a && b) c -= leg(a, b).min;
      /* a dinner or a bus closes the day, so prefer slots before a booked last stop */
      if (!b && a && a.fixed != null) c += 20;
      if (c < best.cost) best = { i: i, cost: c };
    }
    return best;
  }
  function renderResults() {
    var q = $('q').value.trim().toLowerCase(), used = allUsed();
    $('clear').classList.toggle('on', !!$('q').value);
    var list = catalog.filter(function (p) {
      return !used[p.id] && (filter === 'all' || p.type === filter) && (!q || (p.name + ' ' + p.area + ' ' + T[p.type].label).toLowerCase().indexOf(q) >= 0);
    }).map(function (p) { return { p: p, fit: bestFit(p) }; }).sort(function (a, b) { return a.fit.cost - b.fit.cost; });
    var box = $('results');
    if (!list.length) {
      var raw = $('q').value.trim();
      box.innerHTML = '<li class="none"><b>' + (raw ? 'Nothing nearby called “' + esc(raw) + '”' : 'Nothing left in this list') + '</b><p>' + (raw ? 'Keep it as your own stop, and place it on the map later.' : 'Everything of this type is already on your trip.') + '</p>' +
        (raw ? '<button class="ghost" id="custom">' + ic('plus') + 'Add “' + esc(raw.length > 26 ? raw.slice(0, 26) + '…' : raw) + '”</button>' : '') + '</li>';
      return;
    }
    box.innerHTML = list.map(function (r) {
      var off = r.fit.cost, label = days[active].stops.length ? (off <= 3 ? 'On your route' : off + ' min off route') : 'First stop of the day';
      return '<li><button class="result" data-id="' + r.p.id + '">' + ic(T[r.p.type].icon) + '<div><b>' + esc(r.p.name) + '</b><small>' + esc(r.p.area) + ' · ' + label + '</small></div><span class="plus" aria-hidden="true">' + ic('plus') + '</span></button></li>';
    }).join('');
  }
  function openFinder(from) {
    finderFrom = from || $('addBtn');
    filter = 'all'; $('q').value = '';
    $('filters').innerHTML = filters.map(function (f) { return '<button data-f="' + f[0] + '" aria-pressed="' + (f[0] === 'all') + '">' + f[1] + '</button>'; }).join('');
    renderResults();
    $('results').scrollTop = 0;
    $('finder').inert = false;
    $('finder').classList.add('on'); $('scrim').classList.add('on');
    $('sheet').inert = true; $('scroll').inert = true;
    setTimeout(function () { $('q').focus({ preventScroll: true }); }, reduced.matches ? 0 : 60);
  }
  function closeFinder(refocus) {
    $('finder').classList.remove('on'); $('scrim').classList.remove('on');
    $('finder').inert = true; $('sheet').inert = false; $('scroll').inert = false;
    if (refocus !== false && finderFrom && finderFrom.isConnected) finderFrom.focus({ preventScroll: true });
    else if (refocus !== false) $('addBtn').focus({ preventScroll: true });
  }
  function addPlace(place) {
    var d = days[active], fit = bestFit(place), s = {};
    for (var k in place) s[k] = place[k];
    if (s.custom) s.id = 'u' + Date.now();
    d.stops.splice(fit.i, 0, s);
    buildStop(s);
    closeFinder(false);
    renderDay(active);
    moveCam(true);
    if (sheetState === 'full') setSheet('half');
    s.el.querySelector('.main').focus({ preventScroll: true });
    setTimeout(function () { scrollToStop(s.id); }, 40);
    var dayIndex = active;
    toast(s.name.length > 22 ? 'Added to Day ' + (active + 1) : s.name + ' added', function () {
      var at = d.stops.indexOf(s); if (at >= 0) d.stops.splice(at, 1);
      setOpen(null, true);
      renderDay(dayIndex); moveCam(true);
      $('addBtn').focus({ preventScroll: true });
    });
    select(s.id, true);
  }
  $('addBtn').addEventListener('click', function () { openFinder($('addBtn')); });
  $('scrim').addEventListener('click', function () { closeFinder(); });
  $('finderClose').addEventListener('click', function () { closeFinder(); });
  $('q').addEventListener('input', renderResults);
  $('q').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); var first = $('results').querySelector('.result, #custom'); if (first) first.click(); }
  });
  $('clear').addEventListener('click', function (e) { e.preventDefault(); $('q').value = ''; renderResults(); $('q').focus(); });
  $('filters').addEventListener('click', function (e) {
    var b = e.target.closest('[data-f]'); if (!b) return;
    filter = b.dataset.f;
    [].forEach.call($('filters').children, function (c) { c.setAttribute('aria-pressed', c === b ? 'true' : 'false'); });
    renderResults();
  });
  $('results').addEventListener('click', function (e) {
    var r = e.target.closest('.result');
    if (r) { addPlace(catalog.find(function (p) { return p.id === r.dataset.id; })); return; }
    if (e.target.closest('#custom')) {
      var raw = $('q').value.trim().slice(0, 48), st = days[active].stops, last = st[st.length - 2] || st[0] || { x: 420, y: 470 };
      addPlace({ id: 'custom', custom: true, name: raw, type: 'view', x: last.x + 26, y: last.y + 26, stay: 45, area: 'Your own stop', note: 'Added by you. Open it to set how long you want here.' });
    }
  });
  $('finder').addEventListener('keydown', function (e) {
    if (e.key !== 'Tab') return;
    var f = [].filter.call($('finder').querySelectorAll('button,input'), function (el) { return el.offsetParent !== null && !el.disabled; });
    if (!f.length) return;
    var a = f[0], z = f[f.length - 1];
    if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); }
    else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
  });

  /* ---------- share, toast, Esc, scroll ---------- */
  $('share').addEventListener('click', function () {
    var done = function () { toast('Trip link copied'); };
    try { navigator.clipboard.writeText('https://atlasday.example/t/valparaiso-9-jan').then(done, done); } catch (_) { done(); }
  });
  function toast(msg, undo) {
    clearTimeout(toastTimer);
    $('toastMsg').textContent = msg;
    undoFn = undo || null;
    $('toastUndo').classList.toggle('on', !!undo);
    $('toast').classList.add('on');
    toastTimer = setTimeout(hideToast, undo ? 5000 : 2200);
  }
  function hideToast() { $('toast').classList.remove('on'); undoFn = null; }
  $('toastUndo').addEventListener('click', function () { var f = undoFn; hideToast(); if (f) f(); });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if ($('finder').classList.contains('on')) { closeFinder(); return; }
    if (drag) return;
    if (sheetState !== 'peek') { setSheet('peek'); $('grip').focus({ preventScroll: true }); return; }
    if (openId) { var id = openId; setOpen(null); select(null, true); var s = days[active].stops.find(function (x) { return x.id === id; }); if (s) s.el.querySelector('.main').focus({ preventScroll: true }); }
  });
  var ticking = false;
  $('scroll').addEventListener('scroll', function () {
    if (ticking) return; ticking = true;
    requestAnimationFrame(function () {
      ticking = false;
      var y = $('scroll').scrollTop, lim = $('hero').offsetHeight - 44;
      $('status').classList.toggle('solid', y >= lim - 1);
      if (!reduced.matches) $('scene').style.transform = 'translateY(' + Math.min(y, lim) * .22 + 'px)';
    });
  }, { passive: true });

  var live = document.createElement('div'); live.id = 'live'; live.className = 'sr'; live.setAttribute('aria-live', 'polite'); $('phone').appendChild(live);

  /* ---------- go ---------- */
  layoutSheet();
  days.forEach(function (d, i) { if (i !== active) renderDay(i, { quiet: true }); });
  go(0);
  setSheet('peek');
  cam = targetCam(); applyCam();
  addEventListener('resize', function () { layoutSheet(); setSheet(sheetState); });
})();
</script>
</body>
</html>
