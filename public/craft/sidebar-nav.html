<!doctype html>
<!-- Sidebar navigation — Uiverse Originals. Free to use and adapt (MIT). One file, no dependencies.
     A dark app sidebar with a workspace switcher, a sliding active marker, counts and folding sections.
     Collapse it to a 64px icon rail with tooltips and flyouts; under 760px it becomes a drawer. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Helm — Sidebar</title>
<style>
:root {
  --side: #141413; --side2: #1d1c1a; --side3: #262522; --sline: rgba(255, 255, 255, .07); --stext: #ebe8e2; --ssoft: #b0aca3; --sdim: #8e8a81;
  --paper: #f6f5f1; --card: #fffefc; --cline: #e4e1d9; --cink: #1b1a17; --csoft: #67645c; --sk: #e9e6df; --sk2: #dfdbd2;
  --accent: #f0b44c; --green: #4fb286; --away: #e0a23a; --dnd: #e5534b;
  --sans: "Helvetica Neue", Arial, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --out: cubic-bezier(.2, .8, .2, 1);
  --w: 252px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { display: flex; background: var(--paper); color: var(--cink); font: 13.5px/1.4 var(--sans); font-variant-numeric: tabular-nums; overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { border: 0; background: none; cursor: pointer; text-align: left; }
ul { list-style: none; }
svg { display: block; }
.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---------- the sidebar ---------- */
.side { position: relative; z-index: 20; display: flex; flex-direction: column; width: var(--w); height: 100%; flex: none; background: var(--side); color: var(--stext); transition: width .24s var(--out); overflow: hidden; }
.side.rail { --w: 64px; }
.lbl { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; transition: opacity .16s; }
.rail .lbl, .rail .cnt, .rail .chev, .rail .kbd, .rail .sstat { opacity: 0; pointer-events: none; }

.head { display: flex; align-items: center; gap: 4px; padding: 12px 8px 8px; }
.ws { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; height: 40px; padding: 0 8px 0 8px; border-radius: 8px; transition: background .15s; }
.ws:hover, .ws[aria-expanded="true"] { background: var(--side2); }
.tile { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 7px; color: #1a1712; font-size: 11px; font-weight: 700; letter-spacing: .02em; flex: none; }
.ws .lbl { flex: 1; font-weight: 650; font-size: 14px; }
.ws .chev { color: var(--sdim); }
.ib { position: relative; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 7px; color: var(--ssoft); flex: none; transition: background .15s, color .15s; }
.ib:hover { background: var(--side2); color: var(--stext); }
.rail .head { flex-direction: column; gap: 6px; padding: 12px 8px 4px; }
.rail .ws { flex: none; width: 48px; padding: 0 10px; }
.rail .ws .chev, .rail .ws .lbl { display: none; }
.rail #collapse .i { transform: scaleX(-1); }

.search { display: flex; align-items: center; gap: 10px; height: 34px; margin: 4px 8px 8px; padding: 0 8px 0 15px; border: 1px solid var(--sline); border-radius: 8px; color: var(--sdim); background: rgba(255, 255, 255, .02); transition: background .15s, border-color .15s, color .15s; flex: none; }
.search:hover { background: var(--side2); color: var(--ssoft); border-color: rgba(255, 255, 255, .1); }
.search .i { width: 16px; height: 16px; }
.search .lbl { flex: 1; }
.kbd { display: inline-flex; gap: 2px; transition: opacity .16s; }
.kbd span { display: grid; place-items: center; min-width: 18px; height: 18px; padding: 0 4px; border: 1px solid rgba(255, 255, 255, .12); border-radius: 4px; font-size: 11px; color: var(--ssoft); }
.rail .search { padding-left: 15px; }

.scroll { position: relative; flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 4px 8px 12px; scrollbar-width: none; }
.mark { position: absolute; left: 8px; right: 8px; top: 0; height: 34px; border-radius: 8px; background: var(--side3); pointer-events: none; transition: transform .26s var(--out), height .26s var(--out), opacity .16s; }
.mark::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 2px; border-radius: 0 2px 2px 0; background: var(--accent); }
.mark.off { opacity: 0; }
.it { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; height: 34px; padding: 0 10px 0 15px; border-radius: 8px; color: var(--ssoft); transition: color .15s, background .15s; }
.it:hover { color: var(--stext); background: rgba(255, 255, 255, .035); }
.it[aria-current="page"] { color: var(--stext); background: none; }
.it .lbl { flex: 1; }
.cnt { min-width: 20px; padding: 0 6px; border-radius: 10px; font-size: 11.5px; line-height: 18px; text-align: center; color: var(--ssoft); background: rgba(255, 255, 255, .06); transition: opacity .16s; }
.it[aria-current="page"] .cnt { color: #1a1712; background: var(--accent); font-weight: 650; }
.it .pip { position: absolute; left: 31px; top: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--side); opacity: 0; transition: opacity .16s; }
.rail .it .pip { opacity: 1; }
.pd { width: 18px; display: grid; place-items: center; flex: none; }
.pd i { width: 8px; height: 8px; border-radius: 3px; }

.sec { margin-top: 16px; }
.sec-h { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; height: 30px; padding: 0 10px 0 15px; border-radius: 7px; color: var(--sdim); font-size: 12px; font-weight: 600; letter-spacing: .02em; transition: color .15s, background .15s; }
.sec-h:hover { color: var(--stext); background: rgba(255, 255, 255, .035); }
.sec-h .si { opacity: 0; width: 0; margin-right: -12px; transition: opacity .16s; }
.sec-h .lbl { flex: 1; }
.sec-h .chev { width: 14px; height: 14px; transition: transform .2s var(--out), opacity .16s; }
.sec-h[aria-expanded="false"] .chev { transform: rotate(-90deg); }
.rail .sec { margin-top: 4px; }
.rail .sec-h { height: 34px; color: var(--ssoft); }
.rail .sec-h .si { opacity: 1; width: 18px; margin-right: 0; }
.rail .sec-h .lbl { font-size: 0; }
.fold { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .24s var(--out); }
.fold.shut { grid-template-rows: 0fr; }
.fold > ul { min-height: 0; overflow: hidden; transition: opacity .2s, visibility .24s; }
.fold.shut > ul { opacity: 0; visibility: hidden; }
.rail .fold { grid-template-rows: 0fr; }
.rail .fold > ul { opacity: 0; visibility: hidden; }
.sec.has-cur .sec-h { color: var(--stext); }

.foot { padding: 8px; border-top: 1px solid var(--sline); }
.user { display: flex; align-items: center; gap: 10px; width: 100%; height: 44px; padding: 0 8px 0 10px; border-radius: 8px; transition: background .15s; }
.user:hover, .user[aria-expanded="true"] { background: var(--side2); }
.av { position: relative; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: #3a3631; color: #efe7da; font-size: 11px; font-weight: 700; flex: none; }
.st { position: absolute; right: -2px; bottom: -2px; width: 11px; height: 11px; border-radius: 50%; border: 2.5px solid var(--side); background: var(--green); transition: background .2s, box-shadow .2s; }
.st.away { background: var(--side); box-shadow: inset 0 0 0 2px var(--away); }
.st.dnd { background: var(--dnd); }
.st.dnd::after { content: ""; position: absolute; left: 1px; right: 1px; top: 2px; height: 2px; border-radius: 1px; background: var(--side); }
.user .who { flex: 1; min-width: 0; line-height: 1.25; }
.user b { display: block; font-weight: 600; font-size: 13px; }
.sstat { display: block; color: var(--sdim); font-size: 12px; transition: opacity .16s; }

/* ---------- popovers, tooltips ---------- */
.pop { position: fixed; z-index: 50; min-width: 220px; padding: 4px; border: 1px solid rgba(255, 255, 255, .1); border-radius: 10px; background: #1f1e1b; color: var(--stext); box-shadow: 0 16px 32px -14px rgba(0, 0, 0, .65); animation: pop .15s var(--out); }
.pop[hidden] { display: none; }
@keyframes pop { from { opacity: 0; transform: translateY(-4px); } }
.pop h3 { padding: 6px 8px 4px; color: var(--sdim); font-size: 11.5px; font-weight: 600; letter-spacing: .02em; }
.opt { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 36px; padding: 4px 8px; border-radius: 7px; color: var(--stext); }
.opt:hover, .opt:focus { background: var(--side3); outline: 0; }
.opt:focus-visible { box-shadow: inset 0 0 0 1.5px var(--accent); }
.opt .lbl { flex: 1; }
.opt small { color: var(--sdim); font-size: 12px; }
.opt .tick { width: 16px; height: 16px; color: var(--accent); }
.pop hr { height: 1px; margin: 4px; border: 0; background: rgba(255, 255, 255, .08); }
.opt .plus { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 7px; border: 1px dashed rgba(255, 255, 255, .22); color: var(--ssoft); }
.opt .plus .i { width: 14px; height: 14px; }
.newws { display: flex; gap: 6px; padding: 4px; }
.newws input { flex: 1; min-width: 0; height: 32px; padding: 0 10px; border: 1px solid rgba(255, 255, 255, .14); border-radius: 7px; background: var(--side); outline: 0; }
.newws input:focus { border-color: var(--accent); }
.newws button { height: 32px; padding: 0 12px; border-radius: 7px; background: var(--accent); color: #1a1712; font-weight: 650; }
.newws button:disabled { opacity: .45; cursor: default; }
.err { padding: 2px 8px 6px; color: #f19a90; font-size: 12px; }
.pop .sdot { position: relative; right: auto; bottom: auto; width: 12px; height: 12px; margin: 0 3px; border: 0; flex: none; }
.pop .sdot.away { box-shadow: inset 0 0 0 2.5px var(--away); background: none; }
.pop .sdot.dnd::after { left: 2.5px; right: 2.5px; top: 5px; height: 2px; background: #1f1e1b; }
.tip { position: fixed; z-index: 60; padding: 5px 9px; border-radius: 6px; background: #f3f0ea; color: #1a1712; font-size: 12px; font-weight: 600; white-space: nowrap; pointer-events: none; opacity: 0; transform: translateX(-4px); transition: opacity .12s, transform .12s; }
.tip.on { opacity: 1; transform: none; }
.tip span { color: #77736a; font-weight: 500; margin-left: 6px; }

.find { position: fixed; inset: 0; z-index: 70; display: grid; align-items: start; justify-items: center; padding: 12vh 16px 16px; background: rgba(20, 20, 19, .32); animation: fade .15s; }
.find[hidden] { display: none; }
@keyframes fade { from { opacity: 0; } }
.find-c { width: min(520px, 100%); border-radius: 12px; background: var(--card); color: var(--cink); box-shadow: 0 24px 48px -20px rgba(20, 20, 19, .5), 0 0 0 1px rgba(20, 20, 19, .08); overflow: hidden; animation: pop .18s var(--out); }
.find-f { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; border-bottom: 1px solid var(--cline); color: var(--csoft); }
.find-f input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 15px; color: var(--cink); }
.find-f input::placeholder { color: #8a867d; }
.find ul { max-height: 320px; overflow-y: auto; padding: 6px; }
.find li button { display: flex; align-items: center; gap: 10px; width: 100%; height: 38px; padding: 0 10px; border-radius: 7px; color: var(--cink); }
.find li button[aria-selected="true"] { background: #f0ede6; }
.find li small { margin-left: auto; color: var(--csoft); font-size: 12px; }
.find .none { padding: 20px 12px; color: var(--csoft); text-align: center; }
.find mark { background: none; color: inherit; font-weight: 700; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }

/* ---------- the page beside it ---------- */
.main { flex: 1; min-width: 0; height: 100%; overflow-y: auto; }
.mtop { display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 28px; border-bottom: 1px solid var(--cline); color: var(--csoft); font-size: 12.5px; white-space: nowrap; }
.mtop .menu { display: none; color: var(--cink); }
.mtop .menu:hover { background: #ebe8e1; color: var(--cink); }
.crumbs { display: flex; gap: 6px; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.crumbs b { color: var(--cink); font-weight: 600; }
.view { padding: 28px 28px 40px; max-width: 980px; }
.view.swap { animation: swap .24s var(--out); }
@keyframes swap { from { opacity: 0; transform: translateY(6px); } }
.view h1 { display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 650; letter-spacing: -.01em; }
.view h1 .pd i { width: 12px; height: 12px; border-radius: 4px; }
.view .sub { margin-top: 4px; color: var(--csoft); }
.sk { display: block; height: 8px; border-radius: 4px; background: var(--sk); }
.sk.d { background: var(--sk2); }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 24px; }
.box { padding: 16px; border: 1px solid var(--cline); border-radius: 10px; background: var(--card); }
.box h2 { font-size: 12px; font-weight: 600; color: var(--csoft); margin-bottom: 14px; }
.box .sk + .sk { margin-top: 10px; }
.sect { margin-top: 28px; }
.sect > h2 { font-size: 13px; font-weight: 650; margin-bottom: 10px; }
.rows { border: 1px solid var(--cline); border-radius: 10px; background: var(--card); }
.row { display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 16px; }
.row + .row { border-top: 1px solid var(--cline); }
.row .c { width: 26px; height: 26px; border-radius: 50%; background: var(--sk); flex: none; }
.row .grow { flex: 1; min-width: 0; display: grid; gap: 7px; }
.row .u { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
.row .ph { width: 7px; flex: none; }
.row code { font: 12px var(--mono); color: var(--csoft); width: 64px; flex: none; }
.row .stt { display: flex; align-items: center; gap: 6px; width: 110px; flex: none; }
.row .stt i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid currentColor; }
.thead { height: 36px; color: var(--csoft); font-size: 12px; font-weight: 600; }
.cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 24px; }
.col h2 { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--csoft); margin-bottom: 10px; }
.cardk { padding: 14px; margin-bottom: 10px; border: 1px solid var(--cline); border-radius: 9px; background: var(--card); display: grid; gap: 9px; }
.cardk .tag { width: 44px; height: 6px; border-radius: 3px; }
.tl { margin-top: 24px; border: 1px solid var(--cline); border-radius: 10px; background: var(--card); overflow: hidden; }
.tl-h, .tl-r { display: grid; grid-template-columns: 150px repeat(4, minmax(0, 1fr)); align-items: center; }
.tl-h { height: 36px; border-bottom: 1px solid var(--cline); color: var(--csoft); font-size: 12px; font-weight: 600; }
.tl-h span, .tl-r > span { padding-left: 16px; }
.tl-h span + span { border-left: 1px solid var(--cline); height: 100%; display: flex; align-items: center; }
.tl-r { position: relative; height: 48px; }
.tl-r + .tl-r { border-top: 1px solid var(--cline); }
.tl-r > span { font-weight: 550; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tl-r .bar { position: absolute; top: 15px; height: 18px; border-radius: 5px; }
.doc { max-width: 640px; margin-top: 24px; display: grid; gap: 12px; }
.doc .sk { height: 9px; }
.doc .gap { height: 12px; }
.doc .chk { display: flex; align-items: center; gap: 12px; }
.doc .chk i { width: 16px; height: 16px; border: 1.5px solid #c9c4b9; border-radius: 4px; flex: none; }
.doc .chk i.on { background: var(--cink); border-color: var(--cink); }
.doc blockquote { padding: 14px 16px; border-radius: 8px; background: #efece5; display: grid; gap: 9px; }
.prev { height: 96px; border-radius: 6px; background: repeating-linear-gradient(135deg, var(--sk) 0 8px, #f1eee8 8px 16px); }

.scrim { position: fixed; inset: 0; z-index: 15; background: rgba(20, 20, 19, .45); opacity: 0; pointer-events: none; transition: opacity .22s; }

@media (max-width: 1000px) {
  .grid3 { grid-template-columns: 1fr 1fr; }
  .grid3 .box:nth-child(3) { display: none; }
  .tl-h, .tl-r { grid-template-columns: 120px repeat(4, minmax(0, 1fr)); }
}
/* under 760px the sidebar is a drawer */
@media (max-width: 759px) {
  .side { position: fixed; inset: 0 auto 0 0; width: min(288px, 86vw); transform: translateX(-100%); visibility: hidden; transition: transform .26s var(--out), visibility .26s; box-shadow: 0 0 40px -10px rgba(0, 0, 0, .5); }
  body.drawer .side { transform: none; visibility: visible; }
  body.drawer .scrim { opacity: 1; pointer-events: auto; }
  #collapse .i { transform: none !important; }
  .mtop { padding: 0 12px; }
  .mtop .menu { display: grid; }
  .view { padding: 20px 16px 32px; }
  .grid3, .cols { grid-template-columns: 1fr; }
  .grid3 .box:nth-child(n+2), .cols .col:nth-child(n+2) { display: none; }
  .row code { display: none; }
  .row .stt { width: 84px; }
  .tl-h, .tl-r { grid-template-columns: 96px repeat(4, minmax(0, 1fr)); }
  .tl-h span:nth-child(n+4) { display: none; }
  .tl-h { grid-template-columns: 96px repeat(2, minmax(0, 1fr)); }
  .tl-r > span { font-size: 12.5px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<aside class="side" id="side" aria-label="Sidebar">
  <div class="head">
    <button class="ws" id="ws" aria-haspopup="menu" aria-expanded="false" aria-controls="wsMenu" data-tipname="Switch workspace"><span class="tile" id="wsTile"></span><span class="lbl" id="wsName"></span><svg class="i chev" viewBox="0 0 24 24" aria-hidden="true"><use href="#updown"/></svg></button>
    <button class="ib" id="collapse" aria-label="Collapse sidebar" data-tipname="Expand sidebar" data-key="["><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><use href="#panel"/></svg></button>
  </div>
  <button class="search" id="searchBtn" data-tipname="Search" data-key="⌘K" aria-label="Search pages" aria-keyshortcuts="Meta+K Control+K"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><use href="#search"/></svg><span class="lbl">Search</span><span class="kbd" aria-hidden="true"><span>⌘</span><span>K</span></span></button>
  <nav class="scroll" id="scroll" aria-label="Main">
    <span class="mark" id="mark" aria-hidden="true"></span>
    <ul id="primary"></ul>
    <div class="sec" id="sec-projects"></div>
    <div class="sec" id="sec-favorites"></div>
  </nav>
  <div class="foot">
    <button class="user" id="user" aria-haspopup="menu" aria-expanded="false" aria-controls="stMenu" data-tipname="Ilse Varga"><span class="av">IV<i class="st" id="stDot"></i></span><span class="who lbl"><b>Ilse Varga</b><span class="sstat" id="stText">Active</span></span></button>
  </div>
</aside>
<div class="scrim" id="scrim"></div>

<main class="main" id="main">
  <div class="mtop"><button class="ib menu" id="menuBtn" aria-label="Open sidebar" aria-expanded="false" aria-controls="side"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><use href="#menu"/></svg></button><div class="crumbs" id="crumbs"></div></div>
  <div class="view" id="view" aria-live="polite"></div>
</main>

<div class="pop" id="wsMenu" role="menu" aria-label="Workspaces" hidden></div>
<div class="pop" id="stMenu" role="menu" aria-label="Set your status" hidden></div>
<div class="pop" id="fly" role="menu" hidden></div>
<div class="tip" id="tip" aria-hidden="true"></div>
<div class="find" id="find" hidden>
  <div class="find-c" role="dialog" aria-modal="true" aria-label="Search pages">
    <div class="find-f"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><use href="#search"/></svg><input id="findQ" placeholder="Jump to a page or project" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="findList" aria-autocomplete="list"></div>
    <ul id="findList" role="listbox" aria-label="Pages"></ul>
  </div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="home" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20h-5v-6h-6v6H4z"/></symbol>
  <symbol id="inbox" viewBox="0 0 24 24"><path d="M3.5 13h5l1.5 2.5h4l1.5-2.5h5"/><path d="M6 5h12l2.5 8v6h-17v-6z"/></symbol>
  <symbol id="target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/></symbol>
  <symbol id="review" viewBox="0 0 24 24"><circle cx="6.5" cy="6" r="2.5"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="18" r="2.5"/><path d="M6.5 8.5v7M17.5 15.5V10a3 3 0 0 0-3-3H11"/><path d="m13 5-2 2 2 2"/></symbol>
  <symbol id="map" viewBox="0 0 24 24"><path d="M4 6h9M4 12h14M4 18h7"/><path d="M15 4v4M20 10v4M13 16v4"/></symbol>
  <symbol id="folder" viewBox="0 0 24 24"><path d="M3.5 6.5h6l2 2h9v10h-17z"/></symbol>
  <symbol id="star" viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9L3.5 9.7l5.9-.8z"/></symbol>
  <symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
  <symbol id="updown" viewBox="0 0 24 24"><path d="m8 9 4-4 4 4M8 15l4 4 4-4"/></symbol>
  <symbol id="down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="panel" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M9.5 4.5v15M15.5 10l-2 2 2 2"/></symbol>

  <symbol id="check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>

  <symbol id="board" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M9.5 4.5v15M15 4.5v15"/></symbol>
</defs></svg>

<script>
const reduce = matchMedia("(prefers-reduced-motion: reduce)");
const $ = (id) => document.getElementById(id);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ic = (n, c = "i") => `<svg class="${c}" viewBox="0 0 24 24" aria-hidden="true"><use href="#${n}"/></svg>`;

/* ---------- workspaces and what is in them ---------- */
const WS = [
  { name: "Helm Labs", tile: "#f0b44c", counts: [4, 12, 3],
    projects: [["Atlas onboarding", "#4fb286"], ["Billing v2", "#f0b44c"], ["Mobile 3.0", "#6ea8fe"], ["Search relevance", "#e8828f"]],
    favorites: [["Q3 planning", "doc"], ["Design review board", "board"], ["Launch checklist", "check"]] },
  { name: "Tidewater Studio", tile: "#7cc4a4", counts: [1, 5, 0],
    projects: [["Harbour site refresh", "#7cc4a4"], ["Booking flow", "#e8828f"], ["Brand guidelines", "#c7a5f0"]],
    favorites: [["Client feedback log", "doc"], ["Sprint board", "board"]] },
  { name: "Orchard Mobile", tile: "#e98c6f", counts: [9, 21, 6],
    projects: [["Checkout rewrite", "#e98c6f"], ["Android widgets", "#4fb286"], ["Offline sync", "#6ea8fe"]],
    favorites: [["Release train", "check"], ["Crash triage", "board"]] },
  { name: "Fieldnote Research", tile: "#a9bdf2", counts: [0, 3, 1],
    projects: [["Interview synthesis", "#a9bdf2"], ["Diary study", "#f0b44c"]],
    favorites: [["Research plan", "doc"]] },
];
const PRIMARY = [["home", "Home", "home"], ["inbox", "Inbox", "inbox", 0], ["issues", "My issues", "target", 1], ["reviews", "Reviews", "review", 2], ["roadmap", "Roadmap", "map"]];
const STATUS = [["active", "Active", "var(--green)", ""], ["away", "Away", "var(--away)", "Shown after 10 minutes idle"], ["dnd", "Do not disturb", "var(--dnd)", "Mutes notifications until 18:00"]];
const S = { ws: 0, page: "issues", rail: false, open: { projects: true, favorites: true }, status: "active" };
const W = () => WS[S.ws];
const isPhone = () => innerWidth < 760;
const initials = (n) => n.split(/\s+/).filter(Boolean).map((w) => w[0]).slice(0, 2).join("").toUpperCase();

/* ---------- seeded widths for the placeholder layouts ---------- */
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const hash = (s) => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);

/* ---------- sidebar ---------- */
function itemHTML(id, label, icon, count) {
  return `<li><button class="it" data-page="${id}" data-tipname="${esc(label)}"${S.page === id ? ' aria-current="page"' : ""}>${icon}<span class="lbl">${esc(label)}</span>${count ? `<span class="cnt" aria-label="${count} new">${count}</span><span class="pip" aria-hidden="true"></span>` : ""}</button></li>`;
}
function sectionHTML(key, title, icon, rows) {
  const open = S.open[key];
  return `<button class="sec-h" id="h-${key}" data-sec="${key}" data-tipname="${title}" aria-expanded="${S.rail ? "false" : open}" aria-controls="f-${key}"${S.rail ? ' aria-haspopup="menu"' : ""}>${ic(icon, "i si")}<span class="lbl">${title}</span>${ic("down", "i chev")}</button>
    <div class="fold${open ? "" : " shut"}" id="f-${key}"><ul>${rows.join("")}</ul></div>`;
}
const projIcon = (c) => `<span class="pd" aria-hidden="true"><i style="background:${c}"></i></span>`;
const favIcon = (k) => ic(k === "check" ? "check" : k);
function renderSide() {
  const w = W();
  $("wsTile").textContent = initials(w.name); $("wsTile").style.background = w.tile;
  $("wsName").textContent = w.name;
  $("ws").setAttribute("aria-label", `Workspace: ${w.name}. Switch workspace`);
  $("primary").innerHTML = PRIMARY.map(([id, l, icn, ci]) => itemHTML(id, l, ic(icn), ci !== undefined ? w.counts[ci] : 0)).join("");
  $("sec-projects").innerHTML = sectionHTML("projects", "Projects", "folder", w.projects.map(([n, c], i) => itemHTML("p" + i, n, projIcon(c))));
  $("sec-favorites").innerHTML = sectionHTML("favorites", "Favorites", "star", w.favorites.map(([n, k], i) => itemHTML("f" + i, n, favIcon(k))));
  const inSec = S.page[0] === "p" ? "projects" : S.page[0] === "f" ? "favorites" : null;
  $$(".sec").forEach((s) => s.classList.toggle("has-cur", s.id === "sec-" + inSec));
  $$(".scroll .it, .sec-h").forEach((b) => (b.tabIndex = S.rail && b.closest(".fold") ? -1 : 0));
  placeMark(false);
}
function placeMark(animate = true) {
  const mark = $("mark"), cur = document.querySelector(`.scroll .it[aria-current="page"]`);
  let target = cur;
  const fold = cur?.closest(".fold");
  if (fold && (S.rail || fold.classList.contains("shut"))) target = fold.previousElementSibling;
  if (!target) return mark.classList.add("off");
  if (!animate || reduce.matches) mark.style.transition = "none";
  mark.classList.remove("off");
  const sc = $("scroll"), y = target.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop;
  mark.style.transform = `translateY(${Math.round(y)}px)`;
  mark.style.height = target.offsetHeight + "px";
  if (!animate) { mark.offsetHeight; mark.style.transition = ""; }
}
/* the marker follows a folding section while it moves */
function trackMark(ms = 280) {
  if (reduce.matches) return placeMark(false);
  const end = performance.now() + ms;
  const step = () => { placeMark(false); if (performance.now() < end) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

/* ---------- the page ---------- */
function pageInfo(id) {
  const w = W();
  if (id[0] === "p") { const [n, c] = w.projects[+id.slice(1)]; return { title: n, kind: "board", color: c, crumb: "Projects" }; }
  if (id[0] === "f") { const [n, k] = w.favorites[+id.slice(1)]; return { title: n, kind: k === "board" ? "board" : "doc", check: k === "check", crumb: "Favorites" }; }
  const p = PRIMARY.find((x) => x[0] === id);
  return { title: p[1], kind: id, crumb: null };
}
function sk(r, min, max, cls = "") { return `<i class="sk ${cls}" style="width:${Math.round(min + r() * (max - min))}%"></i>`; }
function viewHTML(id) {
  const info = pageInfo(id), w = W(), r = rng(hash(w.name + id));
  const hello = { home: `Tuesday 3 November · ${w.name}`, inbox: `${w.counts[0] || "No"} unread · newest first`, issues: `${w.counts[1]} open · assigned to you`, reviews: `${w.counts[2] || "Nothing"} waiting on you`, roadmap: "This quarter and next" }[id];
  let h = `<h1>${info.color ? `<span class="pd" aria-hidden="true"><i style="background:${info.color}"></i></span>` : ""}${esc(info.title)}</h1><p class="sub">${esc(hello || (info.kind === "board" ? `${w.name} · board` : `${w.name} · document`))}</p>`;
  if (id === "home") {
    h += `<div class="grid3">${["Due this week", "In review", "Recently viewed"].map((t) => `<div class="box"><h2>${t}</h2>${sk(r, 60, 90, "d")}${sk(r, 40, 80)}${sk(r, 50, 85)}</div>`).join("")}</div>`;
    h += `<div class="sect"><h2>Activity</h2><div class="rows">${Array.from({ length: 5 }, () => `<div class="row"><span class="c"></span><span class="grow">${sk(r, 30, 70, "d")}${sk(r, 20, 45)}</span>${sk(r, 6, 10)}</div>`).join("")}</div></div>`;
  } else if (id === "inbox") {
    h += `<div class="sect"><div class="rows">${Array.from({ length: 7 }, (_, i) => `<div class="row">${i < w.counts[0] ? `<span class="u"></span>` : `<span class="ph"></span>`}<span class="c"></span><span class="grow">${sk(r, 25, 45, i < w.counts[0] ? "d" : "")}${sk(r, 45, 85)}</span><span style="width:40px">${sk(r, 60, 100)}</span></div>`).join("")}</div></div>`;
  } else if (id === "issues") {
    const ST = [["In progress", "#c58a1a"], ["Todo", "#8a867d"], ["In review", "#3f8f6b"], ["Todo", "#8a867d"], ["Blocked", "#c4473e"]];
    const pre = initials(w.name).slice(0, 1) + "LM".slice(0, 2);
    h += `<div class="sect"><div class="rows"><div class="row thead"><code>ID</code><span class="grow">Title</span><span class="stt">Status</span><span style="width:56px">Due</span></div>${Array.from({ length: 7 }, (_, i) => { const s = ST[i % 5]; return `<div class="row"><code>${pre}-${412 - i * 7}</code><span class="grow">${sk(r, 35, 80, "d")}</span><span class="stt" style="color:${s[1]}"><i></i><span style="color:var(--csoft);font-size:12.5px">${s[0]}</span></span><span style="width:56px">${sk(r, 50, 90)}</span></div>`; }).join("")}</div></div>`;
  } else if (id === "reviews") {
    h += `<div class="grid3">${Array.from({ length: 3 }, () => `<div class="box"><div class="prev"></div><div style="display:grid;gap:9px;margin-top:14px">${sk(r, 50, 85, "d")}${sk(r, 30, 60)}</div></div>`).join("")}</div>`;
  } else if (id === "roadmap") {
    h += `<div class="tl"><div class="tl-h"><span>Project</span><span>Nov</span><span>Dec</span><span>Jan</span><span>Feb</span></div>${w.projects.map(([n, c]) => { const s = 150 + r() * 260, len = 120 + r() * 220; return `<div class="tl-r"><span>${esc(n)}</span><i class="bar" style="left:calc(${(s / 800) * 100}% + 60px);width:${(len / 800) * 100}%;background:${c}"></i></div>`; }).join("")}</div>`;
  } else if (info.kind === "board") {
    const n = [3 + Math.floor(r() * 6), 1 + Math.floor(r() * 4), 6 + Math.floor(r() * 12)];
    h += `<div class="cols">${["Backlog", "In progress", "Done"].map((t, k) => `<div class="col"><h2><span>${t}</span><span>${n[k]}</span></h2>${Array.from({ length: Math.min(n[k], 3) }, () => `<div class="cardk"><i class="tag" style="background:${info.color || "var(--sk2)"};opacity:${k === 2 ? 0.45 : 1}"></i>${sk(r, 55, 95, "d")}${sk(r, 30, 60)}</div>`).join("")}</div>`).join("")}</div>`;
  } else {
    h += `<div class="doc">${sk(r, 85, 100, "d")}${sk(r, 70, 95)}${sk(r, 40, 70)}<span class="gap"></span>`;
    h += info.check ? Array.from({ length: 6 }, (_, i) => `<span class="chk"><i class="${i < 3 ? "on" : ""}"></i>${sk(r, 30, 70, i < 3 ? "" : "d")}</span>`).join("") : `<blockquote>${sk(r, 75, 95, "d")}${sk(r, 40, 65)}</blockquote>${sk(r, 80, 100)}${sk(r, 60, 90)}${sk(r, 75, 100)}${sk(r, 35, 55)}`;
    h += `</div>`;
  }
  return h;
}
function renderView(animate) {
  const info = pageInfo(S.page), v = $("view");
  $("crumbs").innerHTML = `<span>${esc(W().name)}</span><span aria-hidden="true">/</span>${info.crumb ? `<span>${info.crumb}</span><span aria-hidden="true">/</span>` : ""}<b>${esc(info.title)}</b>`;
  v.innerHTML = viewHTML(S.page);
  document.title = `${info.title} — Helm`;
  if (animate && !reduce.matches) { v.classList.remove("swap"); v.offsetWidth; v.classList.add("swap"); }
}
function go(id, focusAfter) {
  if (!id) return;
  S.page = id;
  $$(".scroll .it").forEach((b) => b.toggleAttribute("aria-current", b.dataset.page === id) || b.removeAttribute("aria-current"));
  $$(".scroll .it").forEach((b) => { if (b.dataset.page === id) b.setAttribute("aria-current", "page"); });
  const sec = id[0] === "p" ? "projects" : id[0] === "f" ? "favorites" : null;
  $$(".sec").forEach((s) => s.classList.toggle("has-cur", s.id === "sec-" + sec));
  placeMark(true);
  renderView(true);
  $("main").scrollTop = 0;
  if (isPhone()) closeDrawer(false);
  if (focusAfter) focusAfter.focus();
}

/* ---------- sections ---------- */
function toggleSection(key) {
  S.open[key] = !S.open[key];
  const h = $("h-" + key), f = $("f-" + key);
  h.setAttribute("aria-expanded", S.open[key]);
  f.classList.toggle("shut", !S.open[key]);
  trackMark();
}

/* ---------- popovers ---------- */
let popOpen = null, popBack = null, popSide = "down";
function placePop(pop, anchor, side) {
  const r = anchor.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  let x, y;
  if (side === "right") { x = Math.max(r.right, $("side").getBoundingClientRect().right) + 8; y = r.top - 4; }
  else if (side === "up") { x = r.left; y = r.top - h - 6; }
  else { x = r.left; y = r.bottom + 6; }
  pop.style.left = Math.max(8, Math.min(innerWidth - w - 8, x)) + "px";
  pop.style.top = Math.max(8, Math.min(innerHeight - h - 8, y)) + "px";
}
function openPop(pop, anchor, side, focusIdx = 0) {
  closePop(false);
  popOpen = pop; popBack = anchor; popSide = side;
  pop.hidden = false;
  anchor.setAttribute("aria-expanded", "true");
  placePop(pop, anchor, side);
  hideTip();
  const items = $$(".opt", pop);
  (items[focusIdx] || items[0])?.focus();
}
function closePop(back = true) {
  if (!popOpen) return;
  popOpen.hidden = true;
  popBack?.setAttribute("aria-expanded", "false");
  const b = popBack;
  popOpen = null; popBack = null;
  if (back && b?.isConnected) b.focus();
}
function menuKeys(e) {
  if (!popOpen) return;
  const items = $$(".opt", popOpen), i = items.indexOf(document.activeElement);
  const to = (k) => { e.preventDefault(); items[(k + items.length) % items.length].focus(); };
  if (e.key === "ArrowDown") to(i + 1);
  else if (e.key === "ArrowUp") to(i < 0 ? items.length - 1 : i - 1);
  else if (e.key === "Home") to(0);
  else if (e.key === "End") to(items.length - 1);
  else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closePop(); }
  else if (e.key === "Tab") closePop(false);
}

/* workspace switcher */
function wsMenuHTML() {
  return `<h3>Workspaces</h3>${WS.map((w, i) => `<button class="opt" role="menuitemradio" aria-checked="${i === S.ws}" tabindex="-1" data-ws="${i}"><span class="tile" style="background:${w.tile}">${initials(w.name)}</span><span class="lbl">${esc(w.name)}</span>${i < 9 ? `<small>⌘${i + 1}</small>` : ""}${i === S.ws ? ic("check", "i tick") : ""}</button>`).join("")}<hr><button class="opt" role="menuitem" tabindex="-1" data-newws="1"><span class="plus">${ic("plus")}</span><span class="lbl">Create workspace</span></button>`;
}
function openWs() { $("wsMenu").innerHTML = wsMenuHTML(); openPop($("wsMenu"), $("ws"), S.rail && !isPhone() ? "right" : "down", S.ws + 0); }
function switchWs(i) {
  if (i === S.ws) return closePop();
  S.ws = i;
  const w = W();
  if (S.page[0] === "p" && +S.page.slice(1) >= w.projects.length) S.page = "p0";
  if (S.page[0] === "f" && +S.page.slice(1) >= w.favorites.length) S.page = "f0";
  closePop();
  renderSide(); renderView(true);
  say(`Switched to ${w.name}`);
}
function newWsForm() {
  const m = $("wsMenu");
  m.innerHTML = `<h3>New workspace</h3><div class="newws"><input id="wsIn" aria-label="Workspace name" placeholder="Name, e.g. Quarry Design" maxlength="32" autocomplete="off"><button id="wsGo" disabled>Create</button></div><p class="err" id="wsErr" role="alert" hidden></p>`;
  $("wsIn").focus();
  $("wsIn").addEventListener("input", () => { $("wsGo").disabled = !$("wsIn").value.trim(); $("wsErr").hidden = true; });
  const create = () => {
    const name = $("wsIn").value.trim().replace(/\s+/g, " ");
    if (!name) return;
    if (WS.some((w) => w.name.toLowerCase() === name.toLowerCase())) { $("wsErr").textContent = `${name} already exists.`; $("wsErr").hidden = false; return; }
    const tones = ["#d9c27a", "#9fd0c9", "#e7a9b5", "#b9c98e"];
    WS.push({ name, tile: tones[WS.length % 4], counts: [0, 0, 0], projects: [["Getting started", tones[WS.length % 4]]], favorites: [["Welcome", "doc"]] });
    S.page = "home";
    switchWs(WS.length - 1);
  };
  $("wsGo").addEventListener("click", create);
  $("wsIn").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); create(); }
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); $("wsMenu").innerHTML = wsMenuHTML(); $$(".opt", $("wsMenu")).at(-1).focus(); }
  });
}
$("ws").addEventListener("click", () => (popOpen === $("wsMenu") ? closePop() : openWs()));
$("wsMenu").addEventListener("click", (e) => {
  const b = e.target.closest(".opt"); if (!b) return;
  if (b.dataset.newws) return newWsForm();
  switchWs(+b.dataset.ws);
});
$("wsMenu").addEventListener("keydown", (e) => { if (e.target.id !== "wsIn") menuKeys(e); });

/* status */
function stMenuHTML() {
  return `<h3>Status</h3>${STATUS.map(([k, l, c, note]) => `<button class="opt" role="menuitemradio" aria-checked="${S.status === k}" tabindex="-1" data-st="${k}"><span class="sdot st ${k}" aria-hidden="true"></span><span class="lbl">${l}${note ? `<br><small>${note}</small>` : ""}</span>${S.status === k ? ic("check", "i tick") : ""}</button>`).join("")}`;
}
$("user").addEventListener("click", () => { if (popOpen === $("stMenu")) return closePop(); $("stMenu").innerHTML = stMenuHTML(); openPop($("stMenu"), $("user"), S.rail && !isPhone() ? "right" : "up", STATUS.findIndex((s) => s[0] === S.status)); });
$("stMenu").addEventListener("click", (e) => {
  const b = e.target.closest("[data-st]"); if (!b) return;
  S.status = b.dataset.st;
  const s = STATUS.find((x) => x[0] === S.status);
  $("stDot").className = "st " + (S.status === "active" ? "" : S.status);
  $("stText").textContent = s[1];
  $("user").dataset.tipname = `Ilse Varga · ${s[1]}`;
  $("user").setAttribute("aria-label", `Ilse Varga, ${s[1]}. Change status`);
  closePop();
  say(`Status set to ${s[1]}`);
});
$("stMenu").addEventListener("keydown", menuKeys);

/* flyouts for sections in the rail */
function openFly(key, anchor) {
  const w = W(), rows = key === "projects" ? w.projects.map(([n, c], i) => ["p" + i, n, projIcon(c)]) : w.favorites.map(([n, k], i) => ["f" + i, n, favIcon(k)]);
  $("fly").setAttribute("aria-label", key === "projects" ? "Projects" : "Favorites");
  $("fly").innerHTML = `<h3>${key === "projects" ? "Projects" : "Favorites"}</h3>${rows.map(([id, n, icn]) => `<button class="opt" role="menuitem" tabindex="-1" data-go="${id}"${S.page === id ? ' aria-current="page"' : ""}>${icn}<span class="lbl">${esc(n)}</span>${S.page === id ? ic("check", "i tick") : ""}</button>`).join("")}`;
  openPop($("fly"), anchor, "right", Math.max(0, rows.findIndex((r) => r[0] === S.page)));
}
$("fly").addEventListener("click", (e) => { const b = e.target.closest("[data-go]"); if (!b) return; const back = popBack; closePop(false); go(b.dataset.go); back?.focus(); });
$("fly").addEventListener("keydown", menuKeys);

/* ---------- tooltips in the rail ---------- */
let tipFor = null;
function showTip(el) {
  if (!S.rail || isPhone() || popOpen) return;
  const t = $("tip"), r = el.getBoundingClientRect();
  tipFor = el;
  t.innerHTML = esc(el.dataset.tipname) + (el.dataset.key ? `<span>${esc(el.dataset.key)}</span>` : "");
  t.style.left = r.right + 10 + "px";
  t.style.top = r.top + r.height / 2 - 13 + "px";
  t.classList.add("on");
}
function hideTip() { $("tip").classList.remove("on"); tipFor = null; }
$("side").addEventListener("pointerover", (e) => { const el = e.target.closest("[data-tipname]"); if (el && el !== tipFor) showTip(el); });
$("side").addEventListener("pointerleave", hideTip);
$("side").addEventListener("focusin", (e) => { const el = e.target.closest("[data-tipname]"); if (el && el.matches(":focus-visible")) showTip(el); });
$("side").addEventListener("focusout", hideTip);
$("scroll").addEventListener("scroll", hideTip);

/* ---------- collapse, drawer ---------- */
function setRail(on) {
  S.rail = on;
  $("side").classList.toggle("rail", on);
  $("collapse").setAttribute("aria-label", on ? "Expand sidebar" : "Collapse sidebar");
  $("collapse").dataset.tipname = on ? "Expand sidebar" : "Collapse sidebar";
  closePop(false); hideTip();
  renderSide();
  trackMark(300);
  say(on ? "Sidebar collapsed to icons" : "Sidebar expanded");
}
/* a popover opened while the rail is still moving settles against its final edge */
$("side").addEventListener("transitionend", (e) => { if (e.target === $("side") && e.propertyName === "width" && popOpen && popBack?.isConnected) placePop(popOpen, popBack, popSide); });
$("collapse").addEventListener("click", () => { if (isPhone()) return closeDrawer(true); setRail(!S.rail); $("collapse").focus(); });
function openDrawer() {
  document.body.classList.add("drawer");
  $("menuBtn").setAttribute("aria-expanded", "true");
  $("main").inert = true;
  setTimeout(() => (document.querySelector('.scroll .it[aria-current="page"]') || $("ws")).focus(), 40);
}
function closeDrawer(back) {
  if (!document.body.classList.contains("drawer")) return;
  document.body.classList.remove("drawer");
  $("menuBtn").setAttribute("aria-expanded", "false");
  $("main").inert = false;
  closePop(false);
  if (back) $("menuBtn").focus();
}
$("menuBtn").addEventListener("click", openDrawer);
$("scrim").addEventListener("click", () => closeDrawer(true));
let wasPhone = isPhone();
function syncMode() {
  const p = isPhone();
  if (p !== wasPhone) {
    wasPhone = p;
    if (p && S.rail) { S.rail = false; $("side").classList.remove("rail"); renderSide(); }
    if (!p) closeDrawer(false);
  }
  $("collapse").setAttribute("aria-label", p ? "Close sidebar" : S.rail ? "Expand sidebar" : "Collapse sidebar");
  placeMark(false);
}
addEventListener("resize", () => { syncMode(); if (popOpen) closePop(false); hideTip(); });

/* ---------- search ---------- */
let found = [], fi = 0;
function allPages() {
  const w = W();
  return [...PRIMARY.map(([id, l]) => [id, l, "Page"]), ...w.projects.map(([n], i) => ["p" + i, n, "Project"]), ...w.favorites.map(([n], i) => ["f" + i, n, "Favorite"]), ...WS.map((x, i) => ["ws" + i, `Switch to ${x.name}`, "Workspace"]).filter((x) => x[0] !== "ws" + S.ws)];
}
function renderFind() {
  const q = $("findQ").value.trim().toLowerCase();
  found = allPages().filter(([, l]) => !q || l.toLowerCase().includes(q));
  fi = Math.min(fi, Math.max(0, found.length - 1));
  const mark = (l) => { if (!q) return esc(l); const i = l.toLowerCase().indexOf(q); return esc(l.slice(0, i)) + "<mark>" + esc(l.slice(i, i + q.length)) + "</mark>" + esc(l.slice(i + q.length)); };
  $("findList").innerHTML = found.length ? found.map(([id, l, k], i) => `<li role="presentation"><button role="option" id="fo${i}" tabindex="-1" data-find="${id}" aria-selected="${i === fi}">${mark(l)}<small>${k}</small></button></li>`).join("") : `<li class="none">Nothing called “${esc($("findQ").value.trim())}”. Try a project name.</li>`;
  $("findQ").setAttribute("aria-activedescendant", found.length ? "fo" + fi : "");
  $("fo" + fi)?.scrollIntoView({ block: "nearest" });
}
let findBack = null;
function openFind() { findBack = document.activeElement; closePop(false); hideTip(); $("find").hidden = false; $("findQ").value = ""; fi = 0; renderFind(); $("findQ").focus(); }
function closeFind(back = true) { if ($("find").hidden) return; $("find").hidden = true; if (back) findBack?.focus?.(); }
function pick(id) {
  closeFind(false);
  if (id.startsWith("ws")) { switchWs(+id.slice(2)); return $("ws").focus(); }
  if (id[0] === "p" && !S.open.projects && !S.rail) toggleSection("projects");
  if (id[0] === "f" && !S.open.favorites && !S.rail) toggleSection("favorites");
  go(id);
  (document.querySelector(`.scroll .it[data-page="${id}"]`) && !S.rail && !isPhone() ? document.querySelector(`.scroll .it[data-page="${id}"]`) : $("searchBtn")).focus();
}
$("searchBtn").addEventListener("click", openFind);
$("findQ").addEventListener("input", () => { fi = 0; renderFind(); });
$("findQ").addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown" && found.length) { e.preventDefault(); fi = (fi + 1) % found.length; renderFind(); }
  else if (e.key === "ArrowUp" && found.length) { e.preventDefault(); fi = (fi - 1 + found.length) % found.length; renderFind(); }
  else if (e.key === "Enter" && found[fi]) { e.preventDefault(); pick(found[fi][0]); }
  else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closeFind(); }
  else if (e.key === "Tab") e.preventDefault();
});
$("findList").addEventListener("click", (e) => { const b = e.target.closest("[data-find]"); if (b) pick(b.dataset.find); });
$("find").addEventListener("pointerdown", (e) => { if (e.target === $("find")) closeFind(); });

/* ---------- clicks and keys ---------- */
$("scroll").addEventListener("click", (e) => {
  const it = e.target.closest("[data-page]"), sec = e.target.closest("[data-sec]");
  if (it) return go(it.dataset.page);
  if (sec) { if (S.rail && !isPhone()) return popOpen === $("fly") && popBack === sec ? closePop() : openFly(sec.dataset.sec, sec); toggleSection(sec.dataset.sec); }
});
$("scroll").addEventListener("keydown", (e) => {
  if (!["ArrowDown", "ArrowUp", "Home", "End"].includes(e.key)) return;
  const items = $$(".scroll .it, .scroll .sec-h").filter((b) => b.tabIndex === 0 && b.offsetParent && !b.closest(".fold.shut"));
  const i = items.indexOf(document.activeElement); if (i < 0) return;
  e.preventDefault();
  const n = e.key === "Home" ? 0 : e.key === "End" ? items.length - 1 : Math.max(0, Math.min(items.length - 1, i + (e.key === "ArrowDown" ? 1 : -1)));
  items[n].focus();
});
addEventListener("pointerdown", (e) => { if (popOpen && !e.target.closest(".pop") && !(popBack && popBack.contains(e.target))) closePop(false); });
addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); return $("find").hidden ? openFind() : closeFind(); }
  if ((e.metaKey || e.ctrlKey) && /^[1-9]$/.test(e.key) && WS[+e.key - 1]) { e.preventDefault(); return switchWs(+e.key - 1); }
  if (e.target.matches("input")) return;
  if (e.key === "[" && !isPhone() && $("find").hidden) { e.preventDefault(); setRail(!S.rail); }
  if (e.key === "Escape") { if (popOpen) closePop(); else if (document.body.classList.contains("drawer")) closeDrawer(true); }
});
const say = (t) => { const l = $("live") || Object.assign(document.body.appendChild(document.createElement("p")), { id: "live", className: "sr" }); l.setAttribute("aria-live", "polite"); l.textContent = t; };

/* first paint */
renderSide();
renderView(false);
syncMode();
</script>
</body>
</html>
