<!doctype html>
<!-- ASCII field — Uiverse Originals. Free to use and adapt (MIT). One file, no dependencies.
     Layered sine noise rendered as characters; the pointer pushes a bright wake through it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASCII field</title>
<style>
  * { margin: 0; }
  html, body { height: 100%; overflow: hidden; background: #0a0907; }
  canvas { display: block; width: 100%; height: 100%; }
  .label {
    position: fixed; left: 24px; bottom: 22px; color: #f5e9d4;
    font: 600 13px ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .18em; text-transform: uppercase;
    background: #0a0907; padding: 6px 10px; border: 1px solid #3a3226;
  }
</style>
</head>
<body>
  <canvas aria-hidden="true"></canvas>
  <div class="label">Field / 01</div>
<script>
  const cv = document.querySelector("canvas"), ctx = cv.getContext("2d");
  const RAMP = " .·:-=+*#%@";
  const CELL = 14;
  let cols, rows, dpr, mouse = { x: -1e3, y: -1e3, tx: -1e3, ty: -1e3 };
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;

  function size() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    cols = Math.ceil(innerWidth / (CELL * 0.62)); rows = Math.ceil(innerHeight / CELL);
    ctx.font = `${CELL * dpr}px ui-monospace, "SF Mono", Menlo, monospace`;
    ctx.textBaseline = "top";
  }
  function frame(t) {
    t *= still ? 0 : 0.00035;
    mouse.x += (mouse.tx - mouse.x) * 0.12; mouse.y += (mouse.ty - mouse.y) * 0.12;
    ctx.fillStyle = "#0a0907"; ctx.fillRect(0, 0, cv.width, cv.height);
    const cw = CELL * 0.62;
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const u = x / cols, v = y / rows;
        /* three drifting waves, folded into 0..1 */
        let n = Math.sin(u * 7 + t * 3 + Math.sin(v * 5 + t)) + Math.sin(v * 9 - t * 2 + Math.cos(u * 4 - t * 1.3)) + Math.sin((u + v) * 5 + t * 1.7);
        n = (n + 3) / 6;
        const dx = x * cw - mouse.x, dy = y * CELL - mouse.y, d = Math.sqrt(dx * dx + dy * dy);
        const wake = Math.max(0, 1 - d / 140);
        n = Math.min(1, n * n * 1.2 + wake * 0.9);
        const ch = RAMP[Math.floor(n * (RAMP.length - 1))];
        if (ch === " ") continue;
        /* warm sodium to white in the wake */
        const l = 30 + n * 55, s = 70 - wake * 60;
        ctx.fillStyle = `hsl(${32 + wake * 10} ${s}% ${l}%)`;
        ctx.fillText(ch, x * cw * dpr, y * CELL * dpr);
      }
    }
    requestAnimationFrame(frame);
  }
  addEventListener("pointermove", (e) => { mouse.tx = e.clientX; mouse.ty = e.clientY; });
  addEventListener("pointerleave", () => { mouse.tx = mouse.ty = -1e3; });
  addEventListener("resize", size);
  size(); requestAnimationFrame(frame);
</script>
</body>
</html>
