<!doctype html>
<!-- Week calendar — Uiverse Originals. Free to use and adapt (MIT). One file, no dependencies.
     A week view for an invented calendar, Daybook: drag on the grid to create an event and name it inline,
     drag events to move them, click one for its details and call. Weeks slide, overlapping events share
     the column, the mini month follows along and each calendar fades in and out from the sidebar. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daybook — November 2026</title>
<style>
  :root {
    --bg: #f6f4ef; --paper: #fffdf9; --ink: #1d1b18; --soft: #45413a; --muted: #6a655c; --line: #e3dfd5; --line2: #efece4;
    --now: #c2412d; --focus: #2f5d8a; --hi: #ebe6da;
    --work: #35608c; --personal: #487a4c; --family: #a95f22; --focus-c: #866a12; --holiday: #8b3f5c;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --r: 8px; --ease: cubic-bezier(.2, .7, .2, 1); --H: 48px; --gut: 64px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  body { background: var(--bg); color: var(--ink); font: 14px/1.4 var(--sans); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  button, input, textarea { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; }
  ol, ul { list-style: none; }
  svg { display: block; }
  .ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .sr { position: absolute; top: 0; left: 0; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  .app { display: grid; grid-template-columns: 272px minmax(0, 1fr); height: 100svh; min-height: 720px; }

  /* ———— sidebar ———— */
  .side { display: flex; flex-direction: column; gap: 24px; min-height: 0; padding: 16px 20px 20px 24px; border-right: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; height: 32px; font: 600 20px var(--serif); letter-spacing: -.01em; }
  .brand svg { width: 26px; height: 26px; }
  .create { display: flex; align-items: center; justify-content: center; gap: 8px; height: 40px; border-radius: var(--r); background: var(--ink); color: var(--paper); font-weight: 600; transition: background-color .15s; }
  .create:hover { background: #3a362f; }
  .create:active { transform: translateY(1px); }
  .s-h { display: flex; align-items: center; justify-content: space-between; height: 28px; margin-bottom: 8px; }
  .s-h h2 { font-size: 13px; font-weight: 600; color: var(--soft); }
  .mini-h h2 { font: 600 16px var(--serif); color: var(--ink); }
  .ib { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 6px; color: var(--soft); transition: background-color .15s, color .15s; }
  .ib:hover { background: var(--hi); color: var(--ink); }
  .ib .ico { width: 16px; height: 16px; }
  .mini-nav { display: flex; gap: 2px; }
  .mini-g { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 2px; }
  .mini-g .wd { height: 24px; display: grid; place-items: center; font-size: 11px; font-weight: 600; color: var(--muted); }
  .mini-g button { position: relative; height: 30px; font-size: 12.5px; color: var(--ink); }
  .mini-g button span { position: relative; z-index: 1; display: grid; place-items: center; width: 28px; height: 28px; margin: 1px auto; border-radius: 50%; transition: background-color .15s, color .15s; }
  .mini-g button:hover span { background: var(--hi); }
  .mini-g button.out { color: #8f897e; }
  .mini-g button.wk::before { content: ""; position: absolute; inset: 1px 0; background: var(--hi); }
  .mini-g button.wk.ws::before { border-radius: 15px 0 0 15px; left: 2px; }
  .mini-g button.wk.we::before { border-radius: 0 15px 15px 0; right: 2px; }
  .mini-g button.today span { background: var(--ink); color: var(--paper); font-weight: 600; }
  .mini-g button.sel:not(.today) span { box-shadow: inset 0 0 0 1.5px var(--ink); }
  .mini-g button.has::after { content: ""; position: absolute; z-index: 1; left: 50%; bottom: 2px; width: 3px; height: 3px; margin-left: -1.5px; border-radius: 50%; background: var(--muted); }
  .mini-g button.today::after { display: none; }

  .cals li label { display: flex; align-items: center; gap: 12px; height: 32px; padding: 0 8px; margin: 0 -8px; border-radius: 6px; cursor: pointer; transition: background-color .15s; }
  .cals li label:hover { background: var(--hi); }
  .cals input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .box { display: grid; place-items: center; width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--c); background: var(--c); color: #fff; transition: background-color .15s; }
  .box .ico { width: 12px; height: 12px; stroke-width: 2.5; transition: opacity .15s; }
  .cals input:not(:checked) + .box { background: transparent; }
  .cals input:not(:checked) + .box .ico { opacity: 0; }
  .cals input:focus-visible + .box { outline: 2px solid var(--focus); outline-offset: 2px; }
  .cals .nm { flex: 1; }
  .cals .ct { font-size: 12px; color: var(--muted); }

  .agenda { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .ag { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -8px; padding: 0 8px 16px; scrollbar-width: thin; -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 28px), transparent); }
  .ag button { display: grid; grid-template-columns: 58px 1fr; gap: 6px; width: 100%; padding: 8px 8px 8px 10px; margin-bottom: 4px; border-radius: 6px; text-align: left; box-shadow: inset 2px 0 0 var(--c); transition: background-color .15s, opacity .2s; }
  .ag button:hover { background: var(--hi); }
  .ag time { font-size: 12px; color: var(--muted); padding-top: 1px; }
  .ag b { display: block; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ag small { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ag .past { opacity: .55; }
  .ag .empty { padding: 8px 0; font-size: 13px; color: var(--muted); }
  .tz { margin-top: auto; font-size: 12px; color: var(--muted); }

  /* ———— top bar ———— */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .bar { display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 24px; flex: none; }
  .menu { display: none; }
  .btn { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--paper); font-size: 13px; font-weight: 600; transition: background-color .15s, border-color .15s; }
  .btn:hover { border-color: #cfc9bc; background: #fff; }
  .nav { display: flex; }
  .nav .ib { width: 34px; height: 34px; }
  .nav .ico { width: 18px; height: 18px; }
  h1 { font: 600 26px/1 var(--serif); letter-spacing: -.015em; white-space: nowrap; }
  h1 .y { color: var(--muted); font-weight: 400; }
  .wkno { font-size: 12px; color: var(--muted); padding-top: 6px; white-space: nowrap; }
  .bar-r { display: flex; align-items: center; gap: 16px; margin-left: auto; }
  .views { position: relative; display: flex; padding: 3px; border: 1px solid var(--line); border-radius: var(--r); background: var(--line2); }
  .views button { position: relative; z-index: 1; height: 28px; padding: 0 14px; border-radius: 6px; font-size: 13px; font-weight: 600; color: var(--soft); transition: color .15s; }
  .views button[aria-pressed="true"] { color: var(--ink); }
  .views .pill { position: absolute; top: 3px; left: 3px; height: 28px; border-radius: 6px; background: var(--paper); box-shadow: 0 1px 2px rgba(29, 27, 24, .12), 0 0 0 1px rgba(29, 27, 24, .05); transition: transform .22s var(--ease), width .22s var(--ease); }
  .me { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: #d9c7a7; color: #4a3a1c; font-size: 12px; font-weight: 700; }
  .mob-add { display: none; }

  /* ———— week view ———— */
  .view { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; margin: 0 24px 24px 0; border: 1px solid var(--line); border-left: 0; border-radius: 0 var(--r) var(--r) 0; background: var(--paper); overflow: hidden; }
  .row { display: grid; grid-template-columns: var(--gut) minmax(0, 1fr); flex: none; }
  .heads { border-bottom: 1px solid var(--line); }
  .dhs, .ad, .cols { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); }
  .dh { display: flex; align-items: baseline; gap: 8px; height: 60px; padding: 18px 12px 0; border-left: 1px solid var(--line2); }
  .dh .dw { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .dh .dn { display: grid; place-items: center; min-width: 32px; height: 32px; margin-top: -6px; border-radius: 16px; font: 500 22px var(--serif); }
  .dh.today .dw { color: var(--now); }
  .dh.today .dn { background: var(--ink); color: var(--paper); padding: 0 6px; }
  .dh.wkend .dw, .dh.wkend .dn { color: var(--muted); }
  .ghead { display: flex; align-items: flex-end; justify-content: flex-end; padding: 0 10px 8px 0; font-size: 11px; color: var(--muted); }
  .allday { border-bottom: 1px solid var(--line); }
  .allday .ghead { align-items: center; padding: 0 10px 0 0; }
  .ad { position: relative; grid-auto-rows: 26px; row-gap: 4px; padding: 6px 0; min-height: 38px; }
  .ad::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, var(--line2) 1px, transparent 1px) 0 0 / calc(100% / var(--n)) 100%; }
  .bar-ev { position: relative; z-index: 1; display: flex; align-items: center; gap: 6px; margin: 0 4px; padding: 0 8px; border-radius: 5px; background: color-mix(in srgb, var(--c) 16%, var(--paper)); color: color-mix(in srgb, var(--c) 72%, #000); box-shadow: inset 3px 0 0 var(--c); font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; transition: opacity .2s, background-color .15s; }
  .bar-ev .bt { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .ev.narrow { padding-left: 7px; padding-right: 3px; }
  .ev.narrow .et { display: block; white-space: nowrap; text-overflow: ellipsis; overflow-wrap: normal; }
  .ev.narrow.short .em { display: none; }
  .ev.narrow.short .et { max-width: 100%; flex: 1 1 auto; min-width: 0; }
  .bar-ev:hover { background: color-mix(in srgb, var(--c) 24%, var(--paper)); }

  .scroller { position: relative; flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: #cfc9bc transparent; }
  .grid { position: relative; display: grid; grid-template-columns: var(--gut) minmax(0, 1fr); height: calc(var(--H) * 24); }
  .hours { position: relative; }
  .hours span { position: absolute; right: 10px; transform: translateY(-50%); font-size: 11px; color: var(--muted); white-space: nowrap; }
  .cols { position: relative; background: repeating-linear-gradient(to bottom, var(--line2) 0 1px, transparent 1px var(--H)); }
  .day { position: relative; border-left: 1px solid var(--line2); touch-action: pan-y; cursor: crosshair; }
  .day.wkend { background: rgba(235, 230, 218, .28); }
  .day.today { background: rgba(194, 65, 45, .028); }
  .shift { animation: shift .26s var(--ease); }
  @keyframes shift { from { transform: translateX(var(--dx)); opacity: 0; } }

  .ev { position: absolute; z-index: 2; display: flex; flex-direction: column; gap: 1px; min-height: 20px; padding: 4px 6px 4px 9px; border-radius: 6px; overflow: hidden; text-align: left; background: color-mix(in srgb, var(--c) 14%, var(--paper)); color: color-mix(in srgb, var(--c) 70%, #000); box-shadow: inset 3px 0 0 var(--c), 0 0 0 1px var(--paper); cursor: pointer; touch-action: pan-y; transition: top .22s var(--ease), left .22s var(--ease), width .22s var(--ease), height .22s var(--ease), opacity .2s, background-color .15s; }
  .ev:hover { background: color-mix(in srgb, var(--c) 22%, var(--paper)); }
  .ev .et { font-size: 12.5px; font-weight: 600; line-height: 16px; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow-wrap: break-word; }
  .ev .em { font-size: 11.5px; line-height: 15px; color: color-mix(in srgb, var(--c) 55%, #333); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev.mid .et { -webkit-line-clamp: 1; }
  .ev.short { flex-direction: row; align-items: baseline; gap: 6px; padding-top: 2px; padding-bottom: 2px; }
  .ev.short .et { -webkit-line-clamp: 1; flex: none; max-width: 70%; }
  .ev.tiny .em { display: none; }
  .ev.off, .bar-ev.off, .ag button.off, .mchip.off { opacity: 0; pointer-events: none; }
  .ev.off { transform: scale(.98); }
  .ev.open { background: var(--c); color: #fff; }
  .ev.open .em { color: rgba(255, 255, 255, .86); }
  .ev.moving { z-index: 6; transition: none; cursor: grabbing; box-shadow: inset 3px 0 0 var(--c), 0 8px 20px rgba(29, 27, 24, .16), 0 1px 3px rgba(29, 27, 24, .12); pointer-events: none; }
  .ev.ghost { z-index: 6; transition: none; background: color-mix(in srgb, var(--c) 20%, var(--paper)); box-shadow: inset 3px 0 0 var(--c), 0 0 0 1px color-mix(in srgb, var(--c) 45%, transparent); }
  .ev.editing { z-index: 6; cursor: default; box-shadow: inset 3px 0 0 var(--c), 0 0 0 2px var(--c), 0 8px 20px rgba(29, 27, 24, .14); background: var(--paper); }
  .ev .ei { display: block; width: 100%; min-width: 0; max-height: 48px; padding: 0; margin: 0; border: 0; outline: 0; resize: none; overflow: hidden; background: transparent; line-height: 16px; font-size: 12.5px; font-weight: 600; color: var(--ink); }
  .ev .ei::placeholder { color: #8a8478; font-weight: 500; }
  .ev.flash { animation: flash .5s var(--ease); }
  @keyframes flash { from { box-shadow: inset 3px 0 0 var(--c), 0 0 0 3px color-mix(in srgb, var(--c) 40%, transparent); } }
  .dragging, .dragging * { cursor: grabbing !important; user-select: none; -webkit-user-select: none; }
  .creating, .creating * { cursor: ns-resize !important; user-select: none; -webkit-user-select: none; }

  .now { position: absolute; z-index: 4; left: -1px; right: 0; height: 2px; margin-top: -1px; background: var(--now); pointer-events: none; transition: top .6s linear; }
  .now::before { content: ""; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--now); }
  .now-t { position: absolute; font-variant-numeric: tabular-nums; z-index: 4; right: 6px; transform: translateY(-50%); padding: 1px 5px; border-radius: 4px; background: var(--now); color: #fff; font-size: 11px; font-weight: 600; transition: top .6s linear; }
  .now-wk { position: absolute; z-index: 1; left: 0; right: 0; height: 1px; background: color-mix(in srgb, var(--now) 35%, transparent); pointer-events: none; }

  /* ———— month view ———— */
  .mv { flex: 1; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); }
  .mv-h { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
  .mv-h span { padding: 10px 12px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .mv-g { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); }
  .mc { display: flex; flex-direction: column; gap: 3px; min-height: 0; padding: 6px 6px 4px; border-left: 1px solid var(--line2); border-top: 1px solid var(--line2); overflow: hidden; }
  .mc:nth-child(7n + 1) { border-left: 0; }
  .mc.out { background: rgba(235, 230, 218, .32); }
  .mc .md { align-self: flex-start; display: grid; place-items: center; min-width: 26px; height: 26px; padding: 0 4px; border-radius: 13px; font: 500 15px var(--serif); transition: background-color .15s; }
  .mc .md:hover { background: var(--hi); }
  .mc.out .md { color: #8f897e; }
  .mc.today .md { background: var(--ink); color: var(--paper); }
  .mchip { display: flex; align-items: center; gap: 6px; height: 20px; padding: 0 6px; border-radius: 4px; font-size: 12px; white-space: nowrap; overflow: hidden; text-align: left; transition: background-color .15s, opacity .2s; }
  .mchip:hover { background: var(--hi); }
  .mchip i { width: 6px; height: 6px; border-radius: 2px; background: var(--c); flex: none; }
  .mchip time { color: var(--muted); font-size: 11.5px; }
  .mchip span { overflow: hidden; text-overflow: ellipsis; }
  .mchip.all { background: color-mix(in srgb, var(--c) 16%, var(--paper)); color: color-mix(in srgb, var(--c) 72%, #000); font-weight: 600; }
  .more { align-self: flex-start; padding: 0 6px; font-size: 12px; font-weight: 600; color: var(--soft); border-radius: 4px; }
  .more:hover { background: var(--hi); }

  /* ———— popover ———— */
  .pop { position: fixed; z-index: 50; width: 360px; max-width: calc(100vw - 16px); background: var(--paper); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 32px rgba(29, 27, 24, .14), 0 2px 6px rgba(29, 27, 24, .08); transition: opacity .16s, transform .16s var(--ease); }
  .pop[hidden] { display: block; opacity: 0; transform: translateY(4px) scale(.985); visibility: hidden; pointer-events: none; }
  .pop-h { display: flex; align-items: flex-start; gap: 12px; padding: 16px 12px 4px 20px; }
  .pop-h .sw { width: 12px; height: 12px; margin-top: 8px; border-radius: 3px; background: var(--c); flex: none; }
  .pop-h h2 { flex: 1; font: 600 20px/1.25 var(--serif); letter-spacing: -.01em; overflow-wrap: anywhere; }
  .pop-h .acts { display: flex; gap: 2px; margin-top: 1px; }
  .pop-b { padding: 4px 20px 20px; }
  .pr { display: flex; gap: 12px; padding: 6px 0; font-size: 13.5px; color: var(--soft); }
  .pr .ico { margin-top: 1px; color: var(--muted); }
  .pr b { color: var(--ink); font-weight: 600; }
  .pr small { display: block; color: var(--muted); font-size: 12.5px; }
  .ppl { margin: 8px 0 0; padding-top: 12px; border-top: 1px solid var(--line2); }
  .ppl h3 { margin-bottom: 8px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .ppl li { display: flex; align-items: center; gap: 10px; height: 34px; font-size: 13.5px; }
  .av { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--a); color: #2b261e; font-size: 10.5px; font-weight: 700; flex: none; }
  .ppl .st { margin-left: auto; font-size: 12px; color: var(--muted); }
  .ppl .st.no { color: #9a3b2b; }
  .note { margin-top: 12px; padding: 10px 12px; border-radius: 6px; background: var(--line2); font-size: 13px; color: var(--soft); }
  .pop-f { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
  .join { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 16px; border-radius: var(--r); background: var(--work); color: #fff; font-size: 13.5px; font-weight: 600; transition: background-color .15s; }
  .join:hover { background: #2a4d72; }
  .join.in { background: var(--now); }
  .join.in:hover { background: #a6361f; }
  .pop-f .lk { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

  .toast { position: fixed; z-index: 60; left: 50%; bottom: 24px; display: flex; align-items: center; gap: 16px; padding: 10px 12px 10px 16px; border-radius: 10px; background: var(--ink); color: var(--paper); font-size: 13.5px; box-shadow: 0 8px 24px rgba(29, 27, 24, .2); transform: translate(-50%, 12px); opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s var(--ease); max-width: calc(100vw - 32px); }
  .toast.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast button { padding: 4px 8px; border-radius: 6px; font-weight: 600; color: #f2c5a6; }
  .toast button:hover { background: rgba(255, 255, 255, .1); }
  .scrim { display: none; }

  /* ———— tablet: sidebar becomes a drawer ———— */
  @media (max-width: 1100px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .side { position: fixed; z-index: 40; top: 0; bottom: 0; left: 0; width: 296px; background: var(--bg); box-shadow: 0 0 40px rgba(29, 27, 24, .18); transform: translateX(-104%); visibility: hidden; transition: transform .24s var(--ease), visibility 0s .24s; }
    .side.open { transform: none; visibility: visible; transition: transform .24s var(--ease); }
    .scrim { position: fixed; z-index: 39; inset: 0; background: rgba(29, 27, 24, .28); }
    .scrim.on { display: block; }
    .menu { display: grid; }
    .bar { padding: 0 16px; gap: 8px; }
    .view { margin: 0 16px 16px; border-left: 1px solid var(--line); border-radius: var(--r); }
    .wkno { display: none; }
  }
  @media (max-width: 680px) {
    :root { --gut: 48px; }
    .bar { flex-wrap: wrap; height: auto; padding: 10px 12px; row-gap: 10px; }
    .bar .btn.today { order: 3; }
    .bar::after { content: ""; order: 4; flex-basis: 100%; }
    h1 { order: 1; font-size: 22px; flex: 1; }
    .bar-r { order: 6; flex: 1; min-width: 0; margin: 0; gap: 8px; }
    .views { flex: 1; }
    .views button { flex: 1; padding: 0 8px; }
    .me { display: none; }
    .nav { order: 5; }
    .mob-add { display: grid; order: 2; }
    .view { margin: 0 8px 8px; }

<script>
(function () {
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
  const mm = matchMedia("(prefers-reduced-motion: reduce)");
  const still = () => mm.matches;
  const ico = (n) => '<svg class="ico" aria-hidden="true"><use href="#i-' + n + '"/></svg>';
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const MON = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const WD = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  const WDL = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];

  /* ———— dates: "today" is fixed so the first paint never changes ———— */
  const TODAY = new Date(2026, 10, 3);
  const NOW0 = 10 * 60 + 40, T0 = performance.now();
  const nowMin = () => Math.min(1439, NOW0 + (performance.now() - T0) / 60000);
  const pad = (n) => String(n).padStart(2, "0");
  const key = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const fromKey = (k) => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
  const addD = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const monday = (d) => addD(d, -((d.getDay() + 6) % 7));
  const dow = (d) => (d.getDay() + 6) % 7;
  const W0 = monday(TODAY);
  const wkIdx = (d) => Math.round((monday(d) - W0) / 6048e5);
  const isoWeek = (d) => { const t = addD(d, 3 - dow(d)); const j = new Date(t.getFullYear(), 0, 4); return 1 + Math.round(((t - j) / 864e5 - 3 + dow(j)) / 7); };
  const TK = key(TODAY);
  function hm(m, ap) {
    const h = Math.floor(m / 60) % 24, mi = Math.round(m % 60), h12 = h % 12 || 12;
    return h12 + (mi ? ":" + pad(mi) : "") + (ap ? (h < 12 ? " AM" : " PM") : "");
  }
  function range(s, e) {
    const sa = s < 720, ea = e < 720 || e >= 1440;
    const full = (m) => { const h = Math.floor(m / 60) % 24, mi = m % 60; return (h % 12 || 12) + ":" + pad(mi); };
    return full(s) + (sa === ea ? "" : sa ? " AM" : " PM") + " – " + full(e) + (ea ? " AM" : " PM");
  }
  const shortT = (m) => { const h = Math.floor(m / 60), mi = m % 60; return (h % 12 || 12) + (mi ? ":" + pad(mi) : "") + (h < 12 ? "am" : "pm"); };

  /* ———— data ———— */
  const CALS = [
    { id: "work", name: "Work", c: "var(--work)" }, { id: "personal", name: "Personal", c: "var(--personal)" },
    { id: "family", name: "Family", c: "var(--family)" }, { id: "focus", name: "Focus time", c: "var(--focus-c)" },
    { id: "holiday", name: "Holidays", c: "var(--holiday)" },
  ];
  const calC = (id) => CALS.find((c) => c.id === id).c;
  const PPL = {
    IV: ["Ines Varga", "#d9c7a7"], IC: ["Ifeoma Chukwu", "#e6c1a8"], MR: ["Mateo Ruiz", "#bcd4c0"], AS: ["Aarav Shah", "#c9d3e6"],
    LB: ["Linnea Berg", "#e4d29b"], KM: ["Kenji Mori", "#d8c4dc"], FZ: ["Fatima Zahra El Idrissi", "#cfe0d8"], TH: ["Tomás Herrera", "#e9cbc4"],
    YT: ["Yuki Tanaka", "#d3d9b4"], NO: ["Noor Varga", "#efd7b5"],
  };
  const EV = [];
  let uid = 0;
  /* day offset from this Monday, start "h:mm", end, calendar, title, extras */
  function add(day, s, e, cal, title, x) {
    const t = (v) => { const [h, m] = v.split(":").map(Number); return h * 60 + (m || 0); };
    const ev = Object.assign({ id: "e" + ++uid, cal, title, date: key(addD(W0, day)), start: t(s), end: t(e), loc: "", ppl: [], call: false, note: "" }, x || {});
    EV.push(ev); return ev;
  }
  function addAll(day, n, cal, title, x) { const ev = Object.assign({ id: "e" + ++uid, cal, title, date: key(addD(W0, day)), days: n, all: true, ppl: [], loc: "", note: "" }, x || {}); EV.push(ev); return ev; }
  const going = (...a) => a.map((p) => [p, "Going"]);
  function weekly(w, skip) {
    const o = w * 7;
    for (let d = 0; d < 5; d++) if (!(skip || []).includes(d)) add(o + d, "9:30", "9:45", "work", "Standup", { loc: "Video call", call: true, ppl: [["LB", "Organizer"], ...going("IV", "AS", "KM", "MR")], rec: "Every weekday" });
  }
  weekly(0, [3, 4]);
  add(0, "11:00", "12:00", "work", "Roadmap review", { loc: "Room 4B, Herengracht office", ppl: [["AS", "Organizer"], ...going("IV", "LB"), ["KM", "Maybe"]] });
  add(0, "14:00", "15:30", "work", "Pricing page workshop", { loc: "Room 2A", ppl: [["IV", "Organizer"], ...going("TH", "YT")], note: "Bring the three layouts from Thursday. We pick one and cut the rest." });
  add(0, "18:30", "19:30", "personal", "Climbing", { loc: "Boulderhal Oost" });
  add(1, "10:00", "11:00", "work", "Design critique", { id: "crit", loc: "Room 4B · and on video", call: true, ppl: [["IC", "Organizer"], ...going("IV", "TH", "YT"), ["KM", "Maybe"], ["FZ", "Declined"]], note: "Onboarding flow, second round. Comments in the doc before we start, please." });
  add(1, "10:30", "11:00", "work", "1:1 with Ifeoma", { loc: "Video call", call: true, ppl: [["IC", "Organizer"], ...going("IV")], rec: "Every Tuesday" });
  add(1, "12:30", "13:30", "personal", "Lunch with Mateo", { loc: "Café de Jaren" , ppl: going("IV", "MR") });
  add(1, "15:00", "16:30", "focus", "Write Q1 planning doc", { note: "Do not book over this unless it’s on fire." });
  add(1, "15:30", "16:00", "work", "Print vendor call", { call: true, ppl: [["IV", "Organizer"], ...going("TH")] });
  add(1, "17:15", "18:00", "family", "Pick up Noor from school", {});
  add(2, "7:30", "8:30", "personal", "Swim", { loc: "Zuiderbad" });
  add(2, "11:00", "11:45", "work", "Hiring sync", { call: true, ppl: [["FZ", "Organizer"], ...going("IV", "AS")] });
  add(2, "12:00", "13:00", "work", "Customer interview: Harbour Clinic", { call: true, ppl: [["YT", "Organizer"], ...going("IV")], note: "Night-shift nurses, 4 participants. Recording on." });
  add(2, "14:00", "16:00", "focus", "Deep work: onboarding flow", {});
  add(2, "17:30", "18:30", "family", "Parent–teacher meeting", { loc: "Montessori School Oost", ppl: going("IV", "NO") });
  addAll(1, 1, "family", "Noor’s 9th birthday", {});
  addAll(3, 2, "work", "Lisbon offsite", { loc: "Lisbon" });
  addAll(6, 1, "holiday", "Diwali", {});
  add(3, "7:05", "10:00", "work", "Flight AMS → LIS", { loc: "Schiphol, Terminal 2" });
  add(3, "12:00", "13:00", "work", "Team lunch", { loc: "Cais do Sodré", ppl: going("IV", "AS", "LB", "KM", "TH") });
  add(3, "14:00", "16:30", "work", "Offsite: strategy session", { loc: "Rua da Boavista 12, Lisbon", ppl: [["AS", "Organizer"], ...going("IV", "LB", "KM", "IC", "FZ")] });
  add(3, "19:30", "22:00", "work", "Team dinner", { loc: "Bairro Alto" });
  add(4, "10:00", "11:30", "work", "Offsite: retro", { ppl: [["LB", "Organizer"], ...going("IV", "AS", "KM")] });
  add(4, "17:40", "21:15", "work", "Flight LIS → AMS", { loc: "Lisbon Airport, Terminal 1" });
  add(5, "10:00", "11:30", "family", "Noor’s football match", { loc: "Sportpark Middenmeer" });
  add(5, "19:00", "21:30", "personal", "Dinner at Saba’s", { loc: "Saba’s place, De Pijp" });
  add(6, "9:00", "10:00", "personal", "Long run", { loc: "Amstel loop" });
  add(6, "16:00", "17:00", "family", "Call grandma", { call: true });
  const crit = EV.find((e) => e.id === "crit"); crit.id = "e-crit";

  /* other weeks: a seeded rhythm so every week looks lived in */
  const made = new Set([0]);
  const POOL = [["work", "Design critique", 60], ["work", "Roadmap review", 60], ["work", "Customer interview", 60], ["focus", "Deep work", 120],
    ["work", "Hiring sync", 45], ["personal", "Dentist", 45], ["work", "Planning poker", 60], ["family", "Swimming lessons", 60], ["focus", "Inbox zero", 60],
    ["work", "Quarterly business review", 90], ["personal", "Coffee with Linnea", 30], ["work", "Brand workshop", 120], ["personal", "Yoga", 60]];
  function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6d2b79f5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function ensure(d) {
    const w = wkIdx(d); if (made.has(w)) return; made.add(w);
    const r = rng(w * 7919 + 101), o = w * 7;
    weekly(w);
    add(o + 1, "10:30", "11:00", "work", "1:1 with Ifeoma", { call: true, ppl: [["IC", "Organizer"], ...going("IV")], rec: "Every Tuesday" });
    add(o + 2, "7:30", "8:30", "personal", "Swim", { loc: "Zuiderbad" });
    add(o + 6, "9:00", "10:00", "personal", "Long run", { loc: "Amstel loop" });
    const n = 5 + Math.floor(r() * 4);
    for (let i = 0; i < n; i++) {
      const p = POOL[Math.floor(r() * POOL.length)], day = Math.floor(r() * 5);
      const s = (10 + Math.floor(r() * 14) / 2) * 60;
      const ev = add(o + day, "0:00", "0:00", p[0], p[1], p[0] === "work" ? { call: r() > .4, ppl: [["IV", "Organizer"], ...going(["AS", "LB", "KM", "TH"][Math.floor(r() * 4)])] } : {});
      ev.start = s; ev.end = Math.min(1440, s + p[2]);
    }
    if (r() > .55) addAll(o + Math.floor(r() * 5), 1, "personal", ["Out of office", "Grandma visiting", "Library books due"][Math.floor(r() * 3)], {});
  }

  /* ———— state ———— */
  const st = { view: "week", anchor: TODAY, hidden: new Set() };
  const view = $("#view");
  let H = 56;

  /* ———— sidebar: calendars ———— */
  $("#cals").innerHTML = CALS.map((c) => '<li><label><input type="checkbox" checked data-cal="' + c.id + '"><span class="box" style="--c:' + c.c + '">' + ico("check") + '</span><span class="nm">' + c.name + '</span><span class="ct" data-ct="' + c.id + '"></span></label></li>').join("");
  $("#cals").addEventListener("change", (e) => {
    const id = e.target.dataset.cal; if (!id) return;
    e.target.checked ? st.hidden.delete(id) : st.hidden.add(id);
    applyHidden();
    say((e.target.checked ? "Showing " : "Hiding ") + CALS.find((c) => c.id === id).name + " events.");
  });
  function applyHidden() {
    $$("[data-cal-of]").forEach((el) => el.classList.toggle("off", st.hidden.has(el.dataset.calOf)));
    if (st.view !== "month") layoutAll();
  }

  /* ———— which days are on screen ———— */
  const phone = () => innerWidth <= 680;
  function days() {
    if (st.view === "day") return [st.anchor];
    const m = monday(st.anchor);
    if (phone()) { const off = Math.min(4, dow(st.anchor)); return [0, 1, 2].map((i) => addD(m, off + i)); }
    return [0, 1, 2, 3, 4, 5, 6].map((i) => addD(m, i));
  }
  const evOn = (k) => EV.filter((e) => !e.all && e.date === k);

  /* ———— header ———— */
  function header() {
    const ds = st.view === "month" ? [st.anchor] : days();
    const a = ds[0], b = ds[ds.length - 1];
    let t;
    if (st.view === "day") t = WDL[dow(a)] + ", " + MON[a.getMonth()].slice(0, 3) + " " + a.getDate() + ' <span class="y">' + a.getFullYear() + "</span>";
    else if (a.getMonth() === b.getMonth() || st.view === "month") t = MON[a.getMonth()] + ' <span class="y">' + a.getFullYear() + "</span>";
    else t = MON[a.getMonth()].slice(0, 3) + " – " + MON[b.getMonth()].slice(0, 3) + ' <span class="y">' + b.getFullYear() + "</span>";
    $("#title").innerHTML = t;
    $("#wkno").textContent = st.view === "month" ? "" : "Week " + isoWeek(a);
    const unit = st.view === "day" ? "day" : st.view === "month" ? "month" : "week";
    $("#prev").setAttribute("aria-label", "Previous " + unit); $("#next").setAttribute("aria-label", "Next " + unit);
    document.title = "Daybook — " + $("#title").textContent;
  }

  /* ———— week / day view ———— */
  function render(dir) {
    closePop(); cancelEdit();
    header(); mini(); agenda(); counts();
    if (st.view === "month") return renderMonth(dir);
    const ds = days(), n = ds.length;
    ds.forEach(ensure);
    const topMin = $(".scroller", view) ? st.topMin : null;
    const ks = ds.map(key);
    const alls = EV.filter((e) => e.all).map((e) => { const s = fromKey(e.date); const a = Math.round((s - ds[0]) / 864e5); return { e, a, b: a + e.days - 1 }; }).filter((o) => o.b >= 0 && o.a < n);
    alls.sort((x, y) => x.a - y.a || (y.b - y.a) - (x.b - x.a));
    const rows = [];
    alls.forEach((o) => { let r = rows.findIndex((end) => end < Math.max(0, o.a)); if (r < 0) { r = rows.length; rows.push(-1); } rows[r] = Math.min(n - 1, o.b); o.r = r; });
    let h = '<div class="row heads"><div class="ghead">' + (n > 3 ? "CET" : "") + '</div><div class="dhs" style="--n:' + n + '">';
    ds.forEach((d, i) => {
      const k = ks[i], cls = (k === TK ? " today" : "") + (dow(d) > 4 ? " wkend" : "");
      h += '<div class="dh' + cls + '"' + (k === TK ? ' aria-current="date"' : "") + '><span class="dw">' + WD[dow(d)] + '</span><span class="dn">' + d.getDate() + "</span></div>";
    });
    h += '</div></div><div class="row allday"><div class="ghead">All day</div><div class="ad" style="--n:' + n + '">';
    alls.forEach((o) => {
      const a = Math.max(0, o.a), b = Math.min(n - 1, o.b);
      h += '<button class="bar-ev' + (st.hidden.has(o.e.cal) ? " off" : "") + '" data-id="' + o.e.id + '" data-cal-of="' + o.e.cal + '" style="--c:' + calC(o.e.cal) + ";grid-column:" + (a + 1) + " / " + (b + 2) + ";grid-row:" + (o.r + 1) + '"><span class="bt">' + esc(o.e.title) + "</span></button>";
    });
    h += '</div></div><div class="scroller" id="scroller"><div class="grid" style="--H:' + H + 'px"><div class="hours" aria-hidden="true">';
    for (let i = 1; i < 24; i++) h += '<span style="top:' + i * H + 'px">' + hm(i * 60, true) + "</span>";
    h += '</div><div class="cols" style="--n:' + n + '">';
    ks.forEach((k, i) => { h += '<div class="day' + (k === TK ? " today" : "") + (dow(ds[i]) > 4 ? " wkend" : "") + '" data-key="' + k + '" role="group" aria-label="' + WDL[dow(ds[i])] + ", " + MON[ds[i].getMonth()] + " " + ds[i].getDate() + '"></div>'; });
    h += "</div></div></div>";
    view.innerHTML = h;
    ks.forEach((k) => evOn(k).forEach((e) => $('.day[data-key="' + k + '"]', view).appendChild(evEl(e))));
    layoutAll();
    nowLine();
    const sc = $(".scroller", view);
    sc.scrollTop = (topMin != null ? topMin : 450) * H / 60;
    st.topMin = topMin != null ? topMin : 450;
    sc.addEventListener("scroll", () => { if (sc.scrollHeight > sc.clientHeight + 2 && sc.isConnected) st.topMin = sc.scrollTop * 60 / H; }, { passive: true });
    if (dir && !still()) $$(".dhs, .ad, .cols", view).forEach((el) => { el.style.setProperty("--dx", dir * 32 + "px"); el.classList.add("shift"); });
  }
  function evEl(e) {
    const b = document.createElement("button");

    const mode = P.mode; P.mode = null;
    setTimeout(() => { P.suppress = false; }, 0);
    if (mode === "move") {
      const ev = P.ev, el = P.el;
      el.classList.remove("moving");
      if (cancel) { render(0); return; }
      const dur = ev.end - ev.start, moved = ev.date !== P.col.dataset.key || ev.start !== P.s;
      undo = { ev, i: -1, from: P.from };
      ev.date = P.col.dataset.key; ev.start = P.s; ev.end = P.s + dur;
      fillEv(el, ev); layoutAll(); agenda(); mini(); counts();
      el.focus({ preventScroll: true });
      if (moved) { const d = fromKey(ev.date); say("Moved " + ev.title + " to " + WDL[dow(d)] + " " + range(ev.start, ev.end) + "."); toast("Moved to " + WD[dow(d)] + " " + hm(ev.start, true), "Undo"); }
    } else if (mode === "create") {
      const g = P.el; g.remove();
      if (!cancel) create(P.day, P.s, P.e);
    }
  }
  view.addEventListener("click", (e) => {
    if (P.suppress) { e.preventDefault(); return; }
    const t = e.target.closest(".ev:not(.editing):not(.ghost), .bar-ev, .mchip");
    if (!t) return;
    const ev = EV.find((x) => x.id === t.dataset.id); if (!ev) return;
    if (popFor === ev) { closePop(); return; }
    openPop(ev, t);
  });
  /* undo for moves reuses the toast */
  function restoreMove() {
    if (!undo || undo.i !== -1) return false;
    Object.assign(undo.ev, undo.from); const id = undo.ev.id; undo = null; toastEl.classList.remove("on"); render(0);
    const el = $('[data-id="' + id + '"]', view); if (el) { el.focus({ preventScroll: true }); if (!still()) el.classList.add("flash"); }
    say("Move undone."); return true;
  }

  /* ———— inline title for a new event ———— */
  let edit = null;
  function create(day, s, e) {
    closePop(true); cancelEdit();
    const cal = (CALS.find((c) => !st.hidden.has(c.id) && c.id !== "holiday") || CALS[0]).id;
    const ev = { id: "e" + ++uid, cal, title: "", date: day.dataset.key, start: s, end: e, loc: "", ppl: [["IV", "Organizer"]], call: false, note: "" };
    const el = document.createElement("div");
    el.className = "ev editing"; el.dataset.calOf = cal; el.style.setProperty("--c", calC(cal));
    el.style.top = s * H / 60 + "px"; el.style.height = Math.max(40, (e - s) * H / 60 - 2) + "px"; el.style.left = "2px"; el.style.width = "calc(100% - 6px)";
    el.innerHTML = '<textarea class="ei" rows="1" maxlength="80" placeholder="Add title" aria-label="Title for the new event, ' + range(s, e) + '"></textarea><span class="em">' + range(s, e) + "</span>";
    day.appendChild(el);
    edit = { ev, el, day };
    const inp = $("textarea", el);
    const fit = () => { inp.style.height = "auto"; inp.style.height = inp.scrollHeight + "px"; };
    inp.addEventListener("input", fit);
    inp.focus({ preventScroll: true });
    const sc = $(".scroller", view), r = el.getBoundingClientRect(), sr = sc.getBoundingClientRect();
    if (r.top < sr.top || r.bottom > sr.bottom) sc.scrollTo({ top: Math.max(0, s * H / 60 - 60), behavior: still() ? "auto" : "smooth" });
    say("New event " + range(s, e) + ". Type a title, Enter to save, Escape to cancel.");
  }
  function saveEdit() {
    if (!edit) return;
    const { ev, el, day } = edit, v = $("textarea", el).value.replace(/\s+/g, " ").trim();
    edit = null;
    el.remove();
    if (!v) { say("New event discarded."); return; }
    ev.title = v; EV.push(ev);
    const b = evEl(ev); day.appendChild(b); layoutDay(day);
    if (!still()) b.classList.add("flash");
    b.focus({ preventScroll: true });
    agenda(); mini(); counts();
    const d = fromKey(ev.date);
    say("Added " + v + ", " + WDL[dow(d)] + " " + range(ev.start, ev.end) + ".");
  }
  function cancelEdit() { if (!edit) return; edit.el.remove(); edit = null; }
  view.addEventListener("keydown", (e) => {
    if (e.target.classList.contains("ei")) {
      if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); saveEdit(); }
      else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); const day = edit.day; cancelEdit(); say("New event discarded."); const first = $(".ev", day) || $("#createBtn"); first.focus({ preventScroll: true }); }
      return;
    }
    const t = e.target.closest(".ev:not(.ghost)");
    if (!t || !["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) return;
    e.preventDefault(); e.stopPropagation();
    const ev = EV.find((x) => x.id === t.dataset.id); if (!ev) return;
    const dur = ev.end - ev.start;
    if (e.key === "ArrowUp" || e.key === "ArrowDown") {
      const s = Math.max(0, Math.min(1440 - dur, ev.start + (e.key === "ArrowUp" ? -15 : 15)));
      ev.start = s; ev.end = s + dur; fillEv(t, ev); layoutDay(t.parentElement);
    } else {
      const cols = $$(".day", view), i = cols.indexOf(t.parentElement) + (e.key === "ArrowLeft" ? -1 : 1);
      if (i < 0 || i >= cols.length) { say("No more days in this view."); return; }
      const from = t.parentElement; ev.date = cols[i].dataset.key; cols[i].appendChild(t); layoutDay(from); layoutDay(cols[i]);
    }
    closePop(true);
    t.focus({ preventScroll: true });
    agenda(); counts();
    const d = fromKey(ev.date);
    say(WDL[dow(d)] + ", " + range(ev.start, ev.end));
  });
  view.addEventListener("focusout", (e) => { if (edit && e.target.classList.contains("ei")) setTimeout(() => { if (edit && document.activeElement !== $("textarea", edit.el)) saveEdit(); }, 0); });

  function newEvent() {
    if (st.view === "month") go(TODAY, 0, "week");
    let day = $('.day[data-key="' + TK + '"]', view) || $(".day", view);
    const s = day.dataset.key === TK ? Math.ceil(nowMin() / 60) * 60 : 9 * 60;
    if (innerWidth <= 1100) drawer(false);
    create(day, Math.min(s, 1380), Math.min(s, 1380) + 60);
  }
  $("#createBtn").addEventListener("click", newEvent);
  $("#mobAdd").addEventListener("click", newEvent);

  /* ———— drawer (tablet, phone) ———— */
  const side = $("#side"), scrim = $("#scrim");
  function drawer(on) {
    side.classList.toggle("open", on); scrim.classList.toggle("on", on); $("#menuBtn").setAttribute("aria-expanded", on);
    if (on) setTimeout(() => $("#createBtn").focus(), 30); else if (side.contains(document.activeElement)) $("#menuBtn").focus();
  }
  $("#menuBtn").addEventListener("click", () => drawer(!side.classList.contains("open")));
  scrim.addEventListener("click", () => drawer(false));

  /* ———— global keys, outside clicks ———— */
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (P.mode) { finish(true); return; }
      if (popFor) { closePop(); return; }
      if (side.classList.contains("open")) { drawer(false); return; }
    }
    if (e.target.closest("input, textarea, #pop") || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "ArrowLeft" && !e.target.closest("#mini, #views")) { e.preventDefault(); step(-1); }
    else if (e.key === "ArrowRight" && !e.target.closest("#mini, #views")) { e.preventDefault(); step(1); }
    else if (e.key === "t" || e.key === "T") $("#todayBtn").click();
    else if (e.key === "n" || e.key === "N") { e.preventDefault(); newEvent(); }
  });
  document.addEventListener("pointerdown", (e) => {
    if (popFor && !pop.contains(e.target) && !e.target.closest(".ev, .bar-ev, .mchip, .ag button")) closePop(true);
  });
  addEventListener("resize", () => {
    clearTimeout(P.rz); P.rz = setTimeout(() => { const h = hourH(); if (h !== H || (st.view === "week" && (phone() ? 3 : 7) !== $$(".day", view).length)) { H = h; render(0); } views(); place(); }, 80);
  });
  document.addEventListener("scroll", () => place(), true);

  const sayEl = $("#say");
  function say(t) { sayEl.textContent = ""; setTimeout(() => { sayEl.textContent = t; }, 30); }

  /* the hour height grows on tall screens so the day fills the frame */
  function hourH() { const avail = innerHeight - (phone() ? 120 : 64) - 24 - 100; return Math.round(Math.max(phone() ? 52 : 56, Math.min(112, avail / 13.5))); }
  H = hourH();
  render(0);
  views();
})();
</script>
</body>
</html>
