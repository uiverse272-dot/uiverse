<!doctype html>
<!-- Weather widget — Uiverse Originals. Free to use and adapt (MIT). One file, no dependencies. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weather widget</title>
<style>
  :root { --ink: #0f172a; --soft: rgba(15, 23, 42, .55); }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    display: grid; place-items: center;
    font: 500 14px/1.3 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(120% 90% at 20% 10%, #c7e3ff 0%, #e9e4ff 45%, #ffe8d6 100%);
    color: var(--ink);
  }
  .card {
    position: relative; width: 300px; padding: 22px; border-radius: 28px;
    background: linear-gradient(160deg, rgba(255,255,255,.75), rgba(255,255,255,.35));
    border: 1px solid rgba(255,255,255,.8);
    box-shadow: 0 30px 60px -20px rgba(60, 70, 140, .35), inset 0 1px 0 #fff;
    backdrop-filter: blur(18px);
    overflow: hidden; cursor: pointer; outline: none;
    transition: transform .5s cubic-bezier(.2,.8,.2,1), box-shadow .5s;
  }
  .card:hover, .card:focus-visible { transform: translateY(-4px); box-shadow: 0 40px 70px -24px rgba(60, 70, 140, .45), inset 0 1px 0 #fff; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .city { font-size: 15px; font-weight: 650; }
  .when { color: var(--soft); font-size: 12.5px; margin-top: 2px; }
  .temp { font-size: 76px; font-weight: 300; letter-spacing: -.06em; line-height: 1; margin-top: 18px; }
  .temp sup { font-size: 30px; vertical-align: 38px; letter-spacing: 0; margin-left: 2px; }
  .cond { color: var(--soft); margin-top: 6px; }

  /* the sky: a sun behind a drifting cloud */
  .sky { position: relative; width: 92px; height: 72px; }
  .sun {
    position: absolute; right: 8px; top: 2px; width: 46px; height: 46px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff3b0, #ffc93c 55%, #ff9d2e);
    box-shadow: 0 0 0 8px rgba(255, 201, 60, .18), 0 0 40px rgba(255, 170, 40, .6);
    animation: glow 4s ease-in-out infinite;
  }
  .cloud {
    position: absolute; left: 4px; bottom: 6px; width: 64px; height: 26px; border-radius: 20px;
    background: linear-gradient(#fff, #e8eefc); box-shadow: 0 8px 18px -6px rgba(70, 90, 160, .35);
    animation: drift 6s ease-in-out infinite;
  }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: inherit; border-radius: 50%; }
  .cloud::before { width: 30px; height: 30px; left: 10px; top: -15px; }
  .cloud::after { width: 22px; height: 22px; left: 32px; top: -9px; }
  @keyframes glow { 50% { box-shadow: 0 0 0 12px rgba(255, 201, 60, .12), 0 0 56px rgba(255, 170, 40, .75); } }
  @keyframes drift { 50% { transform: translateX(10px); } }

  /* hourly forecast slides up on hover or focus */
  .hours {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
    margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(15, 23, 42, .08);
  }
  .h {
    display: grid; justify-items: center; gap: 6px; padding: 8px 0; border-radius: 14px;
    opacity: 0; transform: translateY(14px);
    transition: opacity .4s, transform .5s cubic-bezier(.2,.8,.2,1), background .2s;
  }
  .card:hover .h, .card:focus-visible .h, .card.open .h { opacity: 1; transform: none; }
  .h:hover { background: rgba(255,255,255,.6); }
  .h b { font-weight: 650; }
  .h small { color: var(--soft); font-size: 11.5px; }
  .dot { width: 18px; height: 18px; border-radius: 50%; }
  .dot.sun { position: static; width: 18px; height: 18px; box-shadow: 0 0 10px rgba(255, 170, 40, .6); animation: none; }
  .dot.cl { background: linear-gradient(#fff, #d9e2f7); box-shadow: inset 0 -2px 0 rgba(70, 90, 160, .15); }
  .dot.rn { background: linear-gradient(#9ec5ff, #5a8dee); border-radius: 50% 50% 50% 0; transform: rotate(-45deg) scale(.85); }
  .hint { position: absolute; right: 18px; bottom: 12px; font-size: 11px; color: var(--soft); transition: opacity .3s; }
  .card:hover .hint, .card:focus-visible .hint, .card.open .hint { opacity: 0; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
  <div class="card" tabindex="0" role="group" aria-label="Weather in Riyadh">
    <div class="top">
      <div>
        <div class="city">Riyadh</div>
        <div class="when">Thursday · 14:20</div>
      </div>
      <div class="sky" aria-hidden="true"><span class="sun"></span><span class="cloud"></span></div>
    </div>
    <div class="temp">31<sup>°</sup></div>
    <div class="cond">Mostly sunny · H 34° L 22°</div>
    <div class="hours">
      <div class="h" style="transition-delay:.00s"><small>15</small><span class="dot sun"></span><b>32°</b></div>
      <div class="h" style="transition-delay:.04s"><small>16</small><span class="dot sun"></span><b>33°</b></div>
      <div class="h" style="transition-delay:.08s"><small>17</small><span class="dot cl"></span><b>31°</b></div>
      <div class="h" style="transition-delay:.12s"><small>18</small><span class="dot cl"></span><b>28°</b></div>
      <div class="h" style="transition-delay:.16s"><small>19</small><span class="dot rn"></span><b>25°</b></div>
    </div>
    <span class="hint">Hover for hourly</span>
  </div>
<script>
  /* touch screens have no hover: a tap toggles the forecast */
  const card = document.querySelector(".card");
  card.addEventListener("click", () => card.classList.toggle("open"));
  card.addEventListener("keydown", (e) => (e.key === "Enter" || e.key === " ") && (e.preventDefault(), card.classList.toggle("open")));
</script>
</body>
</html>
