<!doctype html>
<!-- One-time code input — Uiverse Originals. Free to use and adapt (MIT). One file, no dependencies.
     One real input (so paste, autofill and screen readers just work) drawn as six boxes. Try 482190. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>One-time code input</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    display: grid; place-items: center;
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #fbfaf8; color: #1d1b16;
  }
  .box { width: 360px; text-align: center; }
  h1 { font-size: 20px; font-weight: 650; letter-spacing: -.02em; }
  p { color: #78736a; margin-top: 6px; }
  p b { color: #1d1b16; font-weight: 600; }
  .otp { position: relative; margin: 26px auto 0; width: max-content; }
  .otp input {
    position: absolute; inset: 0; width: 100%; opacity: 0; border: 0; font-size: 16px; caret-color: transparent;
    letter-spacing: 2.4em; cursor: text;
  }
  .slots { display: flex; gap: 10px; pointer-events: none; }
  .slot {
    position: relative; width: 50px; height: 60px; border-radius: 12px; display: grid; place-items: center;
    font: 600 24px ui-monospace, "SF Mono", Menlo, monospace;
    background: #fff; border: 1.5px solid #e6e2d9; transition: border-color .15s, box-shadow .15s, transform .2s;
  }
  .slot.on { border-color: #1d1b16; box-shadow: 0 0 0 4px rgba(29,27,22,.08); }
  .slot.on:empty::after { content: ""; width: 2px; height: 24px; background: #1d1b16; animation: blink 1s steps(1) infinite; }
  .slot.pop { animation: pop .18s ease-out; }
  .slot:nth-child(3) { margin-right: 14px; }
  .slot:nth-child(3)::before { content: ""; position: absolute; right: -15px; width: 8px; height: 2px; background: #cfc9bc; border-radius: 2px; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pop { 50% { transform: scale(1.08); } }
  .ok .slot { border-color: #16a34a; background: #f0fdf4; color: #15803d; animation: wave .5s calc(var(--i) * 50ms) ease-out both; }
  .bad .slots { animation: shake .4s; }
  .bad .slot { border-color: #dc2626; color: #dc2626; }
  @keyframes wave { 40% { transform: translateY(-6px); } }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  .msg { height: 20px; margin-top: 16px; font-size: 13px; color: #78736a; }
  .ok + .msg { color: #15803d; } .bad + .msg { color: #dc2626; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
  <div class="box">
    <h1>Check your phone</h1>
    <p>We sent a code to <b>+966 5• ••• 4471</b></p>
    <div class="otp">
      <input inputmode="numeric" autocomplete="one-time-code" maxlength="6" aria-label="6-digit code" aria-describedby="msg">
      <div class="slots" aria-hidden="true"></div>
    </div>
    <div class="msg" id="msg" aria-live="polite">Hint: the code is 482190</div>
  </div>
<script>
  const input = document.querySelector("input"), slots = document.querySelector(".slots"), otp = document.querySelector(".otp"), msg = document.querySelector(".msg");
  for (let i = 0; i < 6; i++) { const s = document.createElement("div"); s.className = "slot"; s.style.setProperty("--i", i); slots.append(s); }
  let prev = "";
  const draw = () => {
    const v = input.value.replace(/\D/g, "").slice(0, 6);
    if (v !== input.value) input.value = v;
    const focused = document.activeElement === input;
    [...slots.children].forEach((s, i) => {
      s.textContent = v[i] ?? "";
      s.classList.toggle("on", focused && i === Math.min(v.length, 5));
      if (v.length > prev.length && i === v.length - 1) { s.classList.remove("pop"); void s.offsetWidth; s.classList.add("pop"); }
    });
    otp.classList.remove("ok", "bad");
    if (v.length === 6) {
      const good = v === "482190";
      void otp.offsetWidth; otp.classList.add(good ? "ok" : "bad");
      msg.textContent = good ? "Verified. Signing you in…" : "That code didn't match. Try again.";
      if (!good) setTimeout(() => { input.value = ""; draw(); }, 700);
    } else if (prev.length === 6 || !v.length) msg.textContent = "Hint: the code is 482190";
    prev = v;
  };
  ["input", "focus", "blur", "keyup", "click"].forEach((e) => input.addEventListener(e, draw));
  draw();
  input.focus();
</script>
</body>
</html>
