<!doctype html>
<!-- Skeleton to content — Uiverse Originals. Free to use and adapt (MIT). One file, no dependencies.
     A shimmering placeholder in the exact shape of the card, then each piece fades in where its bone was. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skeleton to content</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    display: grid; place-items: center; align-content: center; gap: 18px;
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f5f5f4; color: #1c1917;
  }
  .card { width: 340px; border-radius: 18px; background: #fff; border: 1px solid #e7e5e4; overflow: hidden; box-shadow: 0 20px 40px -28px rgba(0,0,0,.3); }
  .media { height: 170px; position: relative; }
  .media .real { position: absolute; inset: 0; background:
      radial-gradient(60% 80% at 30% 20%, #fde68a, transparent 60%),
      radial-gradient(60% 80% at 80% 70%, #fb923c, transparent 60%),
      linear-gradient(135deg, #f97316, #be123c); }
  .media .real::after { content: ""; position: absolute; left: 50%; top: 55%; width: 120px; height: 120px; margin: -60px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff7ed, #fdba74); box-shadow: 0 0 60px #fff7ed; }
  .body { padding: 16px 18px 18px; display: grid; gap: 10px; }
  .who { display: flex; gap: 10px; align-items: center; }
  .av { width: 34px; height: 34px; border-radius: 50%; flex: none; position: relative; overflow: hidden; }
  .av .real { position: absolute; inset: 0; background: linear-gradient(135deg, #a78bfa, #6366f1); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
  .slot { position: relative; border-radius: 6px; }
  .slot .real { transition: opacity .5s, transform .5s cubic-bezier(.2,.8,.2,1); }
  .name { font-weight: 650; } .time { color: #78716c; font-size: 12px; }
  .title { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
  .text { color: #57534e; }
  .tags { display: flex; gap: 6px; }
  .tags span { font-size: 11.5px; padding: 3px 9px; border-radius: 99px; background: #f5f5f4; color: #57534e; }

  /* the bone: same box as the content, shimmer swept across */
  .bone {
    position: absolute; inset: 0; border-radius: inherit; background: #ecebea; overflow: hidden;
    transition: opacity .4s;
  }
  .bone::after {
    content: ""; position: absolute; inset: 0; transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.75), transparent);
    animation: sweep 1.3s ease-in-out infinite;
  }
  @keyframes sweep { to { transform: translateX(100%); } }
  .loading .real { opacity: 0; transform: translateY(4px); }
  .loaded .bone { opacity: 0; }
  .loaded .slot:nth-of-type(n) .real { transition-delay: var(--d, 0s); }
  .media .bone { border-radius: 0; }
  .text .bone { background: linear-gradient(#ecebea 0 40%, transparent 40% 60%, #ecebea 60% 100%); }
  .text .bone::after { display: none; }
  button { font: inherit; font-size: 13px; font-weight: 600; height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid #d6d3d1; background: #fff; cursor: pointer; }
  button:focus-visible { outline: 2px solid #6366f1; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .bone::after { animation: none; } * { transition: none !important; } }
</style>
</head>
<body>
  <article class="card loading" aria-busy="true">
    <div class="media slot"><div class="real" style="--d:.0s"></div><div class="bone"></div></div>
    <div class="body">
      <div class="who">
        <div class="av slot"><div class="real" style="--d:.05s">NA</div><div class="bone"></div></div>
        <div style="display:grid;gap:4px;flex:1">
          <div class="slot" style="width:120px"><div class="real name" style="--d:.1s">Noura Alsaud</div><div class="bone"></div></div>
          <div class="slot" style="width:70px"><div class="real time" style="--d:.12s">2 hours ago</div><div class="bone"></div></div>
        </div>
      </div>
      <div class="slot"><div class="real title" style="--d:.18s">Golden hour over the Edge of the World</div><div class="bone"></div></div>
      <div class="slot text"><div class="real" style="--d:.24s">An hour from Riyadh, the escarpment drops 300 metres to the plain. Go an hour before sunset.</div><div class="bone"></div></div>
      <div class="slot" style="width:190px"><div class="real tags" style="--d:.3s"><span>Travel</span><span>Riyadh</span><span>Hiking</span></div><div class="bone"></div></div>
    </div>
  </article>
  <button type="button">Reload</button>
<script>
  const card = document.querySelector(".card");
  function load() {
    card.classList.add("loading"); card.classList.remove("loaded"); card.setAttribute("aria-busy", "true");
    setTimeout(() => { card.classList.replace("loading", "loaded"); card.setAttribute("aria-busy", "false"); }, 2200);
  }
  document.querySelector("button").onclick = load;
  load();
</script>
</body>
</html>
