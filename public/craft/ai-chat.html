<!doctype html>
<!-- AI chat — Uiverse Originals. Free to use and adapt (MIT). One file, no dependencies.
     A chat screen for an assistant called Marlo: history you can search, a thread with rendered markdown
     (lists, tables, highlighted code with copy), and a composer that attaches files, picks a model, thinks,
     streams its answer word by word, stops on request, and takes feedback. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marlo — Slow orders dashboard query</title>
<style>
  :root {
    --bg: #fbfcfe; --side: #f2f5f9; --card: #ffffff; --tint: #edf1f6; --line: #dfe5ed; --line2: #e9edf3;
    --ink: #0e1626; --soft: #364154; --muted: #5a6476; --faint: #8a93a3;
    --lime: #c8f051; --lime-soft: #eef9cf; --code: #0f1828; --warn: #b4321f;
    --r: 8px; --ease: cubic-bezier(.2, .7, .2, 1);
    --sans: "Avenir Next", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  html { background: var(--bg); }
  body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; overflow: hidden; }
  button, input, textarea { font: inherit; color: inherit; }
  button { border: 0; background: none; cursor: pointer; }
  button:disabled { cursor: default; }
  ul, ol { list-style: none; }
  svg { display: block; flex: none; }
  .ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .ico.s { width: 16px; height: 16px; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 6px; }
  .sr { position: absolute; top: 0; left: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .app { display: grid; grid-template-columns: 276px minmax(0, 1fr); height: 100svh; }

  /* ---------- sidebar ---------- */
  .side { display: flex; flex-direction: column; min-height: 0; background: var(--side); border-right: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 16px 0 20px; }
  .brand b { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
  .mk { width: 28px; height: 28px; }
  .brand .ib { margin-left: auto; display: none; }
  .ib { display: grid; place-items: center; width: 32px; height: 32px; border-radius: var(--r); color: var(--soft); transition: background-color .15s, color .15s; }
  .ib:hover { background: rgba(14, 22, 38, .06); color: var(--ink); }
  .newc { display: flex; align-items: center; gap: 10px; margin: 4px 12px 8px; height: 40px; padding: 0 12px; border-radius: var(--r); background: var(--card); border: 1px solid var(--line); font-weight: 600; box-shadow: 0 1px 0 rgba(14, 22, 38, .04); transition: border-color .15s, background-color .15s; }
  .newc:hover { border-color: #c5cdd9; }
  .newc kbd { margin-left: auto; font: 500 11px var(--mono); color: var(--muted); }
  .search { position: relative; margin: 0 12px 8px; }
  .search .ico { position: absolute; left: 11px; top: 11px; color: var(--muted); pointer-events: none; }
  .search input { width: 100%; height: 38px; padding: 0 10px 0 36px; border: 1px solid transparent; border-radius: var(--r); background: rgba(14, 22, 38, .045); outline: 0; transition: border-color .15s, background-color .15s; }
  .search input::placeholder { color: var(--muted); }
  .search input:focus { background: var(--card); border-color: #b9c3d1; }
  .search input:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
  .search input::-webkit-search-cancel-button { display: none; }
  .hist { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 12px 24px; -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 32px), transparent); scrollbar-width: thin; scrollbar-color: #cbd3de transparent; }
  .hist h2 { padding: 14px 10px 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .hist h2:first-child { padding-top: 6px; }
  .hist a { display: block; padding: 7px 10px; border-radius: var(--r); color: var(--soft); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background-color .15s, color .15s; }
  .hist a:hover { background: rgba(14, 22, 38, .05); color: var(--ink); }
  .hist a[aria-current] { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(14, 22, 38, .05); }
  .hist mark { background: var(--lime); color: var(--ink); border-radius: 2px; }
  .hist .none { padding: 12px 10px; color: var(--muted); }
  .me { border-top: 1px solid var(--line); padding: 8px 12px 12px; }
  .wsw { position: relative; }
  .wsb { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; border-radius: var(--r); text-align: left; transition: background-color .15s; }
  .wsb:hover, .wsb[aria-expanded="true"] { background: rgba(14, 22, 38, .05); }
  .sq { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; background: var(--ink); color: var(--lime); font-weight: 700; font-size: 13px; flex: none; }
  .two { min-width: 0; flex: 1; }
  .two b { display: block; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .two small { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user { display: flex; align-items: center; gap: 10px; padding: 8px; }
  .av { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: #dfe7f1; color: #23324a; font-size: 12px; font-weight: 700; flex: none; }

  /* menus (workspace, model) */
  .menu { position: absolute; z-index: 30; min-width: 100%; padding: 6px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); box-shadow: 0 12px 32px rgba(14, 22, 38, .12), 0 2px 6px rgba(14, 22, 38, .06); opacity: 0; transform: translateY(4px); pointer-events: none; visibility: hidden; transition: opacity .16s var(--ease), transform .16s var(--ease), visibility 0s .16s; }
  .menu.on { opacity: 1; transform: none; pointer-events: auto; visibility: visible; transition: opacity .16s var(--ease), transform .16s var(--ease); }
  .menu [role="menuitemradio"], .menu [role="option"] { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; border-radius: 6px; text-align: left; cursor: pointer; }
  .menu [role="menuitemradio"]:hover, .menu [role="option"]:hover, .menu .act { background: var(--tint); }
  .menu .tick { margin-left: auto; color: var(--ink); visibility: hidden; }
  .menu [aria-checked="true"] .tick, .menu [aria-selected="true"] .tick { visibility: visible; }
  .menu .lbl { padding: 6px 8px 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .wsw .menu { bottom: calc(100% + 6px); left: 0; }

  /* ---------- main ---------- */
  .main { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .top { display: flex; align-items: center; gap: 8px; height: 60px; padding: 0 20px 0 28px; border-bottom: 1px solid var(--line2); flex: none; }
  .top h1 { min-width: 0; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top .mn, .top .nc { display: none; }
  .top .sp { flex: 1; }
  .ghost { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--card); font-size: 13px; font-weight: 600; color: var(--soft); transition: border-color .15s, color .15s; white-space: nowrap; }
  .ghost:hover { border-color: #c5cdd9; color: var(--ink); }
  .scroll { position: relative; flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; scrollbar-color: #cbd3de transparent; }
  .thread { max-width: 776px; margin: 0 auto; padding: 32px 28px 24px; display: flex; flex-direction: column; min-height: 100%; }
  .thread > :first-child { margin-top: auto; }

  .msg { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 16px; padding: 4px 0 28px; }
  .msg .who { padding-top: 2px; }
  .msg .who .mk { width: 32px; height: 32px; }
  .head { display: flex; align-items: baseline; gap: 8px; height: 22px; margin-bottom: 6px; font-size: 13px; color: var(--muted); }
  .head b { font-size: 14px; font-weight: 600; color: var(--ink); }
  .head .stopped { color: var(--warn); font-weight: 600; }
  .user-t { padding: 12px 16px; border-radius: 10px; background: var(--tint); font-size: 15px; line-height: 1.6; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.in { animation: rise .26s var(--ease) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }

  .files { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .fc { display: inline-flex; align-items: center; gap: 10px; max-width: 100%; height: 44px; padding: 0 8px 0 6px; border-radius: var(--r); background: var(--card); border: 1px solid var(--line); }
  .fc .ext { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 6px; background: var(--ink); color: var(--lime); font: 700 9.5px var(--mono); letter-spacing: .02em; text-transform: uppercase; flex: none; }
  .fc .two b { font-size: 13px; }
  .fc .two small { font-size: 11.5px; }
  .fc .x { width: 26px; height: 26px; }
  .msg .fc { padding-right: 12px; }
  .chips .fc { animation: rise .2s var(--ease) both; }

  /* rendered markdown */
  .md { font-size: 15px; line-height: 1.65; color: #1b2436; overflow-wrap: break-word; }
  .md > * + * { margin-top: 12px; }
  .md p { max-width: 68ch; }
  .md strong { font-weight: 600; color: var(--ink); }
  .md h3 { margin-top: 20px; font-size: 15px; font-weight: 700; color: var(--ink); }
  .md ul, .md ol { padding-left: 22px; }
  .md ul { list-style: none; }
  .md ul > li { position: relative; }
  .md ul > li::before { content: ""; position: absolute; left: -15px; top: .72em; width: 5px; height: 5px; border-radius: 1px; background: var(--ink); }
  .md ol { list-style: decimal; }
  .md ol > li::marker { font-weight: 600; color: var(--muted); font-size: 14px; }
  .md li + li { margin-top: 6px; }
  .md :not(pre) > code { padding: 1px 5px; border-radius: 4px; background: var(--tint); border: 1px solid var(--line2); font: 13px/1 var(--mono); color: var(--ink); white-space: nowrap; }
  .code { border-radius: 10px; background: var(--code); color: #dbe3ef; overflow: hidden; }
  .code-h { display: flex; align-items: center; justify-content: space-between; height: 38px; padding: 0 8px 0 16px; border-bottom: 1px solid rgba(255, 255, 255, .08); font: 12px var(--mono); color: #9aa7ba; }
  .code-h button { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: 6px; font: 600 12px var(--sans); color: #c8d2e0; transition: background-color .15s, color .15s; }
  .code-h button:hover { background: rgba(255, 255, 255, .08); color: #fff; }
  .code-h button:focus-visible { outline-color: var(--lime); }
  .code-h button.ok { color: var(--lime); }
  .code pre { margin: 0; padding: 14px 16px 16px; overflow-x: auto; font: 13px/1.65 var(--mono); tab-size: 2; scrollbar-width: thin; scrollbar-color: #33405a transparent; }
  .code .k { color: var(--lime); }
  .code .s { color: #f4cf9c; }
  .code .c { color: #8291a7; font-style: italic; }
  .code .n { color: #9fd2ff; }
  .tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
  .md table { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 1.45; }
  .md th { padding: 10px 14px; text-align: left; font-size: 12.5px; font-weight: 600; color: var(--muted); background: #f5f7fa; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .md td { padding: 10px 14px; border-top: 1px solid var(--line2); vertical-align: top; }
  .md tr:first-child td { border-top: 0; }
  .md td.num, .md th.num { text-align: right; white-space: nowrap; }
  .md tr.pick td { background: var(--lime-soft); }
  .md tr.pick td:first-child { box-shadow: inset 3px 0 0 var(--ink); }
  .md .nil { color: var(--muted); }
  .caret { display: inline-block; width: 8px; height: 1.05em; margin-left: 2px; vertical-align: -2px; background: var(--ink); border-radius: 1px; animation: blink 1s steps(2, start) infinite; }
  .code .caret { background: var(--lime); }
  @keyframes blink { to { visibility: hidden; } }

  .think { display: flex; align-items: center; gap: 10px; height: 26px; font-size: 14px; color: var(--muted); }
  .bars { display: inline-flex; align-items: flex-end; gap: 3px; height: 14px; }
  .bars i { width: 3px; height: 100%; border-radius: 1px; background: var(--ink); transform-origin: bottom; animation: bar 1s var(--ease) infinite; }
  .bars i:nth-child(2) { animation-delay: .15s; }
  .bars i:nth-child(3) { animation-delay: .3s; }
  @keyframes bar { 0%, 100% { transform: scaleY(.3); } 40% { transform: scaleY(1); } }

  .acts { display: flex; align-items: center; gap: 2px; margin-top: 12px; margin-left: -8px; }
  .acts button { display: grid; place-items: center; width: 32px; height: 32px; border-radius: var(--r); color: var(--muted); transition: background-color .15s, color .15s; }
  .acts button:hover { background: var(--tint); color: var(--ink); }
  .acts button[aria-pressed="true"] { color: var(--ink); background: var(--lime-soft); }
  .acts button[aria-pressed="true"] .ico { fill: var(--lime); }
  .acts .tip { margin-left: 6px; font-size: 12.5px; color: var(--muted); opacity: 0; transition: opacity .2s; }
  .acts .tip.on { opacity: 1; }
  .fb { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .fb button { height: 30px; padding: 0 12px; border-radius: 15px; border: 1px solid var(--line); background: var(--card); font-size: 13px; font-weight: 500; color: var(--soft); transition: border-color .15s, color .15s; }
  .fb button:hover { border-color: #b9c3d1; color: var(--ink); }
  .fu { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .fu button { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 6px 14px 6px 10px; border-radius: var(--r); border: 1px solid var(--line); background: var(--card); font-size: 14px; font-weight: 500; color: var(--soft); text-align: left; transition: border-color .15s, color .15s, transform .15s var(--ease); }
  .fu button:hover { border-color: #b3bdcc; color: var(--ink); }
  .fu button .ico { color: var(--muted); }

  /* empty state */
  .empty { margin: auto 0; padding: 24px 0 40px; }
  .empty .mk { width: 44px; height: 44px; }
  .empty h2 { margin-top: 20px; font-size: 28px; line-height: 1.2; font-weight: 600; letter-spacing: -.02em; }
  .empty p { margin-top: 8px; max-width: 52ch; font-size: 15px; color: var(--muted); }
  .sugg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 28px; }
  .sugg button { display: grid; grid-template-columns: 20px 1fr; align-content: start; gap: 4px 12px; padding: 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); text-align: left; transition: border-color .15s, box-shadow .15s, transform .15s var(--ease); }
  .sugg button:hover { border-color: #b3bdcc; box-shadow: 0 2px 8px rgba(14, 22, 38, .06); }
  .sugg button:active { transform: scale(.99); }
  .sugg .ico { grid-row: span 2; margin-top: 1px; color: var(--ink); }
  .sugg b { font-size: 14px; font-weight: 600; }
  .sugg span { font-size: 13px; color: var(--muted); line-height: 1.45; }

  .jump { position: absolute; left: 50%; bottom: 168px; z-index: 5; display: grid; place-items: center; width: 36px; height: 36px; margin-left: -18px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); box-shadow: 0 4px 12px rgba(14, 22, 38, .1); color: var(--ink); opacity: 0; transform: translateY(6px); pointer-events: none; transition: opacity .18s var(--ease), transform .18s var(--ease); }
  .jump.on { opacity: 1; transform: none; pointer-events: auto; }

  /* composer */
  .dock { flex: none; padding: 0 28px 16px; }
  .composer { max-width: 720px; margin: 0 auto; }
  .box { border: 1px solid #ccd4df; border-radius: 14px; background: var(--card); box-shadow: 0 1px 2px rgba(14, 22, 38, .04), 0 6px 20px rgba(14, 22, 38, .05); transition: border-color .15s, box-shadow .15s; }
  .box:focus-within { border-color: #8f9bad; box-shadow: 0 0 0 3px rgba(14, 22, 38, .06), 0 6px 20px rgba(14, 22, 38, .06); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 10px 0; }
  .chips:empty { display: none; }
  .box textarea { display: block; width: 100%; min-height: 52px; max-height: 220px; padding: 14px 16px 6px; border: 0; outline: 0; resize: none; background: transparent; font-size: 15px; line-height: 1.55; color: var(--ink); overflow-y: auto; scrollbar-width: thin; }
  .box textarea::placeholder { color: #6f7888; }
  .row { display: flex; align-items: center; gap: 4px; padding: 6px 8px 8px; }
  .row .ib:disabled { opacity: .45; }
  .mdw { position: relative; }
  .mdb { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 8px 0 10px; border-radius: var(--r); font-size: 13px; font-weight: 600; color: var(--soft); transition: background-color .15s, color .15s; }
  .mdb:hover, .mdb[aria-expanded="true"] { background: var(--tint); color: var(--ink); }
  .mdw .menu { bottom: calc(100% + 8px); left: 0; width: 280px; }
  .mdw .menu .two b { font-size: 14px; }
  .mdw .menu .two small { white-space: normal; }
  .row .hint { margin-left: auto; margin-right: 8px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .send { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: var(--ink); color: var(--lime); transition: background-color .15s, color .15s, transform .12s var(--ease); }
  .send:hover:not(:disabled) { background: #1e2a40; }
  .send:active:not(:disabled) { transform: scale(.94); }
  .send:disabled { background: #e3e8ef; color: #8a93a3; }
  .send .ico { stroke-width: 2.2; }
  .send .sq2 { display: none; width: 12px; height: 12px; border-radius: 2px; background: var(--lime); }
  .send.stop .sq2 { display: block; }
  .send.stop .ico { display: none; }
  .note { margin-top: 8px; text-align: center; font-size: 12px; color: var(--muted); }

  .scrim { display: none; }
  .toast { position: fixed; left: 50%; bottom: 24px; z-index: 50; padding: 10px 14px; border-radius: 10px; background: var(--ink); color: #fff; font-size: 13px; font-weight: 500; transform: translate(-50%, 12px); opacity: 0; pointer-events: none; transition: opacity .2s var(--ease), transform .2s var(--ease); }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 960px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .side { position: fixed; z-index: 40; inset: 0 auto 0 0; width: 300px; max-width: 86vw; transform: translateX(-102%); visibility: hidden; transition: transform .26s var(--ease), visibility 0s .26s; box-shadow: 0 0 0 1px var(--line), 12px 0 40px rgba(14, 22, 38, .14); }
    .side.open { transform: none; visibility: visible; transition: transform .26s var(--ease); }
    .brand .ib { display: grid; }
    .scrim { display: block; position: fixed; inset: 0; z-index: 35; background: rgba(14, 22, 38, .32); opacity: 0; pointer-events: none; transition: opacity .2s; }
    .scrim.on { opacity: 1; pointer-events: auto; }
    .top { padding: 0 12px; }
    .top .mn, .top .nc { display: grid; }
  }
  @media (max-width: 600px) {
    .top .ghost span { display: none; }
    .top .ghost { width: 34px; padding: 0; justify-content: center; }
    .thread { padding: 20px 16px 16px; }
    .msg { grid-template-columns: minmax(0, 1fr); gap: 8px; }
    .msg .who { display: flex; align-items: center; gap: 8px; padding: 0; }
    .msg .who .mk, .msg .who .av { width: 24px; height: 24px; font-size: 10px; }
    .msg .head { position: absolute; }
    .msg { position: relative; }
    .msg .head { top: 4px; left: 32px; }
    .md, .user-t { font-size: 15px; }
    .sugg { grid-template-columns: minmax(0, 1fr); }
    .empty h2 { font-size: 24px; }
    .dock { padding: 0 12px 12px; }
    .row .hint { display: none; }
    .row .sp2 { flex: 1; }
    .jump { bottom: 150px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mk" viewBox="0 0 28 28"><rect width="28" height="28" rx="8" fill="#0e1626"/><path d="M7 17.5l3.5-7 3.5 7 3.5-7 3.5 7" fill="none" stroke="#c8f051" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>

  A.regex = ["Explain this regex: ^(?=.*\\d)(?=.*[A-Z])[A-Za-z\\d@$!%*?&]{10,}$",
`It's a password rule. Read it left to right:

| Part | Meaning |
|---|---|
| \`^\` … \`$\` | Match the whole string, not just part of it |
| \`(?=.*\\d)\` | Somewhere ahead there is at least one digit |
| \`(?=.*[A-Z])\` | …and at least one capital letter |
| \`[A-Za-z\\d@$!%*?&]\` | Only letters, digits and these symbols are allowed |
| \`{10,}\` | At least 10 characters, no upper limit |

So \`Harbour2026\` passes, while \`harbour2026\` fails (no capital) and \`Harbour 2026!\` fails (spaces aren't allowed).

Two things worth knowing:

1. The lookaheads \`(?=…)\` check a condition **without consuming characters**, which is why they can be stacked at the start.
2. It rejects common symbols like \`#\` and \`-\`, which frustrates people using password managers. A looser version:

\`\`\`js
// at least one digit, one capital, 10+ of anything
const strong = /^(?=.*\\d)(?=.*[A-Z]).{10,}$/;
strong.test("Harbour-2026#"); // true
\`\`\``];

- Tram 1 along the Douro to **Foz do Douro**.

  A.migration = ["Write the migration with a rollback",
`Here's a migration you can drop into your tool of choice. \`CONCURRENTLY\` can't run inside a transaction, so each step stands alone:

\`\`\`sql
-- up
CREATE INDEX CONCURRENTLY IF NOT EXISTS orders_open_created_idx
  ON orders (region_id, created_at DESC)
  WHERE status = 'open';
ANALYZE orders;

-- down
DROP INDEX CONCURRENTLY IF EXISTS orders_open_created_idx;
\`\`\`

- If the build is interrupted it leaves an **invalid** index behind; the \`down\` step cleans it up.
- On 38M rows expect the build to take **4–8 minutes**. Inserts keep working while it runs.`];
  A.concurrently = ["What does CONCURRENTLY cost me?",
`It trades build speed for availability:

| | Plain build | Concurrent build |
|---|---|---|
| Blocks writes | For the whole build | No |
| Passes over the table | 1 | 2 |
| Build time on 38M rows | ~3 min | ~6 min |
| Runs inside a transaction | Yes | No |

On a live orders table the extra few minutes are almost always worth it.`];

    { id: "crdt", g: 2, title: "CRDTs, explained simply", msgs: [u("Explain CRDTs like I'm a designer, not an engineer.", "18:31"), a(`Imagine two people editing the same shopping list on their phones while offline. When the phones reconnect, both lists need to end up identical without asking anyone which version wins.

A **CRDT** (conflict-free replicated data type) stores data so that merging always works:

      if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); act = (act + (e.key === "ArrowDown" ? 1 : n - 1)) % n; mark(); if (list.getAttribute("role") !== "listbox") els()[act].focus(); }
      else if (e.key === "Home" || e.key === "End") { e.preventDefault(); act = e.key === "Home" ? 0 : n - 1; mark(); if (list.getAttribute("role") !== "listbox") els()[act].focus(); }
      else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onPick(act); hide(true); }
      else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); hide(true); }
      else if (e.key === "Tab") hide(false);
    });
    document.addEventListener("pointerdown", (e) => { if (open && !list.contains(e.target) && !btn.contains(e.target)) hide(false); });
    return { hide };
  }
  const mdList = $("#mdList");
  const drawModels = () => { mdList.innerHTML = MODELS.map((m, i) => '<li role="option" id="md' + i + '" aria-selected="' + (i === model) + '"><span class="two"><b>' + m[0] + "</b><small>" + m[1] + "</small></span>" + ico("check", "s tick") + "</li>").join(""); };
  drawModels();
  popup($("#mdBtn"), mdList, MODELS, (i) => { model = i; $("#mdName").textContent = MODELS[i][0]; drawModels(); say("Model: " + MODELS[i][0] + "."); }, () => model);
  const WS = [["H", "Harbourline", "Team · 14 members"], ["T", "Tidewater Labs", "Team · 6 members"], ["A", "Amara Okafor", "Personal"]];
  let ws = 0;
  const wsMenu = $("#wsMenu");
  const drawWs = () => { wsMenu.innerHTML = '<div class="lbl" aria-hidden="true">Workspaces</div>' + WS.map((w, i) => '<button type="button" role="menuitemradio" tabindex="-1" aria-checked="' + (i === ws) + '"><span class="sq">' + w[0] + '</span><span class="two"><b>' + w[1] + "</b><small>" + w[2] + "</small></span>" + ico("check", "s tick") + "</button>").join(""); };
  drawWs();
  popup($("#wsBtn"), wsMenu, WS, (i) => { ws = i; $("#wsSq").textContent = WS[i][0]; $("#wsName").textContent = WS[i][1]; $("#wsSub").textContent = WS[i][2]; drawWs(); say("Switched to " + WS[i][1] + "."); }, () => ws);

  /* ---------- drawer (narrow screens) ---------- */
  const side = $("#side"), scrim = $("#scrim"), openBtn = $("#openSide");
  const drawer = () => matchMedia("(max-width: 960px)").matches;
  function openSide() { side.classList.add("open"); scrim.classList.add("on"); openBtn.setAttribute("aria-expanded", "true"); setTimeout(() => $("#newChat").focus(), 30); }
  function closeSide(back) { if (!side.classList.contains("open")) return; side.classList.remove("open"); scrim.classList.remove("on"); openBtn.setAttribute("aria-expanded", "false"); if (back) openBtn.focus(); }
  openBtn.addEventListener("click", openSide);
  $("#closeSide").addEventListener("click", () => closeSide(true));
  scrim.addEventListener("click", () => closeSide(true));
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && side.classList.contains("open") && drawer()) { closeSide(true); return; }
    if (e.key === "Escape" && S && document.activeElement === ta) stop();
  });
  side.addEventListener("keydown", (e) => {
    if (e.key !== "Tab" || !drawer() || !side.classList.contains("open")) return;
    const f = $$("button:not([disabled]), input, a[href]", side).filter((x) => x.offsetParent);
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  });
  addEventListener("resize", () => { if (!drawer()) closeSide(); jumpCheck(); });

  if (window.ResizeObserver) new ResizeObserver(() => { if (follow) { scroller.scrollTop = scroller.scrollHeight; lastTop = scroller.scrollTop; } jumpCheck(); }).observe($(".dock"));
  renderHist(); renderThread(); renderChips(); fit(); syncSend();
})();
</script>
