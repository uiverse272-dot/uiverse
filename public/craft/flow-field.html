<!doctype html>
<!-- Flow field — Uiverse Originals. Free to use and adapt (MIT). One file, no dependencies.
     Thousands of particles follow an angle field and leave fading trails, like ink in a current.
     Click for a new seed and palette. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flow field</title>
<style>
  * { margin: 0; }
  html, body { height: 100%; overflow: hidden; background: #0d0b14; }
  canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
</style>
</head>
<body>
  <canvas aria-label="Generative flow field. Click for a new one." role="img"></canvas>
<script>
  const cv = document.querySelector("canvas"), ctx = cv.getContext("2d");
  const PALETTES = [
    ["#0d0b14", ["#ff6b6b", "#ffd166", "#f78c6b", "#ef476f"]],
    ["#06141b", ["#2ec4b6", "#cbf3f0", "#5eead4", "#a7f3d0"]],
    ["#120d1f", ["#a78bfa", "#f0abfc", "#818cf8", "#e0e7ff"]],
    ["#f4efe6", ["#1d3557", "#e63946", "#457b9d", "#2a2a2a"]],
  ];
  let W, H, dpr, parts, seed, pal = 0, bg, inks;
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* a smooth pseudo-noise from sines — cheap, seedable, good enough for a field */
  const field = (x, y) => {
    const s = seed;
    return (Math.sin(x * 0.0021 + s) + Math.sin(y * 0.0027 - s * 1.3) + Math.sin((x + y) * 0.0013 + s * 0.7) + Math.sin(Math.hypot(x - W / 2, y - H / 2) * 0.004 - s)) * Math.PI * 0.6;
  };
  function reset() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    seed = Math.random() * 100;
    [bg, inks] = PALETTES[pal];
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    const n = Math.min(2600, Math.floor(W * H / 260));
    parts = Array.from({ length: n }, () => spawn());
  }
  const spawn = () => ({ x: Math.random() * W, y: Math.random() * H, life: 60 + Math.random() * 200, c: inks[Math.floor(Math.random() * inks.length)] });
  function step() {
    /* a translucent wash makes the trails fade */
    ctx.globalAlpha = 0.045; ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 0.75; ctx.lineWidth = 1.1; ctx.lineCap = "round";
    for (const p of parts) {
      const a = field(p.x, p.y), nx = p.x + Math.cos(a) * 1.6, ny = p.y + Math.sin(a) * 1.6;
      ctx.strokeStyle = p.c; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(nx, ny); ctx.stroke();
      p.x = nx; p.y = ny;
      if (--p.life < 0 || nx < 0 || ny < 0 || nx > W || ny > H) Object.assign(p, spawn());
    }
  }
  function loop() { step(); requestAnimationFrame(loop); }
  cv.addEventListener("click", () => { pal = (pal + 1) % PALETTES.length; reset(); });
  addEventListener("resize", reset);
  reset();
  if (still) for (let i = 0; i < 240; i++) step(); else loop();
</script>
</body>
</html>
